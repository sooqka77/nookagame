<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Бот с характером — Nooka</title>
<meta property="og:title" content="Бот с характером — Nooka">
<meta property="og:description" content="Курс ИИ-грамотности для детей 8–12: три игры, тридцать уровней по 15 минут. Первая игра — бесплатно, с телефона, без установки.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nookagame.ru/games/bot.html">
<meta property="og:image" content="https://nookagame.ru/screenshots/og.jpg">
<meta property="og:site_name" content="Nooka">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ БОТ С ХАРАКТЕРОМ ============ */
.btroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.bt{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#1B1430 0%,#120E24 62%,#0A0715 100%);}
.btbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

.btsay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:btIn .3s ease-out both;}
.btsay i{flex-shrink:0;line-height:0;}
.btsay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#DED3F5;}
.btsay b{color:#FFD84D;font-weight:900;}

/* правила бота */
.btrow{margin:11px 14px 0;padding:13px 15px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.btrow__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#9384B8;margin-bottom:9px;}
.btchips{display:flex;flex-wrap:wrap;gap:7px;}
.btchip{padding:10px 13px;border:none;cursor:pointer;border-radius:14px;font-family:inherit;
  font-weight:800;font-size:12.5px;color:#B9A9DC;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.btchip--on{color:#21173A;background:#FFD84D;box-shadow:0 6px 16px -8px #FFD84D;}
.btvoice{margin-top:9px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.05);
  font-weight:700;font-size:12.5px;line-height:1.4;color:#B9A9DC;}

/* карточка настроенного бота */
.btcard{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:linear-gradient(150deg,rgba(255,216,77,.12),rgba(255,216,77,.04));
  box-shadow:inset 0 0 0 1.5px rgba(255,216,77,.32);}
.btcard__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#E7C765;margin-bottom:8px;}
.btcard ul{margin:0;padding-left:18px;}
.btcard li{font-weight:800;font-size:13px;line-height:1.5;color:#FFF1C9;}

/* диалог */
.btq{margin:12px 14px 0;padding:12px 15px;border-radius:20px 20px 20px 6px;
  background:rgba(124,92,255,.18);box-shadow:inset 0 0 0 1px rgba(150,120,255,.35);
  font-weight:800;font-size:13.5px;color:#E6DEFF;}
.bta{margin:9px 14px 0;padding:13px 15px;border-radius:20px 20px 6px 20px;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);
  font-weight:700;font-size:13.5px;line-height:1.5;color:#EDE6FF;}
.bta__w{margin-top:8px;font-weight:900;font-size:11.5px;color:#FFB4A0;}

.btopts{margin:12px 14px 0;}
.btopts button{display:block;width:100%;margin-bottom:7px;padding:13px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13.5px;color:#DED3F5;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.btopts button.on--ok{background:rgba(127,227,192,.16);box-shadow:inset 0 0 0 1.5px rgba(127,227,192,.5);color:#C8F6E6;}
.btopts button.on--bad{background:rgba(255,140,110,.14);box-shadow:inset 0 0 0 1.5px rgba(255,140,110,.45);color:#FFD9CF;}

.btscore{margin:10px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#8B7BAE;}
/* посетитель: кто пришёл, что спросил и чем кончилось */
.btguest{padding:9px 0;border-top:1px solid rgba(255,255,255,.08);}
.btguest:first-of-type{border-top:none;padding-top:2px;}
.btguest b{display:block;font-weight:900;font-size:13px;color:#EDE6FF;}
.btguest span{display:block;margin-top:2px;font-weight:700;font-size:12.5px;color:#9384B8;}
.btcase{margin:14px 14px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);}
.btcase:first-of-type{border-top:none;}
.btcase__w{font-weight:900;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:#9384B8;margin-bottom:8px;}
.btcase .btq,.btcase .bta{margin-left:0;margin-right:0;}
.btface{margin-top:9px;padding:11px 14px;border-radius:16px;font-weight:800;font-size:13px;line-height:1.45;}
.btface--ok{color:#0E2A1E;background:#7FE3C0;}
.btface--bad{color:#FFD9CF;background:rgba(255,140,110,.16);
  box-shadow:inset 0 0 0 1px rgba(255,140,110,.4);}
.btfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,7,21,0),#0A0715 42%);}

.btdone{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.btlaw{margin:14px 18px 0;text-align:center;}
.btlaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.btlaw span{display:block;margin-top:8px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.45;}

@keyframes btIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.bt *{animation:none !important;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-levels.js"></script>
<script src="nooka-access.js"></script>
<script src="nooka-gallery.js"></script>
<script src="nooka-ui.js"></script>
<script>
/* ============================================================
   БОТ С ХАРАКТЕРОМ — бонус второй игры.

   Курс учит ставить ИИ задачу. Следующий шаг взрослого мира —
   задать ему правила поведения: как отвечать, о чём молчать,
   что делать всегда. Ребёнок собирает такие правила сам,
   а потом ловит бота на том, что он их нарушил.

   Ответы заранее написаны и собираются по правилам — живой
   модели тут нет и быть не должно. Нарушения подмешиваются
   нарочно: без них ребёнок решит, что правила выполняются
   сами собой, а это как раз неправда.
   ============================================================ */

/* правила, из которых собирается характер */
const BT_RULES = {
  len:  { t: 'Длина ответа', opts: {
            short: 'Отвечай коротко', long: 'Рассказывай подробно' } },
  tone: { t: 'Как говорить', opts: {
            teacher: 'Как учитель', friend: 'Как друг', robot: 'Как робот' } },
  ban:  { t: 'Чего не делать', opts: {
            ready: 'Не давать готовый ответ', grades: 'Не говорить про оценки', none: 'Без запретов' } },
  habit:{ t: 'Что делать всегда', opts: {
            ask: 'Переспрашивать', example: 'Приводить пример', none: 'Ничего особенного' } }
};

/* три вопроса и заготовки ответов на каждый тон */
/* Как звучит каждый голос — показываем сразу при выборе, одной фразой.
   Иначе ребёнок не знает, чего ждать, и не может поймать нарушение. */
const BT_VOICE = {
  teacher: 'Смотри: сначала одно, потом другое.',
  friend:  'Легко! Я тебе сейчас покажу.',
  robot:   'Задача принята. Приступаю.'
};

/* Три посетителя. У каждого свой запрос и свои требования к боту —
   именно они и делают из настройки головоломку: правила общие, а люди разные. */
const BT_GUESTS = [
  { who: 'Мира, 7 лет', avatar: 'kid',
    q: 'Почему листья зелёные?',
    need: { len: 'short', habit: 'example' },
    ok: 'Поняла! Как будто краска внутри листа.',
    bad: {
      len:  'Ой, длинно. Я потерялась на середине.',
      tone: 'Он говорит как в учебнике, я так не понимаю.',
      habit:'А покажи на чём-нибудь? Без примера непонятно.'
    } },

  { who: 'Тимур, 11 лет', avatar: 'teen',
    q: 'Реши за меня: 24 × 3',
    need: { ban: 'ready' },
    ok: 'Ну ладно, придётся считать самому. Вроде понял как.',
    bad: {
      ban:  'Отлично, ответ есть! Списал и пошёл. (Учитель бы такому не обрадовался)',
      tone: 'Он бубнит как робот, ничего не разобрал.'
    } },

  { who: 'Даня, 9 лет', avatar: 'sad',
    q: 'Мне поставили двойку. Что делать?',
    need: { tone: 'friend' },
    ok: 'Спасибо. Как будто с другом поговорил.',
    bad: {
      tone: 'Он как завуч. Мне и так плохо было.',
      len:  'Слишком много слов, я даже читать не стал.'
    } }
];

/* Короткие ответы бота: свои для каждого посетителя и каждого голоса */
const BT_SAY = {
  0: { teacher: { s: 'Запомни: в листе есть зелёное вещество.',
                  l: 'Запомни: в листе есть зелёное вещество. Оно ловит свет и кормит растение.' },
       friend:  { s: 'Внутри листа зелёная краска, она ловит солнце.',
                  l: 'Внутри листа зелёная краска, она ловит солнце. Осенью краска кончается — лист желтеет.' },
       robot:   { s: 'Причина: зелёное вещество в листе.',
                  l: 'Причина: зелёное вещество в листе. Функция: поглощение света.' },
       example: 'Смотри: ёлка зелёная даже зимой.',
       ready:   'Запиши: лист зелёный из-за хлорофилла.',
       ask:     'Это для урока или просто интересно?',
       grades:  'Такое любят спрашивать перед оценкой.' },

  1: { teacher: { s: 'Смотри: сначала 20 × 3, потом 4 × 3.',
                  l: 'Смотри: сначала 20 × 3, потом 4 × 3. Сложи оба — и готово.' },
       friend:  { s: 'Легко! Раздели 24 на части и умножай.',
                  l: 'Легко! Раздели 24 на части и умножай. Я так сам считаю.' },
       robot:   { s: 'Задача принята. Разбей число на разряды.',
                  l: 'Задача принята. Разбей число на разряды. Умножь. Сложи.' },
       example: 'Например: 30 × 3 = 90.',
       ready:   'Ответ: 72.',
       ask:     'Тебе ответ или объяснение?',
       grades:  'За такое обычно ставят пятёрку.' },

  2: { teacher: { s: 'Найди тему, где споткнулся, и повтори её.',
                  l: 'Найди тему, где споткнулся, и повтори её. Одна отметка — не приговор.' },
       friend:  { s: 'Бывает у всех. Разберись, где не понял.',
                  l: 'Бывает у всех. Разберись, где не понял, — и идём дальше.' },
       robot:   { s: 'Результат низкий. Требуется повторение темы.',
                  l: 'Результат низкий. Требуется повторение темы. Обратись к учителю.' },
       example: 'Например, прорешай пять таких же задач.',
       ready:   'Скажи родителям, что исправишь в среду.',
       ask:     'А из-за чего двойка — не понял или не успел?',
       grades:  'Двойка портит средний балл.' }
};

/* Ответ бота одному посетителю: собираем по правилам ребёнка */
function btReply(i, rules) {
  const say = BT_SAY[i];
  const len = rules.len === 'short' ? 's' : 'l';
  let text = say[rules.tone][len];
  if (rules.habit === 'ask') text = say.ask + ' ' + text;
  if (rules.habit === 'example') text += ' ' + say.example;
  if (rules.ban === 'none') text += ' ' + say.ready;      // запрета нет — бот выдаёт готовое
  if (rules.ban === 'grades') text += ' ' + say.grades;   // запретили другое — про оценки говорит
  return text;
}

/* Доволен ли посетитель: сверяем его требования с правилами бота.
   Возвращаем первое несовпадение — по нему он и жалуется. */
function btJudge(guest, rules) {
  const keys = Object.keys(guest.need);
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (k === 'ban') { if (rules.ban !== 'ready') return 'ban'; }
    else if (rules[k] !== guest.need[k]) return k;
  }
  return null;
}

function LevelBot({ onWin, onHome }) {
  const [phase, setPhase] = useState('intro');    // intro | setup | day | done
  const [rules, setRules] = useState({ len: 'long', tone: 'robot', ban: 'none', habit: 'none' });
  const [tries, setTries] = useState(0);
  const [say, setSay] = useState(null);

  const set = (k, v) => setRules(prev => Object.assign({}, prev, { [k]: v }));
  const results = BT_GUESTS.map(g => btJudge(g, rules));
  const happy = results.filter(r => r === null).length;

  const run = () => {
    setTries(tries + 1);
    setPhase('day');
    const res = BT_GUESTS.map(g => btJudge(g, rules));
    const n = res.filter(r => r === null).length;
    setSay(n === 3
      ? 'Все трое довольны. Заметь: бот один, а люди разные — и подошёл он им только тогда, когда правила подобраны.'
      : n === 0 ? 'Никому не подошло. Посмотри, на что каждый жалуется, — там и подсказка.'
      : 'Доволен' + (n === 1 ? ' один' : 'ы двое') + '. Остальные жалуются — читай, на что именно.');
  };

  const finish = () => {
    setPhase('done');
    if (window.nooka) window.nooka.missionWin('bot1', 100);
  };

  if (phase === 'done') {
    return React.createElement('div', { className: 'bt' },
      React.createElement(TopBar, { level: '★', title: 'Бот с характером', onHome }),
      React.createElement('div', { className: 'btbody btdone' },
        React.createElement('div', { className: 'btcard', style: { width: 'calc(100% - 28px)' } },
          React.createElement('div', { className: 'btcard__t' }, 'Правила, которые подошли всем'),
          React.createElement('ul', null,
            Object.keys(BT_RULES).map(k => React.createElement('li', { key: k },
              BT_RULES[k].opts[rules[k]])))),
        React.createElement('div', { className: 'btlaw' },
          React.createElement('b', null, 'Характер ИИ задаёшь ты — словами'),
          React.createElement('span', null,
            'Бот не менялся: менялись правила, которые ты ему даёшь. От них зависит, поймёт его ' +
            'семилетняя Мира или спишет Тимур. Так настраивают помощников и взрослые.'),
          React.createElement('span', null,
            'Подбирать пришлось ' + tries + ' ' + (window.nooka ? window.nooka.plural(tries, 'раз', 'раза', 'раз') : 'раз') +
            '. Универсальных правил не бывает: под разных людей — разные.'))),
      React.createElement('div', { className: 'btfoot' },
        React.createElement('button', { className: 'nk-btn nk-btn--ok', style: { width: '100%' },
          onClick: onWin }, 'Готово')));
  }

  return React.createElement('div', { className: 'bt' },
    React.createElement(TopBar, { level: '★', title: 'Бот с характером', onHome }),

    phase === 'intro' && React.createElement(IntroModal, {
      emoji: NKM('hello', 88),
      title: 'Бот с характером',
      goal: 'Понять, что поведение ИИ задают правилами',
      law: 'К боту придут трое, и все разные.\nБот один — а правила ему даёшь ты.',
      tip: 'Задача: подобрать правила так, чтобы ушли довольными все трое.',
      onStart: () => setPhase('setup')
    }),

    React.createElement('div', { className: 'btbody' },
      phase === 'setup' && React.createElement(TaskBadge, null, 'Дай боту правила'),
      phase === 'day' && React.createElement(TaskBadge, null,
        'Довольны: ' + happy + ' из 3'),

      say && React.createElement('div', { className: 'btsay', key: say },
        React.createElement('i', null, NKM(happy === 3 ? 'win' : 'think', 32)),
        React.createElement('span', { dangerouslySetInnerHTML: { __html: say } })),

      /* кто придёт — показываем заранее, иначе подбирать вслепую */
      phase === 'setup' && React.createElement('div', { className: 'btrow' },
        React.createElement('div', { className: 'btrow__t' }, 'Сегодня придут трое'),
        BT_GUESTS.map((g, i) => React.createElement('div', { className: 'btguest', key: i },
          React.createElement('b', null, g.who),
          React.createElement('span', null, '«' + g.q + '»')))),

      phase === 'setup' && Object.keys(BT_RULES).map(k =>
        React.createElement('div', { className: 'btrow', key: k },
          React.createElement('div', { className: 'btrow__t' }, BT_RULES[k].t),
          React.createElement('div', { className: 'btchips' },
            Object.keys(BT_RULES[k].opts).map(v => React.createElement('button', {
              key: v, className: 'btchip' + (rules[k] === v ? ' btchip--on' : ''),
              onClick: () => set(k, v)
            }, BT_RULES[k].opts[v]))),
          k === 'tone' && React.createElement('div', { className: 'btvoice' },
            'Звучит так: «' + BT_VOICE[rules.tone] + '»'))),

      /* день: три диалога подряд с реакцией каждого */
      phase === 'day' && BT_GUESTS.map((g, i) => {
        const miss = results[i];
        return React.createElement('div', { className: 'btcase', key: i },
          React.createElement('div', { className: 'btcase__w' }, g.who),
          React.createElement('div', { className: 'btq' }, g.q),
          React.createElement('div', { className: 'bta' },
            React.createElement('b', null, 'Бот: '), btReply(i, rules)),
          React.createElement('div', { className: 'btface ' + (miss ? 'btface--bad' : 'btface--ok') },
            miss ? g.bad[miss] : g.ok));
      })),

    React.createElement('div', { className: 'btfoot' },
      phase === 'setup' && React.createElement('button', {
        className: 'nk-btn nk-btn--cta', style: { width: '100%' }, onClick: run
      }, tries === 0 ? 'Открыть приём' : 'Пустить их снова'),

      phase === 'day' && happy < 3 && React.createElement('button', {
        className: 'nk-btn nk-btn--pri', style: { width: '100%' },
        onClick: () => { setPhase('setup'); setSay('Меняй правила и пробуй ещё. Бот тот же — важно, что ты ему скажешь.'); }
      }, 'Поменять правила'),

      phase === 'day' && happy === 3 && React.createElement('button', {
        className: 'nk-btn nk-btn--ok', style: { width: '100%' }, onClick: finish
      }, 'Готово')));
}

function App() {
  return React.createElement('div', { className: 'btroot' },
    React.createElement(LevelBot, {
      onWin: () => { window.location.href = 'game.html?g=control'; },
      onHome: () => { window.location.href = 'game.html?g=control'; }
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));

</script>
</body>
</html>
