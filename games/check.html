<title>Нейро уверен — Nooka</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* ============ НЕЙРО УВЕРЕН ============ */
.ckroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.ck{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#131024 0%,#0D0A18 62%,#090711 100%);}
.ckbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;justify-content:center;}

/* утверждение Нейро */
.ckclaim{display:flex;gap:11px;align-items:flex-start;margin:0 14px;padding:13px 15px 13px 11px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.ckclaim__a{flex-shrink:0;line-height:0;}
.ckclaim__t{font-weight:900;font-size:15px;line-height:1.32;color:#F2ECFF;}
.cksure{margin-top:7px;position:relative;font-weight:800;font-size:11.5px;color:#8B7BAE;}
.cksure b{color:#FFD84D;}
.cksure i{display:block;height:4px;border-radius:999px;margin-top:5px;max-width:180px;
  background:linear-gradient(90deg,#FFD84D,#FF9A3C);box-shadow:0 0 12px rgba(255,216,77,.5);}

/* сцена опыта */
.ckstage{margin:12px 14px 0;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#171126,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 16px 34px -20px rgba(0,0,0,.9);}
.ckexp{width:100%;display:block;}

/* итог */
.ckres-wrap{min-height:30px;padding:11px 14px 0;}
.ckres{padding:11px 15px;border-radius:18px;animation:ckIn .3s ease-out both;}
.ckres b{display:block;font-weight:900;font-size:14px;line-height:1.3;margin-bottom:3px;}
.ckres span{font-weight:700;font-size:12.5px;line-height:1.4;opacity:.9;}
.ckres--ok{color:#BFF5DF;background:rgba(78,217,155,.15);box-shadow:inset 0 0 0 1px rgba(78,217,155,.42);}
.ckres--bad{color:#FFD8D2;background:rgba(255,107,107,.15);box-shadow:inset 0 0 0 1px rgba(255,107,107,.45);}
.ckres--warn{color:#FFE7C2;background:rgba(255,200,60,.13);box-shadow:inset 0 0 0 1px rgba(255,200,60,.4);}

.ckfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,7,17,0),#090711 42%);}
.ckbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;}

/* финал */
.ckdone{align-items:center;padding-top:6px;}
.ckbadge{width:190px;height:210px;animation:ckPop .5s cubic-bezier(.2,.8,.3,1) both;}
.cklaw{margin:6px 16px 0;text-align:center;}
.cklaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.cklaw span{display:block;margin-top:7px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.4;}
.ckfact{margin:16px 16px 0;padding:12px 15px;border-radius:18px;
  font-weight:700;font-size:12.5px;line-height:1.45;color:#FFF6DC;
  background:linear-gradient(180deg,rgba(255,216,77,.14),rgba(255,216,77,.05));
  box-shadow:inset 0 0 0 1px rgba(255,216,77,.28);}

/* ── анимации опытов ── */
@keyframes ckIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes ckPop{0%{opacity:0;transform:scale(.7);}70%{transform:scale(1.06);}100%{opacity:1;transform:scale(1);}}
@keyframes ckRipple{0%{opacity:.8;transform:scale(.4);}100%{opacity:0;transform:scale(2.4);}}
@keyframes ckDrop{0%{opacity:0;transform:translate(0,0);}20%{opacity:1;}100%{opacity:0;transform:translate(30px,86px);}}

/* лёд: падает, тонет, всплывает */
.ckice{transform:translateY(0);}
.ckexp.ckgo .ckice{animation:ckIce 2.2s cubic-bezier(.3,.7,.4,1) forwards;}
@keyframes ckIce{
  0%{transform:translateY(0);}
  32%{transform:translateY(96px);}
  55%{transform:translateY(112px);}
  78%{transform:translateY(60px);}
  90%{transform:translateY(70px);}
  100%{transform:translateY(64px);}}

.ckexp.ckgo .ckleg .cknum{animation:ckCount .4s ease-out var(--d) forwards;}

.ckexp.ckgo .ckpull{animation:ckPull 1.1s ease-in 1s forwards;}

.ckexp.ckgo .ckstay{animation:ckShrug .5s ease-in-out 1.4s 2;}

.ckexp.ckgo .ckray{animation:ckOut .9s ease-in .3s forwards;}

.ckexp.ckgo .ckmoon{animation:ckDim 1.4s ease-in .6s forwards;}
@keyframes ckDim{to{filter:brightness(.16);}}

/* растение: вода поднимается, листья распрямляются */
.ckflow{stroke-dasharray:100;stroke-dashoffset:100;opacity:0;}
.ckexp.ckgo .ckflow{animation:ckFlow 1.6s ease-out .7s forwards;}

.ckleaf{transform-origin:150px 106px;transform:scaleY(.82) rotate(-4deg);}
.ckexp.ckgo .ckleaf{animation:ckPerk 1s ease-out 1.6s forwards;}
@keyframes ckPerk{to{transform:scaleY(1) rotate(0);}}
.ckexp.ckgo .ckcan{animation:ckCan 1.6s ease-out forwards;}
@keyframes ckCan{0%{transform:translate(-20px,-10px) rotate(-14deg);opacity:0;}
  25%{transform:translate(0,0) rotate(0);opacity:1;}100%{opacity:1;}}

@media (prefers-reduced-motion: reduce){.ckexp *{animation:none !important;}}
