/* ============ ОДИН НЕЙРОН: краны и ведро ============ */
.nnroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.nn{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#161226 0%,#0F0B1E 62%,#090711 100%);}
.nnbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

.nnsay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:nnIn .3s ease-out both;}
.nnsay i{flex-shrink:0;line-height:0;}
.nnsay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#DDD2F2;}
.nnsay b{color:#FFD84D;font-weight:900;}

/* кто сейчас перед Нейро */
.nnwho{margin:11px 14px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:20px;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.nnwho__n b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:16px;color:#F4EEFF;}
.nnwho__n span{display:block;margin-top:2px;font-weight:700;font-size:12px;color:#8B7BAE;}
.nnwho__sw{margin-left:auto;display:flex;gap:6px;}
.nnwho__sw button{width:38px;height:38px;border:none;cursor:pointer;border-radius:12px;padding:0;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.nnwho__sw button.on{box-shadow:inset 0 0 0 2px #FFD84D;background:rgba(255,216,77,.14);}

/* сцена с кранами и ведром */

  background:linear-gradient(180deg,#1A1430,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);}
.nnscene svg{width:100%;display:block;}

  font-weight:800;font-size:12.5px;line-height:1.4;color:#CBB8FF;
  background:rgba(169,139,255,.13);box-shadow:inset 0 0 0 1px rgba(169,139,255,.3);}

.nntap__h em{margin-left:auto;font-style:normal;font-weight:900;font-size:12.5px;color:#FFD84D;}

  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13.5px;color:#DDD2F2;background:rgba(255,255,255,.05);

@keyframes nnPop{0%{opacity:0;transform:scale(.72);}68%{transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}

.nndrop{animation:nnDrop 1.1s linear infinite;}

<script>
/* ============================================================
   ОДИН НЕЙРОН — уровень 1 игры «Что у ИИ внутри».

   Первая версия объясняла перцептрон словами учебника: веса,
   сумма, порог 0.5, формула с дробями. Артём сказал прямо:
   непонятно даже взрослому. Переписано на кран и ведро.

   Внутри всё та же честная математика (вход × вес, сравнение
   с порогом), но на экране её нет: два крана льют воду, ведро
   наполняется, через край — значит «кот».

   Данные подобраны замером: из 16 положений кранов решений два,
   и оба требуют открыть уши настежь. Пока у пса был короткий хвост,

const NN_FULL = 100;                  // ведро полное — нейрон сработал

/* сколько воды даёт признак: острые уши льют щедро, висячие почти нет */
const NN_BEINGS = [

    hint: 'висячие уши, очень длинный хвост' },
  { who: 'Такса Стрелка', cat: false, ears: 20, tail: 20, kind: 'dog',
    hint: 'висячие уши, короткий хвост' },

/* кран: закрыт, приоткрыт, наполовину, настежь */
const NN_TAPS = [
  { t: 'закрыт',   k: 0 },
  { t: 'чуть-чуть', k: 0.4 },
  { t: 'наполовину', k: 0.8 },
  { t: 'настежь',  k: 1.2 },

function NnFace({ kind, size }) {
  const s = size || 44;
  const c = kind === 'cat' ? '#7FE7FF' : '#FFB37A';
  const ears = kind === 'cat'
    ? [React.createElement('path', { key: 'a', d: 'M16 22 L12 6 L28 18' }),
       React.createElement('path', { key: 'b', d: 'M48 22 L52 6 L36 18' })]

      React.createElement('circle', { cx: 32, cy: 36, r: 17 }),

        React.createElement('stop', { offset: '100%', stopColor: '#3C8FD6' })),
      React.createElement('radialGradient', { id: 'nnfull', cx: '.5', cy: '.5' },
        React.createElement('stop', { offset: '0%', stopColor: '#FFD84D', stopOpacity: full ? .5 : 0 }),
        React.createElement('stop', { offset: '100%', stopColor: '#FFD84D', stopOpacity: 0 }))),

    /* краны */
    React.createElement('g', null,
      React.createElement('rect', { x: 86, y: 54, width: 60, height: 42, rx: 12, fill: '#2A2145', stroke: 'rgba(255,255,255,.16)', strokeWidth: 2 }),
      React.createElement('circle', { cx: 116, cy: 46, r: 12, fill: '#FFD84D' }),
      React.createElement('text', { x: 116, y: 82, textAnchor: 'middle', fill: '#CBB8FF', style: { font: '900 11px Nunito,sans-serif' } }, 'УШИ')),
    React.createElement('g', null,
      React.createElement('rect', { x: 194, y: 54, width: 60, height: 42, rx: 12, fill: '#2A2145', stroke: 'rgba(255,255,255,.16)', strokeWidth: 2 }),
      React.createElement('circle', { cx: 224, cy: 46, r: 12, fill: '#FFD84D' }),
      React.createElement('text', { x: 224, y: 82, textAnchor: 'middle', fill: '#CBB8FF', style: { font: '900 11px Nunito,sans-serif' } }, 'ХВОСТ')),

    /* струи */
    stream(116, flowE, '#7FE7FF'),
    stream(224, flowT, '#7FE7FF'),

    /* ведро */
    React.createElement('circle', { cx: 170, cy: 200, r: 96, fill: 'url(#nnfull)' }),
    React.createElement('path', { d: 'M104 152 L236 152 L222 258 L118 258 Z', fill: '#150F28', stroke: 'rgba(255,255,255,.18)', strokeWidth: 2.4 }),
    React.createElement('clipPath', { id: 'nnclip' },
      React.createElement('path', { d: 'M104 152 L236 152 L222 258 L118 258 Z' })),
    React.createElement('g', { clipPath: 'url(#nnclip)' },
      React.createElement('rect', { x: 100, y: waterTop, width: 144, height: 300, fill: 'url(#nnwater)', opacity: .92 })),

    /* черта «полное ведро» */
    React.createElement('path', { d: 'M102 158 L238 158', stroke: full ? '#FFD84D' : 'rgba(255,216,77,.55)', strokeWidth: 3, strokeDasharray: '7 6' }),
    React.createElement('text', { x: 244, y: 156, fill: full ? '#FFD84D' : '#8B7BAE', style: { font: '900 9.5px Nunito,sans-serif' } }, 'ХВАТИТ'),

    /* что Нейро говорит про того, кто сейчас на сцене */

      React.createElement('rect', { x: -62, y: -19, width: 124, height: 38, rx: 19,

      React.createElement('text', { x: 0, y: 6, textAnchor: 'middle',

    wrong && React.createElement('text', { x: 170, y: 250, textAnchor: 'middle', fill: '#FF9E8E',
      style: { font: '900 12px Nunito,sans-serif' } }, 'а это не так!'));
}

function LevelNeuron({ onWin, onHome }) {
  const q = new URLSearchParams(window.location.search);
  const [phase, setPhase] = useState(() => {
    const p = q.get('p');
    return ['play', 'quiz', 'done'].indexOf(p) > -1 ? p : 'intro';
  });
  const [tapE, setTapE] = useState(1);      // кран ушей
  const [tapT, setTapT] = useState(3);      // кран хвоста
  const [who, setWho] = useState(0);        // кто сейчас на сцене
  const [pick, setPick] = useState(null);

  const kE = NN_TAPS[tapE].k, kT = NN_TAPS[tapT].k;
  const water = b => b.ears * kE + b.tail * kT;
  const rows = NN_BEINGS.map(b => {
    const w = water(b), full = w >= NN_FULL;
    return { b: b, w: w, full: full, ok: full === b.cat };
  });
  const good = rows.filter(r => r.ok).length;
  const solved = good === rows.length;
  const cur = rows[who];

  /* Напоминание ровно в тот момент, когда краны наконец настроены: ребёнок
     только что увидел, как это работает, — тут фраза и цепляется за опыт. */
  React.useEffect(() => {
    if (solved) window.nooka.beat('Чтобы Нейро сказал «кот» — примет должно набраться до черты');
  }, [solved]);

  /* ── финал ── */
  if (phase === 'done') {
    return React.createElement('div', { className: 'nn' },
      React.createElement(TopBar, { level: 1, title: 'Один нейрон', onHome, step: 1, total: 1 }),
      React.createElement('div', { className: 'nnbody nndone' },
        React.createElement('svg', { viewBox: '0 0 200 220', className: 'nncard' },
          React.createElement('rect', { x: 10, y: 8, width: 180, height: 204, rx: 20,
            fill: '#2A2145', stroke: '#FFD84D', strokeWidth: 2 }),
          React.createElement('text', { x: 100, y: 38, textAnchor: 'middle', fill: '#FFD84D',
            style: { font: '900 11px Nunito,sans-serif', letterSpacing: '1.4px' } }, 'НЕЙРОН НАСТРОЕН'),
          React.createElement('g', { transform: 'translate(100,110)' },
            React.createElement('circle', { r: 46, fill: 'rgba(255,216,77,.24)' }),
            React.createElement('circle', { r: 33, fill: '#3A2E5E', stroke: '#FFE9A0', strokeWidth: 3 }),
            React.createElement('text', { y: -6, textAnchor: 'middle', fill: '#FFF6DC',
              style: { font: '900 12px Nunito,sans-serif' } }, 'уши'),
            React.createElement('text', { y: 14, textAnchor: 'middle', fill: '#FFD84D',
              style: { font: "700 14px 'Unbounded',Nunito,sans-serif" } }, NN_TAPS[tapE].t)),
          React.createElement('text', { x: 100, y: 182, textAnchor: 'middle', fill: '#F4EEFF',
            style: { font: '900 12px Nunito,sans-serif' } }, 'хвост: ' + NN_TAPS[tapT].t),
          React.createElement('text', { x: 100, y: 200, textAnchor: 'middle', fill: '#C0B0E0',
            style: { font: '700 10px Nunito,sans-serif' } }, 'все четверо угаданы верно')),
        React.createElement('div', { className: 'nnlaw' },
          React.createElement('b', null, 'Внутри ИИ нет мышления'),
          React.createElement('span', null,
            'Нейро не думал и не догадывался. Он сложил две приметы и посмотрел, хватит ли. ' +
            'Какая примета важнее, решаешь ты — и он начинает узнавать котов. ' +
            'В настоящем ИИ таких кусочков миллионы, но каждый делает ровно то же самое.'))),
      React.createElement('div', { className: 'nnfoot' },
        React.createElement('button', {
          className: 'nk-btn nk-btn--ok', style: { width: '100%' }, onClick: onWin,
        }, 'Готово')));
  }

  /* ── проверка связи ── */
  if (phase === 'quiz') {
    const opts = [
      { t: 'Я сделал уши важнее хвоста, а по ушам котов видно', ok: true },
      { t: 'Нейро подумал и сам догадался', ok: false },
      { t: 'Нейро запомнил всех котов по именам', ok: false },
    ];
    return React.createElement('div', { className: 'nn' },
      React.createElement(TopBar, { level: 1, title: 'Один нейрон', onHome, step: 1, total: 1 }),
      React.createElement('div', { className: 'nnbody' },
        React.createElement('div', { className: 'nnq' },
          React.createElement('div', { className: 'nnq__t' }, 'Почему Нейро стал узнавать котов?'),
          opts.map((o, i) => React.createElement('button', {
            key: i, className: pick === i ? (o.ok ? 'on--ok' : 'on--bad') : '',

          }, o.t))),
        pick !== null && React.createElement('div', { className: 'nnsay', style: { marginTop: 12 } },
          React.createElement('i', null, NKM(opts[pick].ok ? 'win' : 'think', 30)),

            : 'Не так. Нейро не думает и никого не запоминает. Он только складывает приметы и смотрит, набралось ли ведро. Важность примет выбираешь ты.'))),
      React.createElement('div', { className: 'nnfoot' },
        React.createElement('button', {
          className: 'nk-btn nk-btn--pri', style: { width: '100%' },
          disabled: pick === null || !opts[pick].ok,
          onClick: () => setPhase('done'),
        }, pick !== null && !opts[pick].ok ? 'Выбери верное' : 'Дальше')));
  }

  /* ── игра ── */
  return React.createElement('div', { className: 'nn' },
    React.createElement(TopBar, { level: 1, title: 'Один нейрон', onHome, step: 1, total: 1 }),

    phase === 'intro' && React.createElement(IntroModal, {

        React.createElement('i', null, NKM(solved ? 'win' : 'hello', 30)),
        React.createElement('span', null, solved
          ? 'Получилось! Я узнаю всех четверых: котов по острым ушам, а хвост почти не слушаю.'
          : 'Уши у котов острые, у собак висячие. А длинный хвост бывает и у кота, и у таксы. Открой посильнее ту примету, по которой кота правда видно.')),

      React.createElement('div', { className: 'nnwho' },
        React.createElement(NnFace, { kind: cur.b.kind, size: 46 }),
        React.createElement('div', { className: 'nnwho__n' },
          React.createElement('b', null, cur.b.who),
          React.createElement('span', null, cur.b.hint)),
        React.createElement('div', { className: 'nnwho__sw' },
          rows.map((r, i) => React.createElement('button', {

            title: r.b.who,
          }, React.createElement(NnFace, { kind: r.b.kind, size: 26 }))))),

      React.createElement('div', { className: 'nnhow' },

      React.createElement('div', { className: 'nnscene' },
        React.createElement(NnScene, {
          flowE: cur.b.ears * kE, flowT: cur.b.tail * kT,

        React.createElement('div', { className: 'nntap__h' },
          React.createElement('b', null, 'Насколько важны уши'),

        React.createElement('div', { className: 'nnsteps' },
          NN_TAPS.map((t, i) => React.createElement('button', {
            key: i, className: tapE === i ? 'on' : '', onClick: () => setTapE(i),
          }, t.t)))),

      React.createElement('div', { className: 'nntap' },
        React.createElement('div', { className: 'nntap__h' },
          React.createElement('b', null, 'Насколько важен хвост'),
          React.createElement('em', null, NN_TAPS[tapT].t)),
        React.createElement('div', { className: 'nnsteps' },
          NN_TAPS.map((t, i) => React.createElement('button', {
            key: i, className: tapT === i ? 'on' : '', onClick: () => setTapT(i),
          }, t.t)))),

      React.createElement('div', { className: 'nnset' },
        React.createElement('div', { className: 'nnset__t' },
          'Что Нейро говорит про всех · верно ' + good + ' из ' + rows.length),
        rows.map((r, i) => React.createElement('div', { key: i, className: 'nnrow' },
          React.createElement(NnFace, { kind: r.b.kind, size: 40 }),
          React.createElement('div', { className: 'nnrow__n' },
            React.createElement('b', null, r.b.who),
            React.createElement('span', null, r.b.cat ? 'это кот' : 'это собака')),
          React.createElement('div', {
            className: 'nnsaid ' + (r.full ? 'nnsaid--cat' : 'nnsaid--no'),
          }, r.full ? 'кот' : 'не кот'),
          React.createElement('div', {

          }, r.ok ? '✓' : '✕')))))    ,

    React.createElement('div', { className: 'nnfoot' },
      React.createElement('button', {
        className: 'nk-btn ' + (solved ? 'nk-btn--ok' : 'nk-btn--soft'), style: { width: '100%' },
        disabled: !solved,
        onClick: () => setPhase('quiz'),
      }, solved ? 'Готово, дальше' : 'Пока верно ' + good + ' из 4')));
}

    React.createElement(LevelNeuron, {
