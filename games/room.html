<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Где спрятан ИИ — Nooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ ГДЕ СПРЯТАН ИИ: фонарь по тёмной комнате ============ */
.rmroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.rm{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#141B2E 0%,#0D1220 62%,#080B14 100%);}
.rmbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

.rmsay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:rmIn .3s ease-out both;}
.rmsay i{flex-shrink:0;line-height:0;}
.rmsay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#DDE6F2;}
.rmsay--ok{background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.3);}
.rmsay--no{background:rgba(255,159,60,.12);box-shadow:inset 0 0 0 1px rgba(255,159,60,.3);}

/* комната */
.rmscene{margin:11px 14px 0;border-radius:20px;overflow:hidden;position:relative;
  background:#070A12;box-shadow:inset 0 0 0 1.5px rgba(126,190,255,.14);}
.rmscene svg{width:100%;display:block;touch-action:none;cursor:crosshair;}

.rmhow{margin:10px 14px 0;padding:10px 14px;border-radius:15px;text-align:center;
  font-weight:800;font-size:12.5px;line-height:1.4;color:#9FD4FF;
  background:rgba(126,190,255,.11);box-shadow:inset 0 0 0 1px rgba(126,190,255,.26);}

/* что сейчас в луче */
.rmpick{margin:10px 14px 0;padding:12px 15px;border-radius:18px;min-height:60px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.rmpick b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:16px;color:#EAF1FA;}
.rmpick span{display:block;margin-top:4px;font-weight:700;font-size:13px;color:#8FA2BC;line-height:1.4;}
.rmpick em{display:block;font-style:normal;font-weight:800;font-size:13px;color:#6B7C94;
  text-align:center;padding:8px 0;}

.rmacts{margin:10px 14px 0;display:flex;gap:8px;}
.rmacts button{flex:1;}

/* счёт */
.rmscore{margin:10px 14px 0;display:flex;gap:6px;}
.rmdot{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.09);}
.rmdot.on{background:#4ED99B;}
.rmdot.bad{background:#FF9F3C;}

.rmfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,11,20,0),#080B14 42%);}
.rmhint{margin:9px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#66788F;}

/* финал */
.rmdone{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.rmlaw{margin:14px 18px 0;text-align:center;}
.rmlaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#EAF1FA;}
.rmlaw span{display:block;margin-top:8px;font-weight:700;font-size:13.5px;color:#93A4BC;line-height:1.45;}
.rmtwo{margin:14px 14px 0;display:flex;gap:9px;}
.rmcol{flex:1;padding:13px 14px;border-radius:18px;}
.rmcol--ai{background:rgba(126,190,255,.1);box-shadow:inset 0 0 0 1px rgba(126,190,255,.3);}
.rmcol--pr{background:rgba(255,216,77,.09);box-shadow:inset 0 0 0 1px rgba(255,216,77,.26);}
.rmcol b{display:block;font-weight:900;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  margin-bottom:7px;}
.rmcol--ai b{color:#7FC8FF;} .rmcol--pr b{color:#FFD84D;}
.rmcol span{display:block;font-weight:700;font-size:12.5px;line-height:1.5;color:#B9C7DA;}

/* проверка связи */
.rmq{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.rmq__t{font-weight:900;font-size:14px;color:#EAF1FA;line-height:1.35;margin-bottom:10px;}
.rmq button{display:block;width:100%;margin-bottom:7px;padding:13px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13.5px;color:#DDE6F2;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.rmq button.on--ok{background:rgba(78,217,155,.16);box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.5);color:#C4F4E0;}
.rmq button.on--bad{background:rgba(255,107,107,.14);box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.45);color:#FFD6CF;}

@keyframes rmIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes rmPop{0%{opacity:0;transform:scale(.72);}68%{transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion: reduce){.rm *{animation:none !important;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>

<script>
/* ============================================================
   ГДЕ СПРЯТАН ИИ — уровень 1 игры «Откуда ИИ знает».
   Первый уровень всего курса: с него ребёнок начинает.

   Раньше здесь стоял модуль старой Академии: другой маскот,
   «Привет, пилот!», «УСТАНОВКА МОДУЛЯ AI-ЯДРО», XP в заголовке.
   Ребёнок открывал курс и попадал в другую игру.

   «Ага» уровня: не всё умное — ИИ. Обычную программу человек
   написал по шагам, и она всегда делает одно и то же. ИИ никто
   не писал по шагам — его научили на примерах, поэтому он
   угадывает и может ошибиться.

   Две вещи специально сбивают с толку: замок с кодом выглядит
   умным, а подсказка слов на клавиатуре — мелочью. Разбирать
   их приходится не по виду, а по признаку.
   ============================================================ */

const RM_R = 84;                        // радиус светового пятна

const RM_THINGS = [
  {
    id: 'speaker', x: 74, y: 78, name: 'Умная колонка',
    what: 'Говоришь ей — она отвечает', ai: true,
    why: 'Её учили на миллионах чужих голосов. Твой она слышит впервые и ищет похожее — поэтому иногда не понимает.',
  },
  {
    id: 'lamp', x: 238, y: 60, name: 'Настольная лампа',
    what: 'Щёлкнул выключателем — горит', ai: false,
    why: 'Человек соединил провода: замкнул — горит. Так будет всегда. Учиться тут нечему.',
  },
  {
    id: 'phone', x: 166, y: 176, name: 'Телефон узнаёт лицо',
    what: 'Посмотрел — разблокировался', ai: true,
    why: 'Ему показали твои фотографии, и он ищет похожее лицо. Брата-близнеца может и перепутать.',
  },
  {
    id: 'clock', x: 290, y: 168, name: 'Будильник',
    what: 'Поставил 7:00 — зазвонит в 7:00', ai: false,
    why: 'Он не решает, а считает время. В семь утра — звонок, и ни разу иначе.',
  },
  {
    id: 'tv', x: 248, y: 250, name: 'Телевизор',
    what: 'Сам предлагает, что смотреть дальше', ai: true,
    why: 'Он запомнил, что ты досматривал до конца, и ищет похожее. У соседа список получается совсем другой.',
  },
  {
    id: 'lock', x: 58, y: 220, name: 'Замок с кодом',
    what: 'Набрал 1234 — открылся', ai: false,
    why: 'Он просто сравнивает: код совпал или нет. Выглядит умным, а внутри одно правило.',
  },
];

/* ── комната ─────────────────────────────────────────────────
   Предметы видны только там, куда падает свет фонаря. Яркость
   считаем по расстоянию, а не маской: так же просто, но не
   ломается на старых мобильных браузерах.                     */
function RmRoom({ light, done, active, onMove, all }) {
  const W = 340, H = 300;
  const ref = React.useRef(null);

  const move = e => {
    const svg = ref.current;
    const pt = svg.createSVGPoint();
    const t = e.touches ? e.touches[0] : e;
    pt.x = t.clientX; pt.y = t.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    onMove({ x: p.x, y: p.y });
  };

  /* когда разобраны все шесть — в комнате зажигается свет */
  const lit = (x, y) => {
    if (all) return 1;
    const d = Math.hypot(x - light.x, y - light.y);
    return Math.max(.05, Math.min(1, (RM_R - d) / RM_R * 1.7));
  };

  const E = React.createElement;

  /* вещи нарисованы цветом, а не контуром: контурные иконки
     читались как схема, а не как комната ребёнка */
  const thing = t => {
    const isDone = done[t.id] !== undefined;
    const isAct = active && active.id === t.id;
    /* выбранная вещь не гаснет, даже если фонарь увели в сторону —
       иначе непонятно, про что сейчас кнопки внизу */
    const o = isAct ? Math.max(.9, lit(t.x, t.y)) : lit(t.x, t.y);
    const mark = isDone ? (done[t.id] ? '#4ED99B' : '#FF9F3C') : null;
    let g;

    if (t.id === 'speaker') {
      g = [
        E('rect', { key: 'b', x: -20, y: -32, width: 40, height: 64, rx: 17, fill: '#2C3550' }),
        E('rect', { key: 'f', x: -15, y: -24, width: 30, height: 40, rx: 13, fill: '#3E4A6B' }),
        /* сетка динамика */
        E('g', { key: 'm', fill: '#2A3350' },
          [0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c =>
            E('circle', { key: r + '-' + c, cx: -9 + c * 6, cy: -19 + r * 9, r: 1.5 })))),
        E('ellipse', { key: 'g', cx: 0, cy: -30, rx: 14, ry: 5, fill: '#7FE0FF', opacity: .85 }),
        E('ellipse', { key: 'g2', cx: 0, cy: -30, rx: 20, ry: 8, fill: '#7FE0FF', opacity: .18 }),
      ];
    } else if (t.id === 'lamp') {
      g = [
        E('path', { key: 'l', d: 'M-26 -4 L26 -4 L15 -30 L-15 -30 Z', fill: '#E8C88A' }),
        E('path', { key: 'l2', d: 'M-26 -4 L26 -4 L20 -10 L-20 -10 Z', fill: '#C9A96A' }),
        E('ellipse', { key: 'gl', cx: 0, cy: 6, rx: 24, ry: 10, fill: '#FFE9A8', opacity: .3 }),
        E('rect', { key: 's', x: -2.5, y: -4, width: 5, height: 30, rx: 2, fill: '#4A5570' }),
        E('ellipse', { key: 'b', cx: 0, cy: 27, rx: 14, ry: 4.5, fill: '#3A4460' }),
      ];
    } else if (t.id === 'phone') {
      g = [
        E('rect', { key: 'b', x: -16, y: -28, width: 32, height: 56, rx: 8, fill: '#2A3248' }),
        E('rect', { key: 's', x: -13, y: -25, width: 26, height: 50, rx: 6, fill: '#16406B' }),
        /* лицо на экране */
        E('circle', { key: 'h', cx: 0, cy: -6, r: 7.5, fill: '#8FD4FF' }),
        E('path', { key: 'sh', d: 'M-10 12 a10 10 0 0 1 20 0 z', fill: '#8FD4FF' }),
        E('rect', { key: 'n', x: -5, y: -25, width: 10, height: 3, rx: 1.5, fill: '#2A3248' }),
      ];
    } else if (t.id === 'clock') {
      g = [
        E('circle', { key: 'r', cx: -14, cy: -18, r: 7, fill: '#B8452F' }),
        E('circle', { key: 'r2', cx: 14, cy: -18, r: 7, fill: '#B8452F' }),
        E('circle', { key: 'b', cx: 0, cy: 2, r: 22, fill: '#C85A3E' }),
        E('circle', { key: 'f', cx: 0, cy: 2, r: 17, fill: '#F5E9D0' }),
        E('path', { key: 'h', d: 'M0 2 L0 -9 M0 2 L8 5', stroke: '#3A3020', strokeWidth: 2.2,
          strokeLinecap: 'round', fill: 'none' }),
        E('circle', { key: 'c', cx: 0, cy: 2, r: 2, fill: '#B8452F' }),
        E('path', { key: 'lg', d: 'M-13 20 l-4 6 M13 20 l4 6', stroke: '#B8452F',
          strokeWidth: 3, strokeLinecap: 'round' }),
      ];
    } else if (t.id === 'tv') {
      g = [
        E('rect', { key: 'b', x: -36, y: -25, width: 72, height: 48, rx: 5, fill: '#242C40' }),
        E('rect', { key: 's', x: -32, y: -21, width: 64, height: 40, rx: 3, fill: '#123A52' }),
        /* кадр на экране: горы и луна */
        E('circle', { key: 'm', cx: 16, cy: -12, r: 5, fill: '#FFE9A8' }),
        E('path', { key: 'h', d: 'M-32 19 L-12 -4 L2 12 L14 0 L32 19 Z', fill: '#2E7C8C' }),
        E('rect', { key: 'st', x: -8, y: 23, width: 16, height: 7, fill: '#3A4460' }),
        E('rect', { key: 'f2', x: -20, y: 29, width: 40, height: 4, rx: 2, fill: '#3A4460' }),
      ];
    } else {
      g = [
        E('rect', { key: 'b', x: -22, y: -26, width: 44, height: 52, rx: 9, fill: '#3A4460' }),
        E('rect', { key: 'd', x: -16, y: -20, width: 32, height: 11, rx: 3, fill: '#1D5E43' }),
        E('path', { key: 'dt', d: 'M-11 -14.5 h4 M-4 -14.5 h4 M3 -14.5 h4 M10 -14.5 h4',
          stroke: '#5BE0A0', strokeWidth: 2.4, strokeLinecap: 'round' }),
        E('g', { key: 'k', fill: '#5A6684' },
          [[-9, -1], [0, -1], [9, -1], [-9, 9], [0, 9], [9, 9], [-9, 19], [0, 19], [9, 19]]
            .map((c, i) => E('circle', { key: i, cx: c[0], cy: c[1], r: 3.2 }))),
      ];
    }

    return E('g', { key: t.id, transform: 'translate(' + t.x + ',' + t.y + ')', opacity: o },
      isAct && E('circle', { r: 44, fill: 'rgba(255,216,77,.13)',
        stroke: '#FFD84D', strokeWidth: 2, strokeDasharray: '6 5' }),
      g,
      /* тёплый блик от фонаря поверх вещи */
      o > .5 && E('circle', { r: 34, fill: '#FFE9A8', opacity: (o - .5) * .16 }),
      isDone && E('circle', { cx: 24, cy: -26, r: 9.5, fill: mark }),
      isDone && E('path', {
        d: done[t.id] ? 'M20 -26 l3 3 l6 -6.5' : 'M21 -29 l6 6 M27 -29 l-6 6',
        stroke: '#0B1220', strokeWidth: 2.4, fill: 'none', strokeLinecap: 'round' }));
  };

  return React.createElement('svg', {
    ref: ref, viewBox: '0 0 ' + W + ' ' + H,
    onPointerMove: move, onPointerDown: move,
  },
    React.createElement('defs', null,
      React.createElement('radialGradient', { id: 'rmglow' },
        React.createElement('stop', { offset: '0%', stopColor: '#FFF3C4', stopOpacity: .26 }),
        React.createElement('stop', { offset: '60%', stopColor: '#FFE08A', stopOpacity: .12 }),
        React.createElement('stop', { offset: '100%', stopColor: '#FFD84D', stopOpacity: 0 }))),

    /* стена и пол */
    React.createElement('rect', { x: 0, y: 0, width: W, height: H, fill: '#0B1120' }),
    React.createElement('rect', { x: 0, y: 0, width: W, height: 268, fill: '#16203A', opacity: all ? 1 : .34 }),
    React.createElement('rect', { x: 0, y: 268, width: W, height: 32, fill: '#241C2C', opacity: all ? 1 : .4 }),
    React.createElement('rect', { x: 0, y: 264, width: W, height: 6, fill: '#3A4460', opacity: all ? 1 : .3 }),

    /* окно в ночное небо — тот же космос, что на всей платформе */
    React.createElement('g', { opacity: Math.max(.07, lit(172, 60)) },
      React.createElement('rect', { x: 136, y: 22, width: 74, height: 78, rx: 4, fill: '#0A1430' }),
      React.createElement('circle', { cx: 192, cy: 38, r: 8, fill: '#F3E6B8', opacity: .9 }),
      [[150, 38], [162, 60], [178, 78], [148, 84], [196, 66], [168, 34]].map((s, i) =>
        React.createElement('circle', { key: i, cx: s[0], cy: s[1], r: i % 2 ? 1.2 : 1.8, fill: '#CFE0F2', opacity: .8 })),
      React.createElement('rect', { x: 136, y: 22, width: 74, height: 78, rx: 4, fill: 'none',
        stroke: '#4A5570', strokeWidth: 3 }),
      React.createElement('path', { d: 'M173 22 v78 M136 61 h74', stroke: '#4A5570', strokeWidth: 3 })),

    /* дверь, на ней замок */
    React.createElement('g', { opacity: Math.max(.07, lit(58, 220)) },
      React.createElement('rect', { x: 14, y: 150, width: 88, height: 118, rx: 3, fill: '#2B2438' }),
      React.createElement('rect', { x: 22, y: 158, width: 72, height: 46, rx: 2, fill: '#332B42' }),
      React.createElement('circle', { cx: 92, cy: 240, r: 3.5, fill: '#C9A96A' })),

    /* полка под колонкой */
    React.createElement('g', { opacity: Math.max(.07, lit(88, 116)) },
      React.createElement('rect', { x: 30, y: 110, width: 116, height: 8, rx: 2, fill: '#4A3E2E' }),
      React.createElement('path', { d: 'M42 118 v8 M134 118 v8', stroke: '#3A3125', strokeWidth: 3 })),

    /* стол под телефоном */
    React.createElement('g', { opacity: Math.max(.07, lit(180, 210)) },
      React.createElement('rect', { x: 118, y: 206, width: 110, height: 8, rx: 2, fill: '#4A3E2E' }),
      React.createElement('path', { d: 'M128 214 v54 M218 214 v54', stroke: '#3A3125', strokeWidth: 4 })),

    /* тумбочка под будильником */
    React.createElement('g', { opacity: Math.max(.07, lit(290, 220)) },
      React.createElement('rect', { x: 258, y: 192, width: 66, height: 76, rx: 3, fill: '#4A3E2E' }),
      React.createElement('rect', { x: 266, y: 202, width: 50, height: 22, rx: 2, fill: '#3A3125' }),
      React.createElement('rect', { x: 266, y: 232, width: 50, height: 22, rx: 2, fill: '#3A3125' })),

    /* тумба под телевизором */
    React.createElement('g', { opacity: Math.max(.07, lit(248, 282)) },
      React.createElement('rect', { x: 206, y: 282, width: 86, height: 18, rx: 3, fill: '#4A3E2E' })),

    /* световое пятно — пока свет в комнате выключен */
    !all && React.createElement('circle', { cx: light.x, cy: light.y, r: RM_R, fill: 'url(#rmglow)' }),
    !all && React.createElement('circle', { cx: light.x, cy: light.y, r: RM_R, fill: 'none',
      stroke: 'rgba(255,216,77,.22)', strokeWidth: 1.5 }),

    RM_THINGS.map(thing));
}

function LevelRoom({ onWin, onHome }) {
  const q = new URLSearchParams(window.location.search);
  const [phase, setPhase] = useState(() => {
    const p = q.get('p');
    return ['play', 'quiz', 'done'].indexOf(p) > -1 ? p : 'intro';
  });
  const [light, setLight] = useState({ x: 170, y: 150 });
  const [picked, setPicked] = useState(null);    // выбранный предмет — не слетает
  const [done, setDone] = useState({});          // id → верно ли ответил
  const [last, setLast] = useState(null);        // что только что разобрали
  const [q1, setQ1] = useState(null);
  const [q2, setQ2] = useState(null);

  /* Выбор залипает. Раньше активным считался предмет под лучом,
     и стоило повести руку вниз к кнопкам — выбор слетал, ответить
     было нечем. Теперь попавший в луч предмет остаётся выбранным,
     пока не ответишь или пока не наведёшь на другой. */
  const aim = (l) => {
    let hit = null, best = 1e9;
    RM_THINGS.forEach(t => {
      if (done[t.id] !== undefined) return;
      const d = Math.hypot(t.x - l.x, t.y - l.y);
      if (d < RM_R * .72 && d < best) { best = d; hit = t; }
    });
    return hit;
  };

  const moveLight = l => {
    setLight(l);
    const hit = aim(l);
    if (hit) setPicked(hit.id);
  };

  const active = RM_THINGS.find(t => t.id === picked && done[t.id] === undefined) || null;

  const answer = isAi => {
    if (!active) return;
    const ok = isAi === active.ai;
    setDone(Object.assign({}, done, { [active.id]: ok }));
    setLast({ t: active, ok: ok });
    setPicked(null);
  };

  const found = Object.keys(done).length;
  const right = Object.values(done).filter(Boolean).length;
  const all = found === RM_THINGS.length;

  /* ── финал ── */
  if (phase === 'done') {
    return React.createElement('div', { className: 'rm' },
      React.createElement(TopBar, { level: 1, title: 'Где спрятан ИИ', onHome, step: 1, total: 1 }),
      React.createElement('div', { className: 'rmbody rmdone' },
        React.createElement('div', { className: 'rmlaw' },
          React.createElement('b', null, 'Не всё умное — это ИИ'),
          React.createElement('span', null,
            'Разница не в том, насколько вещь хитрая, а в том, откуда она знает, что делать.')),
        React.createElement('div', { className: 'rmtwo' },
          React.createElement('div', { className: 'rmcol rmcol--pr' },
            React.createElement('b', null, 'Обычная программа'),
            React.createElement('span', null,
              'Человек написал ей по шагам, что делать. Она всегда делает одно и то же и не ошибается.')),
          React.createElement('div', { className: 'rmcol rmcol--ai' },
            React.createElement('b', null, 'Искусственный интеллект'),
            React.createElement('span', null,
              'Ему по шагам никто не писал. Ему показали много примеров, и он ищет похожее — поэтому иногда ошибается.'))),
        React.createElement('div', { className: 'rmsay', style: { marginTop: 14 } },
          React.createElement('i', null, NKM('win', 30)),
          React.createElement('span', null,
            'Дальше самое интересное: ты сам покажешь мне примеры и посмотришь, чему я научусь.'))),
      React.createElement('div', { className: 'rmfoot' },
        React.createElement('button', {
          className: 'nk-btn nk-btn--ok', style: { width: '100%' }, onClick: onWin,
        }, 'Готово')));
  }

  /* ── проверка связи ── */
  if (phase === 'quiz') {
    const o1 = [
      { t: 'Программе человек написал по шагам, а ИИ показали примеры', ok: true },
      { t: 'ИИ дороже стоит', ok: false },
      { t: 'ИИ работает от электричества, а программа нет', ok: false },
    ];
    const o2 = [
      { t: 'Колонка ищет похожее на то, что слышала, и может не угадать', ok: true },
      { t: 'Колонка старее будильника', ok: false },
      { t: 'Будильник умнее колонки', ok: false },
    ];
    const both = q1 !== null && o1[q1].ok && q2 !== null && o2[q2].ok;
    return React.createElement('div', { className: 'rm' },
      React.createElement(TopBar, { level: 1, title: 'Где спрятан ИИ', onHome, step: 1, total: 1 }),
      React.createElement('div', { className: 'rmbody' },
        React.createElement('div', { className: 'rmq' },
          React.createElement('div', { className: 'rmq__t' }, 'Чем ИИ отличается от обычной программы?'),
          o1.map((o, i) => React.createElement('button', {
            key: i, className: q1 === i ? (o.ok ? 'on--ok' : 'on--bad') : '',
            onClick: () => setQ1(i),
          }, o.t))),
        q1 !== null && React.createElement('div', { className: 'rmsay ' + (o1[q1].ok ? 'rmsay--ok' : ''), style: { marginTop: 10 } },
          React.createElement('i', null, NKM(o1[q1].ok ? 'win' : 'think', 30)),
          React.createElement('span', null, o1[q1].ok
            ? 'Точно. Программа делает записанное, а я — похожее на то, что видел.'
            : 'Не в этом дело. Разница в том, откуда взялось умение: программе его написали по шагам, а мне показали примеры.')),

        React.createElement('div', { className: 'rmq' },
          React.createElement('div', { className: 'rmq__t' }, 'Почему колонка иногда не понимает, а будильник не ошибается никогда?'),
          o2.map((o, i) => React.createElement('button', {
            key: i, className: q2 === i ? (o.ok ? 'on--ok' : 'on--bad') : '',
            onClick: () => setQ2(i),
          }, o.t))),
        q2 !== null && React.createElement('div', { className: 'rmsay ' + (o2[q2].ok ? 'rmsay--ok' : ''), style: { marginTop: 10 } },
          React.createElement('i', null, NKM(o2[q2].ok ? 'win' : 'think', 30)),
          React.createElement('span', null, o2[q2].ok
            ? 'Да. Будильнику угадывать нечего: он считает время. А колонке каждый раз приходится решать, что за слово она услышала.'
            : 'Нет. Дело не в возрасте и не в уме: будильник считает время и ошибиться там негде, а колонка каждый раз угадывает слово.'))),
      React.createElement('div', { className: 'rmfoot' },
        React.createElement('button', {
          className: 'nk-btn nk-btn--pri', style: { width: '100%' }, disabled: !both,
          onClick: () => setPhase('done'),
        }, both ? 'Дальше' : 'Ответь на оба')));
  }

  /* ── игра ── */
  return React.createElement('div', { className: 'rm' },
    React.createElement(TopBar, { level: 1, title: 'Где спрятан ИИ', onHome, step: 1, total: 1 }),

    phase === 'intro' && React.createElement(IntroModal, {
      emoji: NKM('hello', 88),
      title: 'Где спрятан ИИ',
      law: 'В комнате шесть вещей.\nВ одних живёт ИИ, в других — обычная программа.',
      tip: 'Свет выключен. Веди фонарь пальцем и разбирайся, что есть что.',
      onStart: () => setPhase('play'),
    }),

    React.createElement('div', { className: 'rmbody' },
      React.createElement('div', { className: 'rmsay' + (last ? (last.ok ? ' rmsay--ok' : ' rmsay--no') : '') },
        React.createElement('i', null, NKM(last ? (last.ok ? 'win' : 'think') : 'hello', 30)),
        React.createElement('span', null, last
          ? (last.ok ? '' : 'Тут наоборот. ') + last.t.why
          : 'Программу человек написал по шагам. Меня по шагам никто не писал — мне показали примеры.')),

      React.createElement('div', { className: 'rmscene' },
        React.createElement(RmRoom, { light: light, done: done, active: active, onMove: moveLight, all: all })),

      React.createElement('div', { className: 'rmhow' },
        all ? 'Все шесть разобраны'
            : active ? 'Реши про эту вещь — или наведи фонарь на другую'
            : 'Наведи фонарь на вещь'),

      React.createElement('div', { className: 'rmscore' },
        RM_THINGS.map(t => React.createElement('div', {
          key: t.id,
          className: 'rmdot' + (done[t.id] === true ? ' on' : done[t.id] === false ? ' bad' : ''),
        }))),

      React.createElement('div', { className: 'rmpick' },
        active
          ? [React.createElement('b', { key: 'n' }, active.name),
             React.createElement('span', { key: 'w' }, active.what)]
          : React.createElement('em', null, all
              ? 'Готово. Внизу — что дальше'
              : 'Наведи фонарь на вещь')),

      !all && React.createElement('div', { className: 'rmacts' },
        React.createElement('button', {
          className: 'nk-btn ' + (active ? 'nk-btn--pri' : 'nk-btn--soft'),
          disabled: !active, onClick: () => answer(true),
        }, 'Здесь ИИ'),
        React.createElement('button', {
          className: 'nk-btn nk-btn--soft', disabled: !active, onClick: () => answer(false),
        }, 'Просто программа')),

      !all && React.createElement('div', { className: 'rmhint' },
        'Разобрано ' + found + ' из ' + RM_THINGS.length)),

    React.createElement('div', { className: 'rmfoot' },
      React.createElement('button', {
        className: 'nk-btn ' + (all ? 'nk-btn--ok' : 'nk-btn--soft'), style: { width: '100%' },
        disabled: !all, onClick: () => setPhase('quiz'),
      }, all ? 'Готово, дальше' : 'Осталось ' + (RM_THINGS.length - found))));
}

function App() {
  return React.createElement('div', { className: 'rmroot' },
    React.createElement(LevelRoom, {
      onWin: () => {
        if (window.nooka) window.nooka.missionWin('data1', 60);
      },
      onHome: () => { window.location.href = 'game.html?g=data'; },
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
