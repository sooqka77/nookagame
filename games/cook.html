<!doctype html>
<html lang="ru">
<head>

<meta name="theme-color" content="#0E0719">
<title>Шеф-повар — Nooka</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="nooka-ui.css">
<style>

/* ============ ШЕФ-ПОВАР ============ */
.coroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.co{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#1B1226 0%,#120C1B 62%,#0C0813 100%);}
.cobody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

/* гость */
.coguest{margin:0 14px;padding:12px 15px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,216,77,.13),rgba(255,216,77,.05));
  box-shadow:inset 0 0 0 1px rgba(255,216,77,.28);}
.coguest__w{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#E8C86B;}
.coguest__a{margin-top:4px;font-weight:900;font-size:15px;line-height:1.3;color:#FFF6DC;}
.coguest__n{margin-top:7px;padding-top:7px;font-weight:800;font-size:12px;color:#FFC98A;
  border-top:1px dashed rgba(255,216,77,.3);}

/* тарелка */
.costage{position:relative;margin:10px auto 0;width:74%;max-width:280px;}
.costage.cooking .codish{animation:coShake .5s ease-in-out infinite;}
.costeam{position:absolute;left:50%;top:2%;transform:translateX(-50%);display:flex;gap:14px;}
.costeam span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);
  animation:coSteam 1.2s ease-out var(--d) infinite;}

.coname{margin:2px 16px 0;text-align:center;font-family:var(--nk-brand),var(--nk-body);
  font-weight:700;font-size:16.5px;line-height:1.25;color:#F4EEFF;}

/* реплика */
.cosay-wrap{min-height:32px;padding:10px 14px 0;}
.cosay{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:18px;
  font-weight:800;font-size:13.5px;line-height:1.35;color:#D9F5E4;
  background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.4);
  animation:coIn .3s ease-out both;}
.cosay--bad{color:#FFE0DA;background:rgba(255,138,90,.14);box-shadow:inset 0 0 0 1px rgba(255,138,90,.42);}
.cosay__a{flex-shrink:0;line-height:0;}

/* заказ */
.copanel{margin:11px 14px 0;padding:11px 12px 12px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.corow + .corow{margin-top:9px;}
.corow__t{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#9B87BE;margin-bottom:6px;}
.corow__c{display:flex;flex-wrap:wrap;gap:6px;}
.cochip{padding:8px 13px;border:none;border-radius:999px;cursor:pointer;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;white-space:nowrap;
  color:#E4D8F5;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);transition:box-shadow .15s,transform .1s;}
.cochip:hover{box-shadow:inset 0 0 0 1.5px rgba(255,200,90,.5);}
.cochip:active{transform:translateY(2px);}
.cochip--on{color:#2A1A08;background:linear-gradient(180deg,#FFE9A8,#FFD84D);
  box-shadow:0 3px 0 #D9A81C,inset 0 1px 0 rgba(255,255,255,.7);}

.cofoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(12,8,19,0),#0C0813 42%);}

@keyframes coIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes coShake{0%,100%{transform:rotate(-1.2deg);}50%{transform:rotate(1.2deg);}}
@keyframes coSteam{0%{opacity:0;transform:translateY(6px) scale(.6);}
  30%{opacity:.8;}100%{opacity:0;transform:translateY(-26px) scale(1.5);}}
.cohot{animation:coHot 1.4s ease-in-out infinite;}
@keyframes coHot{0%,100%{opacity:.6;}50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){.costage *,.cohot{animation:none !important;}}

/* ── выспрашиваем гостя ── */
.coask{margin:11px 14px 0;}
.coask__h{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;}
.coask__h b{font-weight:900;font-size:14.5px;color:#F4EEFF;}
.coask__h span{margin-left:auto;font-weight:800;font-size:12px;color:#E8C86B;}
.coask__h span.out{color:#FF9A8A;}
.coq{display:block;width:100%;text-align:left;margin-bottom:7px;padding:11px 14px;
  border:none;border-radius:16px;cursor:pointer;font-family:var(--nk-body);
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  transition:box-shadow .15s,transform .1s;}
.coq:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px rgba(255,200,90,.5);}
.coq:active:not(:disabled){transform:translateY(2px);}
.coq:disabled{cursor:default;}
.coq__q{display:block;font-weight:900;font-size:13.5px;color:#E4D8F5;}
.coq--done .coq__q{color:#9B87BE;}
.coq__a{display:block;margin-top:5px;font-weight:800;font-size:13px;color:#FFD98A;line-height:1.35;}

/* блокнот */
.conote{margin:11px 0 0;padding:11px 14px;border-radius:16px;
  background:rgba(78,217,155,.08);box-shadow:inset 0 0 0 1px rgba(78,217,155,.26);}
.conote__t{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#7FD8A8;margin-bottom:6px;}
.conote ul{margin:0;padding-left:18px;}
.conote li{font-weight:800;font-size:13px;color:#D9F5E4;line-height:1.5;}
.conote__e{font-weight:700;font-size:12.5px;color:#7C9B8A;}
.cobtns{display:flex;gap:9px;}

</style>
</head>
