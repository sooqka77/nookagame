<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Смотри в дырочку — Nooka</title>
<meta property="og:title" content="Смотри в дырочку — Nooka">
<meta property="og:description" content="Курс ИИ-грамотности для детей 8–12: три игры, тридцать уровней. Первая игра — бесплатно, с телефона, без установки.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nookagame.ru/games/vision.html">
<meta property="og:image" content="https://nookagame.ru/screenshots/og.jpg">
<meta property="og:site_name" content="Nooka">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ ЧЕРЕЗ ОКОШКО: как ИИ смотрит на картинку ============ */
.vsroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.vs{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#101A2E 0%,#0B1220 62%,#070A12 100%);}
.vsbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

.vssay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:vsIn .3s ease-out both;}
.vssay i{flex-shrink:0;line-height:0;}
.vssay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#D3E2F7;}
.vssay b{color:#7FD8FF;font-weight:900;}

/* холст для рисования */
.vspad{position:relative;margin:12px 14px 0;border-radius:22px;overflow:hidden;
  background:#0A1220;box-shadow:inset 0 0 0 1.5px rgba(127,216,255,.22);}
.vspad canvas{width:100%;display:block;touch-action:none;}
.vspad__hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:13px;color:rgba(210,230,255,.4);text-align:center;padding:0 24px;}

/* две картинки рядом: рисунок и то, что видит ИИ */
.vspair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px 0;}
.vspair figure{margin:0;border-radius:18px;overflow:hidden;background:#0A1220;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1);}
.vspair canvas{width:100%;display:block;}
.vspair figcaption{padding:8px 10px;text-align:center;font-weight:900;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;color:#7E8CA8;}

/* лупа */
.vslens{margin:12px 14px 0;}
.vslens__box{border-radius:18px;overflow:hidden;background:#0A1220;
  box-shadow:inset 0 0 0 1.5px rgba(127,216,255,.3);}
.vslens__box canvas{width:100%;display:block;image-rendering:pixelated;}
.vslens__v{margin-top:8px;padding:9px 10px;border-radius:14px;text-align:center;
  font-weight:900;font-size:12px;line-height:1.35;}
.vslens__v--on{color:#0B1A12;background:#7FE3C0;}
.vslens__v--off{color:#8FA3BF;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.vslens__c{margin-top:7px;text-align:center;font-weight:800;font-size:11.5px;color:#7E8CA8;white-space:nowrap;}
.vslens__cap{margin-bottom:6px;text-align:center;font-weight:900;font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;color:#6B7A93;}

.vsopts{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.vsopts__t{font-weight:900;font-size:13.5px;color:#E6F0FF;line-height:1.35;margin-bottom:10px;}
.vsopts button{display:block;width:100%;margin-bottom:7px;padding:13px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13.5px;color:#D3E2F7;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.vsopts button.on{background:rgba(127,216,255,.16);box-shadow:inset 0 0 0 1.5px rgba(127,216,255,.5);color:#D6F2FF;}
.vsopts button.on--ok{background:rgba(127,227,192,.16);box-shadow:inset 0 0 0 1.5px rgba(127,227,192,.5);color:#C8F6E6;}

.vsacts{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;}
.vshint{margin:9px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#6B7A93;}
.vsfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,10,18,0),#070A12 42%);}

.vsdone{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.vslaw{margin:14px 18px 0;text-align:center;}
.vslaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#E6F0FF;}
.vslaw span{display:block;margin-top:8px;font-weight:700;font-size:13.5px;color:#90A3BF;line-height:1.45;}

@keyframes vsIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.vs *{animation:none !important;}}

/* поле, закрытое непрозрачным слоем: открывается только под пальцем */
.vshole{position:relative;margin:12px 14px 0;border-radius:22px;overflow:hidden;
  background:#070C16;box-shadow:inset 0 0 0 1.5px rgba(127,216,255,.22);touch-action:none;}
.vshole canvas{width:100%;display:block;}
.vshole__tip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:13.5px;color:rgba(200,225,255,.55);text-align:center;padding:0 30px;}
.vsguess{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 14px 0;}
.vsguess button{padding:14px 10px;border:none;border-radius:16px;cursor:pointer;font-family:inherit;
  font-weight:900;font-size:14px;color:#D3E2F7;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.vsguess button.on--ok{background:rgba(127,227,192,.18);box-shadow:inset 0 0 0 1.5px rgba(127,227,192,.55);color:#C8F6E6;}
.vsguess button.on--bad{background:rgba(255,140,110,.15);box-shadow:inset 0 0 0 1.5px rgba(255,140,110,.5);color:#FFD9CF;}
.vsopen{margin:9px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#6B7A93;}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-levels.js"></script>
<script src="nooka-access.js"></script>
<script src="nooka-gallery.js"></script>
<script src="nooka-ui.js"></script>
<script>
/* ============================================================
   СМОТРИ В ДЫРОЧКУ — бонус третьей игры.

   Первая версия объясняла свёртку словами: «окошко ходит по картинке
   и ищет края». Артём показал уровень своему ребёнку — тот не понял
   ничего: «какие окошки, что за окошки». Слово ничего не значило,
   потому что такого опыта у ребёнка нет.

   Переделано на переживание. Картинка закрыта наглухо, открыть её
   можно только маленькой дырочкой под пальцем — и угадать, что там.
   Это тяжело: видно кусок дуги, кусок прямой. Потом Нейро показывает
   ту же картинку так, как видит её сам: все кусочки сразу, но только
   границы. Узнаётся мгновенно.

   Отсюда и урок: ИИ смотрит маленькими окошками — их просто очень
   много, и они смотрят одновременно.
   ============================================================ */

const VS_SIZE = 260;
const VS_HOLE = 26;      // радиус дырочки
const VS_LOOKS = 5;      // сколько раз можно подглядеть: иначе откроется вся картинка

/* Простые контурные картинки: рисуются линией, как детский рисунок */
const VS_PICS = [
  { id: 'house', t: 'Дом', draw: c => {
      c.beginPath(); c.moveTo(45, 210); c.lineTo(45, 120); c.lineTo(130, 55);
      c.lineTo(215, 120); c.lineTo(215, 210); c.closePath(); c.stroke();
      c.strokeRect(105, 145, 50, 65);
      c.beginPath(); c.moveTo(60, 100); c.lineTo(60, 60); c.lineTo(85, 60); c.lineTo(85, 82); c.stroke(); } },
  { id: 'fish', t: 'Рыба', draw: c => {
      c.beginPath(); c.ellipse(120, 130, 70, 42, 0, 0, 6.3); c.stroke();
      c.beginPath(); c.moveTo(190, 130); c.lineTo(235, 95); c.lineTo(235, 165); c.closePath(); c.stroke();
      c.beginPath(); c.arc(88, 115, 6, 0, 6.3); c.stroke();
      c.beginPath(); c.moveTo(120, 92); c.quadraticCurveTo(140, 70, 160, 96); c.stroke(); } },
  { id: 'tree', t: 'Ёлка', draw: c => {
      c.beginPath(); c.moveTo(130, 40); c.lineTo(185, 120); c.lineTo(150, 120);
      c.lineTo(200, 185); c.lineTo(60, 185); c.lineTo(110, 120); c.lineTo(75, 120); c.closePath(); c.stroke();
      c.strokeRect(118, 185, 24, 35); } },
  { id: 'car', t: 'Машина', draw: c => {
      c.beginPath(); c.moveTo(35, 165); c.lineTo(45, 120); c.lineTo(95, 120); c.lineTo(115, 85);
      c.lineTo(180, 85); c.lineTo(195, 120); c.lineTo(225, 130); c.lineTo(225, 165); c.stroke();
      c.beginPath(); c.arc(80, 168, 22, 0, 6.3); c.stroke();
      c.beginPath(); c.arc(185, 168, 22, 0, 6.3); c.stroke();
      c.beginPath(); c.moveTo(147, 85); c.lineTo(147, 120); c.stroke(); } }
];

/* рисуем картинку на холсте */
function vsPaint(cv, pic, color) {
  const c = cv.getContext('2d');
  c.clearRect(0, 0, VS_SIZE, VS_SIZE);
  c.strokeStyle = color || '#7FE7FF';
  c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round';
  pic.draw(c);
}

/* то, как видит картинку ИИ: только границы линий */
function vsEdges(from, to) {
  const w = VS_SIZE, h = VS_SIZE;
  const src = from.getContext('2d').getImageData(0, 0, w, h);
  const a = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = src.data[i * 4 + 3] / 255;
  const ctx = to.getContext('2d');
  const img = ctx.createImageData(w, h);
  const K = [0, -1, 0, -1, 4, -1, 0, -1, 0];
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let s = 0, ki = 0;
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) s += a[(y + dy) * w + (x + dx)] * K[ki++];
      const v = Math.min(1, Math.abs(s));
      const i = (y * w + x) * 4;
      img.data[i] = 30 + v * 225;
      img.data[i + 1] = 45 + v * 190;
      img.data[i + 2] = 70 + v * 90;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ── поле с дырочкой ── */
function VsHole({ pic, onOpen, left }) {
  const base = useRef(null), mask = useRef(null);
  useEffect(() => {
    if (base.current) vsPaint(base.current, pic);
    const mk = mask.current;
    if (mk) {
      const c = mk.getContext('2d');
      c.globalCompositeOperation = 'source-over';
      c.fillStyle = '#0B111D';
      c.fillRect(0, 0, VS_SIZE, VS_SIZE);
    }
  }, [pic]);

  /* Один тап — один взгляд. Раньше дырка стиралась и на движении пальца:
     ребёнок за пару взмахов открывал всю картинку, и угадывать было нечего. */
  const dig = e => {
    if (left <= 0) return;
    const mk = mask.current;
    const r = mk.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * VS_SIZE;
    const y = (e.clientY - r.top) / r.height * VS_SIZE;
    const c = mk.getContext('2d');
    c.globalCompositeOperation = 'destination-out';
    c.beginPath(); c.arc(x, y, VS_HOLE, 0, 6.3); c.fill();
    c.globalCompositeOperation = 'source-over';
    if (onOpen) onOpen();
  };

  return React.createElement('div', { className: 'vshole', onPointerDown: dig },
    React.createElement('canvas', { ref: base, width: VS_SIZE, height: VS_SIZE }),
    React.createElement('canvas', { ref: mask, width: VS_SIZE, height: VS_SIZE,
      style: { position: 'absolute', inset: 0, width: '100%' } }),
    left === VS_LOOKS && React.createElement('div', { className: 'vshole__tip' },
      'Нажми на поле — и подглядишь в одну дырочку'));
}

/* ── картинка целиком или её границы ── */
function VsPlain({ pic, edges }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (!edges) { vsPaint(ref.current, pic); return; }
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = VS_SIZE;
    vsPaint(tmp, pic, '#ffffff');
    vsEdges(tmp, ref.current);
  }, [pic, edges]);
  return React.createElement('canvas', { ref: ref, width: VS_SIZE, height: VS_SIZE,
    style: { width: '100%', display: 'block', borderRadius: 22 } });
}

function LevelVision({ onWin, onHome }) {
  const [phase, setPhase] = useState('intro');   // intro | hole | reveal | fast | quiz | done
  const [pic] = useState(() => VS_PICS[Math.floor(Math.random() * VS_PICS.length)]);
  const [pic2] = useState(() => {
    const rest = VS_PICS.filter(p => true);
    return rest[Math.floor(Math.random() * rest.length)];
  });
  const [digs, setDigs] = useState(0);
  const [pick, setPick] = useState(null);
  const [pick2, setPick2] = useState(null);
  const [say, setSay] = useState(null);
  const [ans, setAns] = useState(null);

  const second = pic2.id === pic.id ? VS_PICS[(VS_PICS.indexOf(pic) + 1) % VS_PICS.length] : pic2;

  const choose = p => {
    setPick(p);
    if (p.id === pic.id) {
      setSay('Угадал — по пяти кусочкам. И это ты, человек, который знает, что такое дом и рыба. ' +
        'А теперь представь, что не знаешь.');
    } else {
      setSay('Мимо: это <b>' + pic.t.toLowerCase() + '</b>. И это нормально — через дырочку почти ничего не видно.');
    }
  };

  const choose2 = p => {
    setPick2(p);
    setSay(p.id === second.id
      ? 'Вот так быстро. А это ведь не сама картинка — это только её границы. Их хватило.'
      : 'Даже так бывает непросто. Но заметь: тут видно всё сразу, а не по кусочку.');
  };

  const finish = () => { setPhase('done'); if (window.nooka) window.nooka.missionWin('vision1', 100); };

  if (phase === 'done') {
    return React.createElement('div', { className: 'vs' },
      React.createElement(TopBar, { level: '★', title: 'Смотри в дырочку', onHome }),
      React.createElement('div', { className: 'vsbody vsdone' },
        React.createElement('div', { style: { width: 'calc(100% - 28px)', margin: '10px 14px 0' } },
          React.createElement(VsPlain, { pic: second, edges: true })),
        React.createElement('div', { className: 'vslaw' },
          React.createElement('b', null, 'ИИ смотрит на картинку по кусочкам'),
          React.createElement('span', null,
            'Он никогда не видит её целиком, как ты. У него много маленьких окошек, и каждое смотрит ' +
            'на свой кусочек — но все сразу. Каждое отмечает одно: есть тут граница или нет.'),
          React.createElement('span', null,
            'Из этих отметок он и собирает ответ. Поэтому на снимке кости он подчёркивает царапину ' +
            'на плёнке так же уверенно, как трещину: граница есть и там, и там.'))),
      React.createElement('div', { className: 'vsfoot' },
        React.createElement('button', { className: 'nk-btn nk-btn--ok', style: { width: '100%' },
          onClick: onWin }, 'Готово')));
  }

  return React.createElement('div', { className: 'vs' },
    React.createElement(TopBar, { level: '★', title: 'Смотри в дырочку', onHome }),

    phase === 'intro' && React.createElement(IntroModal, {
      emoji: NKM('hello', 88),
      title: 'Смотри в дырочку',
      law: 'Я никогда не вижу картинку целиком.\nЯ подглядываю в маленькую дырочку.',
      tip: 'Сейчас попробуешь так же: угадай, что нарисовано, если видно только кусочек.',
      onStart: () => setPhase('hole')
    }),

    React.createElement('div', { className: 'vsbody' },
      phase === 'hole' && React.createElement(TaskBadge, null, 'Что здесь нарисовано?'),
      phase === 'reveal' && React.createElement(TaskBadge, null, 'Вот она целиком'),
      phase === 'fast' && React.createElement(TaskBadge, null, 'А это другая картинка — узнаёшь?'),
      phase === 'quiz' && React.createElement(TaskBadge, null, 'Проверка связи'),

      say && React.createElement('div', { className: 'vssay', key: say },
        React.createElement('i', null, NKM('think', 32)),
        React.createElement('span', { dangerouslySetInnerHTML: { __html: say } })),

      phase === 'hole' && React.createElement(VsHole, { pic: pic, left: VS_LOOKS - digs,
        onOpen: () => setDigs(d => d + 1) }),

      phase === 'hole' && React.createElement('div', { className: 'vsguess' },
        VS_PICS.map(p => React.createElement('button', {
          key: p.id,
          className: !pick ? '' : (p.id === pic.id ? 'on--ok' : (p.id === pick.id ? 'on--bad' : '')),
          onClick: () => { if (!pick) choose(p); }
        }, p.t))),

      phase === 'reveal' && React.createElement('div', { style: { margin: '12px 14px 0' } },
        React.createElement(VsPlain, { pic: pic })),

      phase === 'fast' && React.createElement('div', { style: { margin: '12px 14px 0' } },
        React.createElement(VsPlain, { pic: second, edges: true })),

      phase === 'fast' && React.createElement('div', { className: 'vsguess' },
        VS_PICS.map(p => React.createElement('button', {
          key: p.id,
          className: !pick2 ? '' : (p.id === second.id ? 'on--ok' : (p.id === pick2.id ? 'on--bad' : '')),
          onClick: () => { if (!pick2) choose2(p); }
        }, p.t))),

      phase === 'quiz' && React.createElement('div', { className: 'vsopts' },
        React.createElement('div', { className: 'vsopts__t' },
          'Через дырочку было тяжело, а по границам — легко. Почему?'),
        [['Границ видно сразу много, а в дырочку — по одному кусочку', true],
         ['Вторая картинка была проще', false],
         ['Нейро подсказал ответ', false]].map((o, i) =>
          React.createElement('button', { key: i,
            className: ans === null ? '' : (o[1] ? 'on--ok' : (i === ans ? 'on--bad' : '')),
            onClick: () => { if (ans === null) setAns(o[1] ? i : i); }
          }, o[0]))),

      phase === 'hole' && !pick && React.createElement('div', { className: 'vsopen' },
        digs === 0 ? 'Дырочка маленькая: это и есть всё, что видит ИИ за раз'
          : digs >= VS_LOOKS ? 'Подглядывать больше нельзя — решай, что там нарисовано'
          : 'Осталось подглядываний: ' + (VS_LOOKS - digs))),

    React.createElement('div', { className: 'vsfoot' },
      phase === 'hole' && pick && React.createElement('button', {
        className: 'nk-btn nk-btn--pri', style: { width: '100%' },
        onClick: () => { setPhase('reveal'); setSay('Вот эта же картинка целиком. Тебе хватило одного взгляда — ' +
          'а через дырочку пришлось собирать её по частям.'); }
      }, 'Показать целиком'),

      phase === 'reveal' && React.createElement('button', {
        className: 'nk-btn nk-btn--pri', style: { width: '100%' },
        onClick: () => { setPhase('fast'); setSay('А вот как смотрю я. Это другая картинка, и я показываю не её саму, ' +
          'а только границы — места, где светлое встречается с тёмным. Узнаёшь?'); }
      }, 'А ты как смотришь?'),

      phase === 'fast' && pick2 && React.createElement('button', {
        className: 'nk-btn nk-btn--cta', style: { width: '100%' },
        onClick: () => { setPhase('quiz'); setSay(null); }
      }, 'Дальше'),

      phase === 'quiz' && React.createElement('button', {
        className: ans !== null ? 'nk-btn nk-btn--ok' : 'nk-btn nk-btn--soft',
        style: { width: '100%' }, disabled: ans === null, onClick: finish
      }, ans !== null ? 'Готово' : 'Выбери ответ')));
}

function App() {
  return React.createElement('div', { className: 'vsroot' },
    React.createElement(LevelVision, {
      onWin: () => { window.location.href = 'game.html?g=inside'; },
      onHome: () => { window.location.href = 'game.html?g=inside'; }
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));

</script>
</body>
</html>
