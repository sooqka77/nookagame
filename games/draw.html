<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Нарисуй — и научи — Nooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ ДОСКА: сквозная механика первой игры ============ */
.dwroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.dw{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#131024 0%,#0D0A18 62%,#090711 100%);}
.dwbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

/* реплика Нейро */
.dwsay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:dwIn .3s ease-out both;}
.dwsay i{flex-shrink:0;line-height:0;}
.dwsay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#DDD2F2;}
.dwsay b{color:#9C7BFF;font-weight:900;}
.dwsay--ok{background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.38);}
.dwsay--ok span{color:#C4F4E0;}
.dwsay--bad{background:rgba(255,107,107,.13);box-shadow:inset 0 0 0 1px rgba(255,107,107,.4);}
.dwsay--bad span{color:#FFD6CF;}

/* задача */
.dwtask{margin:11px 14px 0;display:flex;align-items:center;gap:10px;}
.dwtask b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:18px;color:#F4EEFF;}
.dwtask span{margin-left:auto;flex-shrink:0;padding:6px 13px;border-radius:999px;
  font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:13px;color:#1B0F30;
  background:#CBB8FF;}

/* доска */
.dwpad{position:relative;margin:9px 14px 0;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#1A1330,#0C0918);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),0 16px 34px -20px rgba(0,0,0,.9);
  touch-action:none;}
.dwpad canvas{display:block;width:100%;height:auto;cursor:crosshair;}
.dwpad__grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12px 12px,rgba(255,255,255,.16),transparent);
  background-size:24px 24px;}
.dwpad__hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:14px;color:#6B5A90;text-align:center;padding:0 30px;
  line-height:1.5;white-space:pre-line;}

/* инструменты */
.dwtools{margin:10px 14px 0;display:flex;gap:9px;}
.dwtools button{padding:14px;border:none;border-radius:16px;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:14px;transition:transform .1s,filter .15s;}
.dwtool--side{flex:0 0 34%;color:#B4A2D6;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwtool--side:hover{background:rgba(255,255,255,.09);color:#fff;}
.dwtool--main{flex:1;color:#fff;font-size:15.5px;
  background:linear-gradient(180deg,#9B78FF,#7B4FF2 60%,#6E41E4);
  box-shadow:0 5px 0 #5836BD,0 14px 26px -12px rgba(123,79,242,.75);}
.dwtool--main:active{transform:translateY(3px);box-shadow:0 2px 0 #5836BD;}
.dwtools button:disabled{opacity:.35;cursor:default;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  background:rgba(255,255,255,.05);color:#8877AA;}

/* примеры, которые ребёнок уже дал */
.dwset{margin:12px 14px 0;padding:12px 14px;border-radius:19px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);}
.dwset--flash{animation:dwFlash .7s ease-out;}
@keyframes dwFlash{0%{box-shadow:inset 0 0 0 2px #7FE7FF,0 0 30px -6px #7FE7FF;}
  100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);}}
.dwset__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8B7BAE;margin-bottom:9px;}
.dwrow{display:flex;gap:8px;flex-wrap:wrap;}
.dwex{position:relative;width:56px;height:56px;border-radius:13px;overflow:hidden;flex-shrink:0;
  background:#0C0918;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.dwex img{width:100%;height:100%;display:block;}
.dwex--cat{box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.6);}
.dwex--other{box-shadow:inset 0 0 0 1.5px rgba(255,200,60,.55);}
.dwex--fish{box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.6);}
.dwex--near{box-shadow:inset 0 0 0 2px #A98BFF,0 0 18px -4px #A98BFF;}
.dwex--ext{outline:2px dashed rgba(255,200,60,.55);outline-offset:-2px;}
.dwex--mem::after{content:'';position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;
  background:#7FE7FF;box-shadow:0 0 8px #7FE7FF;}
.dwex--miss{box-shadow:inset 0 0 0 2px #FF6B6B,0 0 16px -4px #FF6B6B;}
.dwex--edit{cursor:pointer;transition:transform .12s;width:70px;height:70px;}
.dwex--edit:hover{transform:translateY(-3px) scale(1.04);}
.dwex--edit .dwex__b{font-size:10px;padding:2px 0;}
/* присланные карточки в режиме правки чуть заметнее: с ними и работаем */
.dwex--edit.dwex--ext{outline-color:rgba(255,200,60,.9);}
.dwex__x{position:absolute;right:2px;top:2px;width:17px;height:17px;border:none;cursor:pointer;
  border-radius:50%;background:rgba(10,6,20,.8);color:#FFB4A8;font-size:10px;line-height:17px;padding:0;}
.dwex__b{position:absolute;left:0;right:0;bottom:0;padding:1px 0;text-align:center;
  font-weight:900;font-size:8.5px;letter-spacing:.03em;background:rgba(10,6,20,.72);color:#C9BAE6;}
.dwslot{width:56px;height:56px;border-radius:13px;flex-shrink:0;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px);}

/* итог предсказания */
.dwguess{margin:12px 14px 0;padding:15px 16px;border-radius:20px;animation:dwIn .32s ease-out both;
  background:linear-gradient(180deg,rgba(169,139,255,.16),rgba(169,139,255,.05));
  box-shadow:inset 0 0 0 1.5px rgba(169,139,255,.4);}
.dwguess__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#CBB8FF;}
.dwguess__v{margin-top:6px;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:20px;color:#F4EEFF;}
.dwbar{margin-top:10px;height:9px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;}
.dwbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(90deg,#A98BFF,#7FE7FF);}
.dwguess__n{margin-top:9px;font-weight:700;font-size:12px;color:#A896C9;line-height:1.45;}

/* табло точности */
.dwacc{margin:12px 14px 0;padding:15px 16px;border-radius:20px;animation:dwIn .32s ease-out both;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwacc__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8B7BAE;}
.dwacc__v{display:flex;flex-direction:column;gap:3px;}
.dwacc__v b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:19px;color:#FF9E8E;}
.dwacc--ok .dwacc__v b{color:#7CE9B7;}
.dwacc__v span{font-weight:700;font-size:12px;color:#8B7BAE;}
.dwacc__n{margin-top:9px;font-weight:700;font-size:12px;line-height:1.45;color:#A896C9;}

/* разметка спорных */
.dwtags{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dwtag{border-radius:14px;overflow:hidden;background:#0C0918;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);}
.dwtag img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.dwtag__b{display:flex;}
.dwtag__b button{flex:1;padding:7px 0;border:none;cursor:pointer;font-family:inherit;
  font-weight:900;font-size:10.5px;color:#8B7BAE;background:rgba(255,255,255,.04);}
.dwtag__b button+button{box-shadow:inset 1px 0 0 rgba(255,255,255,.09);}
.dwtag__b button.on{color:#0F0A1C;background:#7FE7FF;}
.dwtag--diff{box-shadow:inset 0 0 0 2px #FFC83C;}
.dwtag__cmp{padding:6px;text-align:center;}
.dwtag__cmp b{display:block;font-weight:900;font-size:10px;color:#7FE7FF;}
.dwtag__cmp span{display:block;margin-top:2px;font-weight:800;font-size:10px;color:#C9BAE6;}

/* выпускной: сбор набора */
.dwtags--4{grid-template-columns:repeat(4,1fr);}
.dwtag--pick img{cursor:pointer;}
.dwtag--pick.on{box-shadow:inset 0 0 0 2.5px #7FE7FF,0 8px 22px -10px #7FE7FF;}
.dwtag--pick.on img{opacity:1;}
.dwtag--pick img{opacity:.55;transition:opacity .15s;}
.dwtag--pick:hover img{opacity:.85;}
.dwtag__lb{width:100%;padding:6px 0;border:none;cursor:pointer;font-family:inherit;
  font-weight:900;font-size:10px;color:#C9BAE6;background:rgba(255,255,255,.06);}
.dwtag__lb:hover{background:rgba(255,255,255,.12);color:#fff;}

/* спор двух моделей */
.dwduel{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwduel__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8B7BAE;margin-bottom:10px;}
.dwduel__row{display:flex;align-items:center;gap:9px;padding:8px 0;
  border-top:1px solid rgba(255,255,255,.07);}
.dwduel__row:first-of-type{border-top:none;}
.dwduel__row img{width:50px;height:50px;border-radius:12px;background:#0C0918;flex-shrink:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.dwduel__a{flex:1;min-width:0;}
.dwduel__a b{display:block;font-weight:800;font-size:9.5px;color:#8B7BAE;}
.dwduel__a span{display:block;margin-top:2px;font-weight:900;font-size:13px;color:#DDD2F2;}
.dwduel__a--diff span{color:#FFC48F;}

/* взлом: обмани Нейро */
.dwguess--broke{background:linear-gradient(180deg,rgba(255,122,100,.18),rgba(255,200,60,.06));
  box-shadow:inset 0 0 0 1.5px rgba(255,150,90,.55);animation:dwShake .5s ease-in-out;}
@keyframes dwShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.dwguess--broke .dwguess__t{color:#FFC48F;}
.dwnear{margin-top:10px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;
  background:rgba(0,0,0,.28);}
.dwnear img{width:46px;height:46px;border-radius:11px;background:#0C0918;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
.dwnear span{font-weight:800;font-size:11.5px;line-height:1.4;color:#C9BAE6;}
.dwhint{margin-top:10px;padding:10px 12px;border-radius:14px;font-weight:700;font-size:12px;
  line-height:1.45;color:#FFE7C2;background:rgba(255,200,60,.12);
  box-shadow:inset 0 0 0 1px rgba(255,200,60,.35);}
.dwhint b{color:#FFD84D;font-weight:900;}
.dwtrophy{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.dwtrophy img{width:120px;height:120px;border-radius:20px;background:#0C0918;
  box-shadow:inset 0 0 0 2px rgba(255,150,90,.6),0 16px 34px -18px rgba(255,150,90,.6);}
.dwtrophy b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:26px;color:#FFC48F;}
.dwtrophy span{font-weight:700;font-size:11.5px;color:#A896C9;text-align:center;max-width:220px;}

/* судейство: где Нейро ошибся */
.dwjudge{margin:11px 14px 0;padding:14px;border-radius:22px;
  background:linear-gradient(180deg,#181227,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);}
.dwjudge__h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;}
.dwjudge__h b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:15px;color:#F4EEFF;}
.dwjudge__h span{margin-left:auto;font-weight:800;font-size:11.5px;color:#8B7BAE;}
.dwjudge__r{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dwjc{position:relative;padding:0 0 5px;border:none;cursor:pointer;border-radius:14px;overflow:hidden;
  background:#0C0918;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;font-family:inherit;
  transition:transform .12s,box-shadow .15s;}
.dwjc:hover:not(:disabled){transform:translateY(-2px);}
.dwjc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.dwjc em{font-style:normal;font-weight:900;font-size:10.5px;color:#C9BAE6;margin-top:4px;}
.dwjc span{font-weight:800;font-size:9px;margin-top:2px;color:#8B7BAE;}
.dwjc--on{box-shadow:inset 0 0 0 2.5px #FFC83C;background:rgba(255,200,60,.1);}
.dwjc--found{box-shadow:inset 0 0 0 2.5px #4ED99B;background:rgba(78,217,155,.12);}
.dwjc--found span{color:#8DEFC2;}
.dwjc--missed{box-shadow:inset 0 0 0 2.5px #FF6B6B;background:rgba(255,107,107,.12);}
.dwjc--missed span{color:#FFB0A4;}
.dwjc--false{box-shadow:inset 0 0 0 2px rgba(255,200,60,.5);}
.dwjc--false span{color:#FFD98F;}
.dwjc--fine{opacity:.5;}
.dwjudge__n{margin-top:11px;font-weight:700;font-size:12px;line-height:1.45;color:#A896C9;}

/* лаборатория: сколько примеров дать */
.dwlab{margin:11px 14px 0;padding:16px;border-radius:22px;
  background:linear-gradient(180deg,#181227,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);}
.dwlab__h{display:flex;align-items:baseline;gap:8px;}
.dwlab__h b{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8B7BAE;}
.dwlab__h em{margin-left:auto;font-style:normal;font-family:var(--nk-brand),var(--nk-body);
  font-weight:700;font-size:26px;color:#7FE7FF;line-height:1;}
.dwlab__h span{font-weight:800;font-size:12px;color:#8B7BAE;}
.dwrange{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:10px 0 4px;
  background:transparent;cursor:pointer;}
.dwrange::-webkit-slider-runnable-track{height:10px;border-radius:999px;
  background:linear-gradient(90deg,#7B4FF2,#7FE7FF);}
.dwrange::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;
  border-radius:50%;background:#fff;box-shadow:0 4px 14px -4px rgba(0,0,0,.9),inset 0 -3px 0 #C9BAE6;}
.dwrange:disabled{opacity:.5;}
.dwlab__lib{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.dwlib{display:flex;gap:4px;flex-wrap:wrap;}
.dwlib__i{width:30px;height:30px;border-radius:8px;overflow:hidden;opacity:.22;
  background:#0C0918;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:opacity .2s,transform .2s;}
.dwlib__i.on{opacity:1;transform:scale(1.04);box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.7);}
.dwlib__i img{width:100%;height:100%;display:block;}
.dwlab__best{margin-top:11px;padding:9px 12px;border-radius:14px;font-weight:800;font-size:12px;
  color:#BFF5DF;background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.35);}

/* экзамен */
.dwexam{margin:12px 14px 0;padding:14px 16px;border-radius:20px;animation:dwIn .3s ease-out both;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwexam__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:16px;color:#F4EEFF;}
.dwexam__r{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;}
.dwec{position:relative;width:52px;height:60px;border-radius:12px;overflow:hidden;
  background:#0C0918;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;}
.dwec img{width:100%;height:44px;object-fit:cover;}
.dwec span{font-weight:900;font-size:9px;line-height:16px;color:#C9BAE6;}
.dwec--wait img{opacity:.3;}
.dwec--ok{box-shadow:inset 0 0 0 1.5px #4ED99B;}
.dwec--ok span{color:#8DEFC2;}
.dwec--bad{box-shadow:inset 0 0 0 1.5px #FF6B6B;}
.dwec--bad span{color:#FFB0A4;}
.dwexam__n{margin-top:10px;font-weight:700;font-size:12px;line-height:1.45;color:#A896C9;}
.dwlabbtns{display:flex;gap:9px;}

/* круги дообучения */
.dwrounds{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.dwrounds__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8B7BAE;margin-bottom:12px;}
.dwrounds__r{display:flex;gap:14px;align-items:flex-end;justify-content:center;}
.dwrd{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;}
.dwrd i{width:34px;height:78px;border-radius:9px;display:block;align-self:center;
  background:linear-gradient(180deg,#A98BFF,#7FE7FF);
  box-shadow:0 8px 20px -10px rgba(169,139,255,.9);transition:height .5s cubic-bezier(.2,.8,.3,1);}
.dwrd b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:14px;color:#F4EEFF;}
.dwrd span{font-weight:800;font-size:10.5px;color:#8B7BAE;}
.dwrd--empty i{background:rgba(255,255,255,.07);height:14px;box-shadow:none;}
.dwrd--empty b{color:#5E4E80;}

/* проверка связи */
.dwq{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.dwq__t{font-weight:900;font-size:13.5px;color:#F2ECFF;line-height:1.35;margin-bottom:10px;}
.dwq button{display:block;width:100%;margin-bottom:7px;padding:12px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13px;color:#DDD2F2;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwq button:hover{background:rgba(255,255,255,.09);}
.dwq button:last-child{margin-bottom:0;}
.dwq button.on--ok{background:rgba(78,217,155,.16);box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.5);color:#C4F4E0;}
.dwq button.on--bad{background:rgba(255,107,107,.14);box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.45);color:#FFD6CF;}

.dwfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,7,17,0),#090711 42%);}

/* финал */
.dwdone{display:flex;flex-direction:column;align-items:center;padding-top:4px;}
.dwpet{width:216px;animation:dwPop .5s cubic-bezier(.2,.8,.3,1) both;}
.dwbadge,.dwdiploma{width:216px;display:block;margin:0 auto;animation:dwPop .5s cubic-bezier(.2,.8,.3,1) both;}
.dwlaw{margin:10px 18px 0;text-align:center;}
.dwlaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.dwlaw span{display:block;margin-top:7px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.45;}

/* финал уровня без артефакта: словарь Нейро */
.dwwords{margin:8px 16px 0;padding:18px 20px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,rgba(127,231,255,.12),rgba(127,231,255,.04));
  box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.3);animation:dwPop .45s cubic-bezier(.2,.8,.3,1) both;}
.dwwords__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7FE7FF;}
.dwwords__r{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.dwword{padding:8px 16px;border-radius:999px;font-family:var(--nk-brand),var(--nk-body);

<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-levels.js"></script>
<script src="nooka-access.js"></script>
<script src="nooka-gallery.js"></script>
<script src="nooka-ui.js"></script>
<script>
/* ============================================================
   ДОСКА — сквозная механика игры «Откуда ИИ знает».
   Ребёнок рисует пальцем, а Нейро действительно учится на его
   рисунках: классификатор считает признаки по растру и сравнивает
   с примерами. Никакой имитации — если примеров мало или они
   похожи друг на друга, Нейро честно промахивается.

   Уровни на этом движке: draw.html?n=2 (научи), 3, 4, 6, 7.
   ============================================================ */

function plural(n, a, b, c) {
  var m = n % 100;
  if (m > 10 && m < 20) return c;
  m = n % 10;
  return m === 1 ? a : (m >= 2 && m <= 4 ? b : c);
}

const DW_SIZE = 300;        // внутренний размер холста: признаки считаем в нём
const DW_PEN = 9;      // тоньше: жирная линия сливалась в кляксу
const DW_GRID = 5;          // сетка признаков 5×5

/* ── признаки рисунка: плотность чернил по клеткам bbox + пропорция ──
   Нормируем по рамке рисунка, поэтому размер и положение на доске
   не важны — важна форма. */
function dwFeatures(cv) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const d = ctx.getImageData(0, 0, W, H).data;
  let minX = W, minY = H, maxX = -1, maxY = -1, ink = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        ink++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0 || ink < 220) return null;          // пусто или почти пусто
  const bw = Math.max(1, maxX - minX + 1), bh = Math.max(1, maxY - minY + 1);
  const cells = new Array(DW_GRID * DW_GRID).fill(0);
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        const gx = Math.min(DW_GRID - 1, Math.floor((x - minX) / bw * DW_GRID));
        const gy = Math.min(DW_GRID - 1, Math.floor((y - minY) / bh * DW_GRID));
        cells[gy * DW_GRID + gx]++;
      }
    }
  }
  /* Одной сетки мало: круглая голова и квадратный дом дают похожие
     плотности при дрожащей руке. Добавляем профиль формы — кольца от
     центра (круглое или угловатое) и секторы по кругу (где выступы). */
  const RING = 4, SECT = 8;
  const rings = new Array(RING).fill(0);
  const sects = new Array(SECT).fill(0);
  const cx = minX + bw / 2, cy = minY + bh / 2;
  const rMax = Math.sqrt(bw * bw + bh * bh) / 2;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        const dx = (x - cx) / (bw / 2), dy = (y - cy) / (bh / 2);   // нормируем по рамке
        const r = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
        rings[Math.min(RING - 1, Math.floor(r * RING))]++;
        let a = Math.atan2(dy, dx) / (Math.PI * 2);
        if (a < 0) a += 1;
        sects[Math.min(SECT - 1, Math.floor(a * SECT))]++;
      }
    }
  }
  const f = cells.map(c => c / ink)
    .concat(rings.map(c => c / ink))
    .concat(sects.map(c => c / ink));
  f.push(Math.max(0, Math.min(1, (bw / bh) / 2)));   // пропорция рамки
  f.push(Math.min(1, ink / (bw * bh)));              // насколько плотно закрашено
  return { f: f, ink: ink, box: [minX, minY, bw, bh] };
}

function dwDist(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; }
  return Math.sqrt(s);
}

/* ── предсказание: ближайший пример (честный kNN, k=1) ──
   Уверенность считается из того, насколько ближайший «свой» ближе
   ближайшего «чужого». Если всё далеко — Нейро говорит, что не знает. */
function dwPredict(model, f) {
  if (!model.length) return null;
  const best = {};
  let near = null;
  model.forEach((m, i) => {
    const d = dwDist(m.f, f);
    if (best[m.label] === undefined || d < best[m.label].d) best[m.label] = { d: d, i: i };
    if (!near || d < near.d) near = { d: d, i: i, label: m.label };
  });
  const labels = Object.keys(best).sort((a, b) => best[a].d - best[b].d);
  const own = best[labels[0]].d;
  const other = labels[1] !== undefined ? best[labels[1]].d : own * 2.2;
  const conf = Math.round(Math.max(52, Math.min(97, other / (own + other) * 100)));
  return {
    label: labels[0], conf: conf, near: near,
    unsure: own > 0.30,                 // ничего похожего в примерах нет (порог из замеров)
    dist: own,
  };
}

/* ── самопроверка: каждый пример предсказываем по всем остальным ──
   Это настоящая проверка на отложенном примере (leave-one-out), а не
   выдуманное число: пример с чужой подписью почти всегда не угадывается,
   поэтому грязь в наборе видно сразу и она чинится на глазах. */
function dwSelfCheck(model) {
  if (model.length < 3) return { ok: 0, total: model.length, acc: 0, wrong: [] };
  var ok = 0; var wrong = [];
  model.forEach(function (m, i) {
    var rest = model.filter(function (_, k) { return k !== i; });
    var p = dwPredict(rest, m.f);
    if (p && p.label === m.label) ok++; else wrong.push(i);
  });
  return { ok: ok, total: model.length, acc: Math.round(ok / model.length * 100), wrong: wrong };
}

/* ── доска ── */
function DwBoard({ api, hint, locked }) {
  const cvRef = useRef(null);
  const st = useRef({ drawing: false, dirty: false });

  useEffect(() => {
    const cv = cvRef.current;
    const ctx = cv.getContext('2d');
    ctx.lineWidth = DW_PEN;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#7FE7FF';

    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * DW_SIZE, (e.clientY - r.top) / r.height * DW_SIZE];
    };
    const down = e => {
      if (locked) return;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      st.current.drawing = true; st.current.dirty = true;
      const [x, y] = pos(e);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .01, y);
      ctx.stroke();
      if (api.onChange) api.onChange(true);
    };
    const move = e => {
      if (!st.current.drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y);
    };
    const up = () => { st.current.drawing = false; };

    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);

    api.canvas = cv;
    api.clear = () => {
      ctx.clearRect(0, 0, DW_SIZE, DW_SIZE);
      st.current.dirty = false;
      if (api.onChange) api.onChange(false);
    };
    api.isEmpty = () => !st.current.dirty;
    /* отладочный хук: рисует заготовку, чтобы проверять уровень без пальца */
    api.stroke = pts => {
      st.current.dirty = true;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      if (api.onChange) api.onChange(true);
    };

    return () => {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerup', up);
      cv.removeEventListener('pointercancel', up);
    };
  }, [locked]);

  return React.createElement('div', { className: 'dwpad' },
    React.createElement('canvas', { ref: cvRef, width: DW_SIZE, height: DW_SIZE }),
    React.createElement('div', { className: 'dwpad__grid' }),
    hint && React.createElement('div', { className: 'dwpad__hint' }, hint));
}

/* ── отладка: draw.html?n=2&demo=1 заполняет модель за ребёнка ──
   Нужно, чтобы проверять поздние фазы уровня без рисования пальцем
   и быстро показывать уровень целиком. В обычной игре не включается. */
function dwSketch(kind, jit, variant) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = DW_SIZE;
  const c = cv.getContext('2d');
  c.lineWidth = DW_PEN; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#7FE7FF';
  const line = pts => {
    c.beginPath();
    pts.forEach((p, i) => {
      const x = p[0] + (Math.random() - .5) * jit, y = p[1] + (Math.random() - .5) * jit;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
  };
  const ring = (cx, cy, rx, ry, step) => {
    const o = [];
    for (let a = 0; a <= 360; a += (step || 14)) {
      const t = a * Math.PI / 180;
      o.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]);
    }
    line(o);
  };
  const v = variant || 0;

  if (kind === 'cat') {
    if (v % 4 === 0) {                     // морда крупным планом
      ring(150, 165, 62, 52);
      line([[100, 125], [92, 72], [136, 110]]);
      line([[200, 125], [210, 72], [166, 110]]);
      line([[92, 168], [46, 158]]);
      line([[208, 168], [254, 158]]);
    } else if (v % 4 === 1) {              // сидит, с хвостом
      ring(150, 96, 34, 30);
      line([[124, 74], [118, 40], [146, 64]]);
      line([[176, 74], [182, 40], [154, 64]]);
      line([[126, 102], [96, 96]]);         // усы
      line([[174, 102], [204, 96]]);
      line([[122, 124], [116, 214], [186, 214], [180, 124]]);
      line([[186, 206], [232, 190], [240, 140]]);
    } else if (v % 4 === 2) {              // стоит боком, хвост трубой
      ring(104, 150, 32, 28);
      line([[82, 128], [76, 96], [100, 120]]);
      line([[126, 128], [132, 96], [108, 120]]);
      line([[80, 158], [50, 152]]);         // усы
      line([[128, 158], [158, 152]]);
      line([[104, 178], [104, 208], [206, 208], [206, 178]]);
      line([[206, 186], [236, 150], [230, 116]]);
      line([[124, 208], [124, 244]]);
      line([[188, 208], [188, 244]]);
    } else {                               // худой, длинные уши
      ring(150, 150, 40, 46);
      line([[126, 112], [112, 52], [148, 100]]);
      line([[174, 112], [190, 52], [152, 100]]);
      line([[124, 156], [88, 150]]);        // усы
      line([[176, 156], [212, 150]]);
      line([[150, 196], [150, 246]]);
      line([[118, 246], [182, 246]]);
    }
  } else if (kind === 'mix') {              // спорные: признаки обоих сразу
    if (v % 6 === 0) {                      // одно ухо торчком, другое висит
      ring(150, 158, 54, 48);
      line([[112, 122], [100, 74], [140, 112]]);
      line([[190, 124], [218, 176], [192, 188], [180, 154]]);
      line([[124, 166], [88, 160]]);
      line([[176, 166], [212, 160]]);
    } else if (v % 6 === 1) {               // длинное тело, острые уши, без усов
      ring(94, 152, 28, 25);
      line([[74, 132], [68, 104], [90, 126]]);
      line([[114, 132], [120, 104], [98, 126]]);
      line([[94, 176], [94, 200], [216, 200], [216, 176]]);
      line([[216, 190], [246, 178]]);
      line([[118, 200], [118, 240]]);
      line([[192, 200], [192, 240]]);
    } else if (v % 6 === 2) {               // висячие уши, но с усами
      ring(150, 156, 52, 46);
      line([[108, 122], [82, 174], [106, 186], [118, 152]]);
      line([[192, 122], [218, 174], [194, 186], [182, 152]]);
      line([[122, 164], [84, 158]]);
      line([[178, 164], [216, 158]]);
      line([[150, 166], [150, 182]]);
    } else if (v % 6 === 3) {               // морда собаки, хвост трубой
      ring(112, 132, 34, 30);
      line([[88, 112], [72, 158], [94, 164]]);
      line([[136, 112], [152, 158], [130, 164]]);
      line([[112, 162], [112, 202], [196, 202]]);
      line([[196, 202], [204, 152], [186, 128]]);
      line([[134, 202], [134, 242]]);
      line([[178, 202], [178, 242]]);
    } else if (v % 6 === 4) {               // круглая голова, крошечные уши
      ring(150, 150, 48, 44);
      line([[124, 110], [118, 88], [140, 104]]);
      line([[176, 110], [182, 88], [160, 104]]);
      line([[150, 160], [150, 176]]);
      line([[128, 188], [172, 188]]);
    } else {                                // длинные уши вверх, вытянутая морда
      ring(146, 168, 40, 42);
      line([[124, 132], [110, 62], [144, 122]]);
      line([[168, 132], [182, 62], [148, 122]]);
      line([[124, 176], [92, 170]]);
      line([[168, 176], [200, 170]]);
      line([[146, 210], [146, 244]]);
    }
  } else if (kind === 'dog') {              // висячие уши и вытянутая морда
    if (v % 4 === 0) {                      // морда крупным планом
      ring(150, 158, 54, 48);
      line([[106, 122], [78, 176], [104, 190], [116, 154]]);    // висячее ухо
      line([[194, 122], [222, 176], [196, 190], [184, 154]]);
      line([[150, 166], [150, 184]]);
      line([[150, 184], [128, 196]]);
      line([[150, 184], [172, 196]]);
      line([[150, 192], [150, 212]]);        // язык
    } else if (v % 4 === 1) {               // сидит анфас, уши до плеч
      ring(150, 104, 36, 32);
      line([[118, 78], [96, 140], [120, 150], [130, 108]]);
      line([[182, 78], [204, 140], [180, 150], [170, 108]]);
      line([[150, 112], [150, 126]]);
      line([[126, 136], [116, 216], [184, 216], [174, 136]]);
      line([[184, 200], [222, 196], [228, 156]]);
    } else if (v % 4 === 2) {               // сидит анфас
      ring(150, 140, 44, 38);
      line([[118, 112], [100, 168], [124, 164]]);
      line([[182, 112], [200, 168], [176, 164]]);
      line([[150, 178], [150, 240]]);
      line([[112, 240], [188, 240]]);
    } else {                                // такса: длинное тело
      ring(96, 150, 28, 24);
      line([[76, 132], [64, 172], [84, 168]]);
      line([[116, 132], [128, 172], [108, 168]]);
      line([[96, 174], [96, 196]]);
      line([[96, 196], [220, 196], [220, 168]]);
      line([[220, 168], [248, 150]]);
      line([[120, 196], [120, 238]]);
      line([[196, 196], [196, 238]]);
    }
  } else {                                  // дома тоже разные
    if (v % 4 === 0) {
      line([[74, 270], [74, 150], [226, 150], [226, 270], [74, 270]]);
      line([[60, 152], [150, 66], [240, 152]]);
      line([[132, 270], [132, 208], [172, 208], [172, 270]]);
    } else if (v % 4 === 1) {              // высокий, два окна
      line([[104, 268], [104, 118], [196, 118], [196, 268], [104, 268]]);
      line([[92, 120], [150, 62], [208, 120]]);
      line([[124, 148], [124, 180], [156, 180], [156, 148], [124, 148]]);
      line([[124, 200], [124, 232], [156, 232], [156, 200], [124, 200]]);
    } else if (v % 4 === 2) {              // широкий, с трубой
      line([[46, 262], [46, 176], [254, 176], [254, 262], [46, 262]]);
      line([[36, 178], [150, 104], [264, 178]]);
      line([[196, 132], [196, 92], [216, 92], [216, 146]]);
      line([[130, 262], [130, 214], [170, 214], [170, 262]]);
    } else {                               // домик с круглым окном
      line([[86, 264], [86, 162], [214, 162], [214, 264], [86, 264]]);
      line([[70, 164], [150, 88], [230, 164]]);
      ring(150, 206, 22, 22, 24);
    }
  }
  return cv;
}

/* уменьшенная копия рисунка — для полоски примеров и для артефакта */
function dwThumb(cv, size) {
  const t = document.createElement('canvas');
  t.width = t.height = size || 64;
  const c = t.getContext('2d');
  c.drawImage(cv, 0, 0, t.width, t.height);
  return t.toDataURL('image/png');
}

/* ── ПАМЯТЬ ДОСКИ ──
   Нейро помнит рисунки ребёнка между уровнями: третий уровень уже не
   заставляет заново рисовать котов, а девятый ломает модель, обученную
   на его же каракулях. Держим до 12 примеров, миниатюры мелкие. */
const dwMemory = {
  KEY: 'nooka_draw_mem',
  load: function () {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (e) { return []; }
  },
  save: function (model) {
    var keep = model.filter(function (m) { return m.f && m.thumb; }).slice(-12)
      .map(function (m) { return { label: m.label, f: m.f, thumb: m.thumb }; });
    try { localStorage.setItem(this.KEY, JSON.stringify(keep)); } catch (e) {}
  },
  /* примеры нужных классов: сначала свои, чем не хватило — дорисуем сами */
  get: function (kinds, each) {
    var mem = this.load(), out = [];
    kinds.forEach(function (k) {
      var mine = mem.filter(function (m) { return m.label === k; }).slice(-each);
      mine.forEach(function (m) { out.push({ label: k, f: m.f, thumb: m.thumb, mem: true }); });
      for (var i = mine.length; i < each; i++) {
        var cv = dwSketch(k, 9 + i * 4, i);
        out.push({ label: k, f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
      }
    });
    return out;
  },
};

/* ── библиотека чужих рисунков и отложенный экзамен ──
   Уровень «Сколько примеров хватит» ничего не рисует: ребёнок решает,
   сколько примеров дать Нейро, и смотрит, как тот сдаёт экзамен на
   рисунках, которых в обучении не было. Экзамен всегда один и тот же —
   иначе попытки не сравнить. */
function dwLibrary(n) {
  const lib = { cat: [], house: [] };
  for (let i = 0; i < n; i++) {
    ['cat', 'house'].forEach(k => {
      const cv = dwSketch(k, 8 + (i % 4) * 4, i);
      lib[k].push({ label: k, f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
    });
  }
  return lib;
}

function dwExam(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const k = i % 2 ? 'house' : 'cat';
    const cv = dwSketch(k, 11 + (i % 3) * 5, i + 1);   // варианты вразнобой с началом библиотеки
    out.push({ label: k, f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
  }
  return out;
}

/* ── сценарии уровней на этом движке ── */
const DW_LEVELS = {
  2: {
    title: 'Нарисуй — и научи',
    mid: 'data2', xp: 80,
    law: 'Нейро не знает, как выглядит кот.\nОн выучит только то, что ты нарисуешь.',
    tip: 'Рисуй пальцем прямо на доске. Сначала два кота, потом два дома.',

    /* карточки, которые ребёнок отобрал */
    (kit || []).slice(0, 8).map((c, i) => React.createElement('image', {
      key: i, href: c.thumb, x: 24 + (i % 4) * 39, y: 70 + Math.floor(i / 4) * 39,
      width: 34, height: 34,
    })),
    React.createElement('text', { x: 100, y: 162, textAnchor: 'middle', fill: '#A896C9',
      style: { font: '700 9px Nunito, sans-serif' } }, 'набор, который ты собрал сам'),
    React.createElement('text', { x: 100, y: 194, textAnchor: 'middle', fill: '#7CE9B7',
      style: { font: "700 26px 'Unbounded', Nunito, sans-serif" } },
      (res ? res.ok : 0) + ' из ' + (res ? res.res.length : 8)),
    React.createElement('text', { x: 100, y: 212, textAnchor: 'middle', fill: '#DDD2F2',
      style: { font: '900 9.5px Nunito, sans-serif' } }, 'на экзамене по невиданным рисункам'),
    React.createElement('text', { x: 100, y: 230, textAnchor: 'middle', fill: '#8B7BAE',
      style: { font: '700 8.5px Nunito, sans-serif' } }, 'данные · подписи · проверка · дообучение'));
}

/* ── уровень ── */
function LevelDraw({ n, onWin, onHome }) {
  const L = DW_LEVELS[n] || DW_LEVELS[2];
  const q = new URLSearchParams(window.location.search);
  const [phase, setPhase] = useState(() => {
    const p = q.get('p');
    return ['play', 'quiz', 'done'].indexOf(p) > -1 ? p : 'intro';
  });
  const [si, setSi] = useState(0);
  const [model, setModel] = useState([]);          // [{label, f, thumb}]
  const [has, setHas] = useState(false);           // на доске что-то есть
  const [guess, setGuess] = useState(null);
  const [pick, setPick] = useState(null);
  const [note, setNote] = useState(null);          // короткая реплика поверх шага
  const [fix, setFix] = useState(false);           // «дай мне ещё один пример»
  const [tries, setTries] = useState(0);           // сколько раз Нейро промахнулся
  const [dirtyAcc, setDirtyAcc] = useState(null);  // точность до чистки набора
  const [flash, setFlash] = useState(false);       // «улетело в набор» — отклик на действие
  const [rounds, setRounds] = useState([]);        // история кругов: с какой уверенностью отвечал
  const [take, setTake] = useState(1);             // сколько рисунков каждого вида берём
  const [exam, setExam] = useState(null);          // ход экзамена: {i, res:[]}
  const [tryLog, setTryLog] = useState([]);        // попытки: {take, ok, total}
  const lab = useRef(null);
  if (!lab.current && L.lab) lab.current = { lib: dwLibrary(L.lab.max), exam: dwExam(L.lab.exam) };
  const [judge, setJudge] = useState(null);        // круг судейства: {cards, marked, checked}
  const [hacks, setHacks] = useState([]);          // попытки взлома: {conf, ok}
  const [tags, setTags] = useState([]);            // мои подписи спорных рисунков
  const [duel, setDuel] = useState(null);          // спор двух моделей
  const [kit, setKit] = useState([]);              // карточки, взятые в набор на выпускном
  const [fin, setFin] = useState(null);            // результат выпускного экзамена
  const fset = useRef(null);
  if (!fset.current && L.final) {
    const F = L.final, lib = [], exam = [];
    /* Позиции вранья выбраны замером: на них подпись реально ломает экзамен
       (4 из 8 против 8 из 8 после чистки). На других позициях одиночная ложь
       тонула среди верных соседей, и проверять подписи было незачем. */
    const LIES = [1, 4, 7, 10];
    for (let i = 0; i < F.lib; i++) {
      const truth = i % 2 ? 'dog' : 'cat';
      const cv = dwSketch(truth, 8 + (i % 3) * 5, Math.floor(i / 2) % 4);
      const lying = LIES.indexOf(i) > -1;
      lib.push({ truth: truth, label: lying ? (truth === 'cat' ? 'dog' : 'cat') : truth,
        f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
    }
    for (let i = 0; i < F.exam; i++) {
      const truth = i % 2 ? 'dog' : 'cat';
      const cv = dwSketch(truth, 12 + (i % 3) * 5, i + 2);
      exam.push({ truth: truth, f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
    }
    fset.current = { lib: lib, exam: exam };
  }

  const tagSet = useRef(null);
  if (!tagSet.current && L.tag) {
    tagSet.current = [];
    for (let i = 0; i < L.tag.count; i++) {
      const cv = dwSketch('mix', 9, i);
      tagSet.current.push({ f: dwFeatures(cv).f, thumb: dwThumb(cv, 96) });
    }
  }
  const [shot, setShot] = useState(null);          // рисунок, которым сбил Нейро

  const [saved, setSaved] = useState(false);
  const api = useRef({});
  const tRef = useRef([]);
  useEffect(() => () => tRef.current.forEach(clearTimeout), []);
  api.current.onChange = setHas;

  /* отладка: собрать модель за ребёнка и встать на проверку */
  useEffect(() => {
    if (!q.get('demo')) return;
    const m = [];
    const labels = L.steps.filter(x => x.kind === 'draw').map(x => x.label);
    (labels.length ? labels : ['cat', 'house']).forEach(lb => {
      [10, 13, 11].forEach(j => {
        const cv = dwSketch(lb, j, 0);
        m.push({ label: lb, f: dwFeatures(cv).f, thumb: dwThumb(cv, 64) });
      });
    });
    setModel(m);
    let ti = L.steps.findIndex(x => x.kind === 'test');
    const forced = parseInt(q.get('step'), 10);      // отладка: встать на нужный шаг
    if (!isNaN(forced) && forced >= 0 && forced < L.steps.length) ti = forced;
    if (ti < 0) ti = L.steps.length - 1;
    setSi(ti);
    if (!q.get('p')) setPhase('play');     // отладка: ?p=done оставляет финал
    const want = L.steps[ti].expect || 'cat';
    const t = setTimeout(() => {          // тестовый рисунок на доске
      const cv = api.current.canvas;
      if (!cv) return;
      cv.getContext('2d').drawImage(dwSketch(want, 14), 0, 0);
      setHas(true);
    }, 120);
    return () => clearTimeout(t);
  }, []);

  const step = L.steps[si];
  const mine = lbl => model.filter(m => m.label === lbl);
  const best = tryLog.filter(t => t.ok === t.total)
    .reduce((a, t) => a === null || t.take < a ? t.take : a, null);
  /* объявляем до финального экрана — он рендерится раньше игровых веток */
  const tagged = L.tag ? tags.filter(Boolean).length : 0;
  const diff = L.tag ? tags.filter((t, i) => t && t !== L.tag.other[i]).length : 0;

  /* Копии рисунков ребёнка с частично слетевшими подписями — в этом и урок.
     Берём именно его рисунки, а не нарисованные за него: тогда чужая подпись —
     единственная причина путаницы, и после починки Нейро перестаёт ошибаться. */
  useEffect(() => {
    if (!step || !step.copy || model.some(m => m.ext)) return;
    const cats = model.filter(m => m.label === 'cat');
    const houses = model.filter(m => m.label === 'house');
    if (!cats.length || !houses.length) return;
    /* копий больше, чем рисунков, — берём по кругу: у каждого своя подпись */
    const add = step.copy.map((label, i) => {
      const src = i % 2 === 0 ? cats[Math.floor(i / 2) % cats.length] : houses[Math.floor(i / 2) % houses.length];
      return { label: label, f: src.f, thumb: src.thumb, ext: true };
    });
    setModel(m => m.concat(add));
  }, [si, model.length]);

  useEffect(() => {
    if (step && step.kind === 'clean' && dirtyAcc === null && model.length > 4) {
      setDirtyAcc(dwSelfCheck(model).acc);
    }
  }, [model, si]);

  /* принять рисунок как пример */
  const accept = () => {
    const cv = api.current.canvas;
    const F = dwFeatures(cv);
    if (!F) { setNote({ m: 'bad', t: 'Тут почти ничего нет. Нарисуй побольше — мне нужно что-то разглядеть.' }); return; }
    const thumb = dwThumb(cv, 64);
    const label = fix ? step.expect : step.label;
    const next = model.concat([{ label: label, f: F.f, thumb: thumb }]);
    setModel(next);
    setNote(null);
    api.current.clear();
    var got = next.filter(m => m.label === label).length;
    setFlash(true);
    if (fix) { setFix(false); setGuess(null); setNote({ m: 'ok', t: 'Запомнил! Теперь пересчитаю.' }); return; }
    if (got >= step.need) setSi(si + 1);
    else setNote({ m: 'ok', t: got === 1
      ? 'Запомнил! Нарисуй ещё — по одному примеру я почти ничего не пойму.'
      : 'Запомнил. Осталось ' + (step.need - got) + '.' });
  };

  /* проверить: что скажет Нейро */
  const check = () => {
    const cv = api.current.canvas;
    const F = dwFeatures(cv);
    if (!F) { setNote({ m: 'bad', t: 'Пусто. Нарисуй ' + step.word + ' — иначе мне нечего узнавать.' }); return; }
    const p = dwPredict(model, F.f);
    setGuess(p);
    setNote(null);
    if (!step.unknown && (p.unsure || p.label !== step.expect)) setTries(tries + 1);
  };

  const WORD = { cat: 'кот', house: 'дом', fish: 'рыба', dog: 'собака' };
  const FLIP = { cat: 'house', house: 'cat' };

  /* Стартовый набор: сначала то, чему ребёнок учил Нейро раньше, потом добор.
     Так третий уровень не заставляет заново рисовать котов, а девятый ломает
     модель, обученную на его же каракулях. */
  useEffect(() => {
    if (model.length) return;
    if (L.preset) setModel(dwMemory.get(L.preset.kinds, L.preset.each));
    else if (L.hack) setModel(dwMemory.get(['cat', 'dog'], L.hack.ready));
  }, []);

  /* что ребёнок нарисовал — остаётся у Нейро на следующий уровень */
  useEffect(() => {
    if (model.length && (phase === 'quiz' || phase === 'done')) dwMemory.save(model);
  }, [phase]);

  /* выпускной экзамен: обучаем на выбранном наборе и проверяем на невиданном */
  const runFinal = () => {
    const M = kit.map(i => fset.current.lib[i]);
    const res = fset.current.exam.map(e => {
      const p = dwPredict(M, e.f);
      return { thumb: e.thumb, truth: e.truth, said: p.label, conf: p.conf, ok: p.label === e.truth };
    });
    setFin({ res: res, ok: res.filter(r => r.ok).length });
  };

  const flipLabel = i => {
    const lib = fset.current.lib;
    lib[i] = Object.assign({}, lib[i], { label: lib[i].label === 'cat' ? 'dog' : 'cat' });
    setFin(null);
    setKit(kit.slice());            // перерисовать подписи
  };

  const togglePick = i => {
    setFin(null);
    setKit(prev => prev.indexOf(i) > -1 ? prev.filter(x => x !== i)
      : prev.length < L.final.budget ? prev.concat([i]) : prev);
  };

  /* две модели: одна с моими подписями, другая с чужими — и один и тот же вопрос */
  const runDuel = () => {
    const mine = model.concat(tagSet.current.map((c, i) => ({ label: tags[i], f: c.f, thumb: c.thumb })));
    const other = model.concat(tagSet.current.map((c, i) => ({ label: L.tag.other[i], f: c.f, thumb: c.thumb })));
    /* спрашиваем про то, где разметки разошлись: рисуем похожие на спорные,
       но не те же самые — иначе модели ответят одинаково и спора не выйдет */
    let idx = tags.map((t, i) => t !== L.tag.other[i] ? i : -1).filter(i => i > -1);
    if (!idx.length) idx = [0, 1, 2];
    const asks = idx.slice(0, 3).map(i => {
      const cv = dwSketch('mix', 15, i);
      const F = dwFeatures(cv);
      return { thumb: dwThumb(cv, 96), mine: dwPredict(mine, F.f), other: dwPredict(other, F.f) };
    });
    setDuel(asks);
  };

  const tryHack = () => {
    const cv = api.current.canvas;
    const F = dwFeatures(cv);
    if (!F) { setNote({ m: 'bad', t: 'Пусто. Нарисуй кота — иначе меня не обмануть.' }); return; }
    const p = dwPredict(model, F.f);
    const broke = p.label === L.hack.goal;
    setGuess(p);
    setHacks(hacks.concat([{ conf: p.conf, ok: broke }]));
    if (broke && (!shot || p.conf > shot.conf)) setShot({ thumb: dwThumb(cv, 96), conf: p.conf });
    setNote(null);
  };

  /* Круг судейства: Нейро отвечает на новые рисунки, ребёнок ищет промахи.
     Отмеченные уходят в набор с истинной подписью — это и есть дообучение.
     Пропущенные ошибки остаются: внимательность имеет цену. */
  const dealRound = (m, done) => {
    const k = L.judge.cards, kinds = L.judge.kinds || ['cat', 'house'];
    const cards = [];
    for (let i = 0; i < k; i++) {
      const kind = kinds[i % kinds.length];
      const variant = (Math.floor(i / kinds.length) + done) % 4;   // виды вперемешку, круги равны по сложности
      const cv = dwSketch(kind, 10 + ((i + done) % 3) * 4, variant);
      const F = dwFeatures(cv);
      const p = dwPredict(m, F.f);
      cards.push({ thumb: dwThumb(cv, 64), truth: kind, f: F.f, said: p ? p.label : kind, conf: p ? p.conf : 50 });
    }
    setJudge({ cards: cards, marked: [], checked: false });
  };

  useEffect(() => {
    if (step && step.kind === 'judge' && !judge && model.length >= 2) dealRound(model, rounds.length);
  }, [si, model.length]);

  const mark = i => {
    if (!judge || judge.checked) return;
    const has = judge.marked.indexOf(i) > -1;
    setJudge(Object.assign({}, judge, {
      marked: has ? judge.marked.filter(x => x !== i) : judge.marked.concat([i]),
    }));
  };

  const checkJudge = () => {
    const wrong = judge.cards.map((c, i) => c.said !== c.truth ? i : -1).filter(i => i > -1);
    const found = judge.marked.filter(i => wrong.indexOf(i) > -1);
    setJudge(Object.assign({}, judge, { checked: true }));
    setRounds(rounds.concat([{ errs: wrong.length, found: found.length, total: judge.cards.length }]));
    /* в набор идёт то, что ребёнок отметил, — с верной подписью */
    const add = judge.marked.map(i => ({
      label: judge.cards[i].truth, f: judge.cards[i].f, thumb: judge.cards[i].thumb,
    }));
    if (add.length) { setModel(model.concat(add)); setFlash(true); }
  };

  const nextRound = () => {
    if (rounds.length >= (L.rounds || 3)) { setPhase('quiz'); return; }
    dealRound(model, rounds.length);
  };

  /* экзамен: Нейро отвечает на рисунки, которых в обучении не было */
  const runExam = () => {
    const M = lab.current.lib.cat.slice(0, take).concat(lab.current.lib.house.slice(0, take));
    const res = lab.current.exam.map(e => {
      const p = dwPredict(M, e.f);
      return { thumb: e.thumb, truth: e.label, said: p.label, conf: p.conf, ok: p.label === e.label };
    });
    setExam({ i: 0, res: res });
    const t = [];
    res.forEach((_, k) => t.push(setTimeout(() => setExam({ i: k + 1, res: res }), 420 * (k + 1))));
    t.push(setTimeout(() => {
      const ok = res.filter(r => r.ok).length;
      setTryLog(l => l.concat([{ take: take, ok: ok, total: res.length }]));
    }, 420 * res.length + 200));
    tRef.current = t;
  };

  /* дообучение на промахе: в набор идёт ровно тот рисунок, что сейчас на доске */
  const teach = () => {
    const cv = api.current.canvas;
    const F = dwFeatures(cv);
    if (!F || !guess) return;
    const done = rounds.concat([{ conf: guess.conf, hit: guess.label === step.expect }]);
    setModel(model.concat([{ label: step.expect, f: F.f, thumb: dwThumb(cv, 64) }]));
    setRounds(done);
    setGuess(null);
    setFlash(true);
    api.current.clear();
    if (done.length >= (L.rounds || 3)) setPhase('quiz');
    else setNote({ m: 'ok', t: 'Взял. Теперь у меня есть и этот пример — попробуй ещё раз.' });
  };

  const relabel = i => {
    setModel(model.map((m, k) => k === i ? Object.assign({}, m, { label: FLIP[m.label] || m.label }) : m));
    setGuess(null);
  };
  const drop = i => { setModel(model.filter((_, k) => k !== i)); setGuess(null); };

  const guessText = g => {
    if (!g) return '';
    /* на шаге «чего я не видел» модель обязана назвать знакомое слово:
       в этом и урок — «я такого не знаю» она сказать не умеет */
    if (g.unsure && !step.unknown) return 'Не пойму, что это';
    return 'Это ' + (WORD[g.label] || g.label);
  };

  const savePet = () => {
    const kind = L.win.show === 'hack' ? 'badge' : L.win.show === 'diploma' ? 'diploma' : 'pet';
    const sel = { badge: '.dwbadge', diploma: '.dwdiploma', pet: '.dwpet' }[kind];
    const meta = {
      badge: { title: 'Значок взломщика', note: 'Рисунок, которым ты сбил Нейро — он был уверен и всё равно ошибся' },
      diploma: { title: 'Диплом питомца', note: 'Набор собран, подписи проверены, экзамен сдан на невиданных рисунках' },
      pet: { title: 'Питомец Нейро', note: 'Узнаёт котов по рисункам, которые ты сделал сам' },
    }[kind];
    const svg = document.querySelector(sel);
    if (svg && window.nookaGallery) {
      window.nookaGallery.add({ kind: kind, game: 'Откуда ИИ знает',
        title: meta.title, note: meta.note, svg: svg.outerHTML });
    }
    setSaved(true);
  };

  /* ── финал ── */
  if (phase === 'done') {
    const shots = mine('cat').map(m => m.thumb);
    const words = [];
    model.forEach(m => { if (words.indexOf(m.label) < 0) words.push(m.label); });
    const hasArt = !!L.win.art;
    return React.createElement('div', { className: 'dw' },
      React.createElement(TopBar, { level: n, title: L.title, onHome, step: 1, total: 1 }),
      React.createElement('div', { className: 'dwbody dwdone' },
        L.win.show === 'diploma'
          ? React.createElement(DwDiploma, {
              res: fin, kit: (kit || []).map(i => fset.current.lib[i]), u: 'd' })
          : L.win.show === 'hack'
          ? React.createElement('div', null,
              React.createElement(DwBadge, { shot: shot, tries: hacks.length, u: 'h' }),
              React.createElement('div', { className: 'dwwords__n', style: { textAlign: 'center', margin: '10px 20px 0' } },
                'Ты нарисовал кота — а он не усомнился ни на секунду.'))
          : hasArt
          ? React.createElement(DwPet, { shots: shots, conf: guess ? guess.conf : 70, u: 'p' })
          : L.win.show === 'tag'
          ? React.createElement('div', { className: 'dwwords' },
              React.createElement('div', { className: 'dwwords__t' }, 'Твоя разметка против чужой'),
              React.createElement('div', { className: 'dwrounds__r', style: { marginTop: 14 } },
                React.createElement('div', { className: 'dwrd' },
                  React.createElement('i', { style: { height: Math.max(12, (L.tag.count - diff) / L.tag.count * 100) + '%' } }),
                  React.createElement('b', null, L.tag.count - diff),
                  React.createElement('span', null, 'совпало')),
                React.createElement('div', { className: 'dwrd' },
                  React.createElement('i', { style: { height: Math.max(12, diff / L.tag.count * 100) + '%',
                    background: 'linear-gradient(180deg,#FF7A64,#FFC83C)' } }),
                  React.createElement('b', null, diff),
                  React.createElement('span', null, 'разошлось'))),
              React.createElement('div', { className: 'dwwords__n' },
                diff
                  ? 'На ' + diff + ' из ' + L.tag.count + ' вы решили по-разному — и обе модели считают себя правыми.'
                  : 'Вы совпали во всём, но это случайность: на других рисунках разошлись бы.'))
          : L.win.show === 'judge'
          ? React.createElement('div', { className: 'dwwords' },
              React.createElement('div', { className: 'dwwords__t' }, 'Ошибки Нейро по кругам'),
              React.createElement('div', { className: 'dwrounds__r', style: { marginTop: 14 } },
                rounds.map((r, i) => React.createElement('div', { key: i, className: 'dwrd' },
                  React.createElement('i', { style: { height: Math.max(12, r.errs / r.total * 100) + '%' } }),
                  React.createElement('b', null, r.errs + ' из ' + r.total),
                  React.createElement('span', null, 'круг ' + (i + 1))))),
              React.createElement('div', { className: 'dwwords__n' },
                rounds.length > 1
                  ? 'В первом круге он ошибся ' + rounds[0].errs + ' ' +
                    plural(rounds[0].errs, 'раз', 'раза', 'раз') + ', в последнем — ' +
                    rounds[rounds.length - 1].errs + '. Между ними только твой разбор.'
                  : 'Ты показал ему промахи, и он их выучил.'))
          : L.win.show === 'lab'
          ? React.createElement('div', { className: 'dwwords' },
              React.createElement('div', { className: 'dwwords__t' }, 'Твои попытки'),
              React.createElement('div', { className: 'dwrounds__r', style: { marginTop: 14 } },
                tryLog.slice(-5).map((t, i) => React.createElement('div', { key: i, className: 'dwrd' },
                  React.createElement('i', { style: { height: Math.max(12, t.ok / t.total * 100) + '%' } }),

          Array.from({ length: Math.max(0, (L.rounds || 3) - rounds.length) }, (_, i) =>
            React.createElement('div', { key: 'e' + i, className: 'dwrd dwrd--empty' },
              React.createElement('i', null),
              React.createElement('b', null, '—'),
              React.createElement('span', null, 'круг ' + (rounds.length + i + 1)))))),

      model.length > 0 && React.createElement('div', {
        className: 'dwset' + (flash ? ' dwset--flash' : ''),
        onAnimationEnd: () => setFlash(false),
      },
        React.createElement('div', { className: 'dwset__t' },
          isClean ? 'Набор Нейро · пунктиром — копии твоих рисунков'
            : isHack ? 'На этом Нейро учился — по ним он и узнаёт'
            : model.some(m => m.mem) ? 'Набор Нейро · часть помнит с прошлых уровней'
            : 'Чему ты его научил'),
        React.createElement('div', { className: 'dwrow' },
          model.map((m, i) => React.createElement('div', {
            key: i,
            className: 'dwex dwex--' + (m.label === 'cat' ? 'cat' : m.label === 'fish' ? 'fish' : 'other') +
              (m.ext ? ' dwex--ext' : '') + (m.mem ? ' dwex--mem' : '') + (isClean ? ' dwex--edit' : '') +

              (guess && guess.near && guess.near.i === i ? ' dwex--near' : ''),
            onClick: isClean ? () => relabel(i) : null,
            title: isClean ? 'Нажми, чтобы поменять подпись' : null,
          },
            React.createElement('img', { src: m.thumb, alt: '' }),
            React.createElement('span', { className: 'dwex__b' }, WORD[m.label] || m.label),
            isClean && React.createElement('button', {
              className: 'dwex__x',
              onClick: e => { e.stopPropagation(); drop(i); },
            }, '✕'))),
          !isTest && Array.from({ length: Math.max(0, step.need - doneCount) }, (_, i) =>
            React.createElement('div', { className: 'dwslot', key: 's' + i }))))),

    React.createElement('div', { className: 'dwfoot' },
      isFinal && React.createElement('button', {
        className: 'nk-btn ' + (passed ? 'nk-btn--ok' : 'nk-btn--pri'), style: { width: '100%' },
        disabled: !kit.length,
        onClick: passed ? () => setPhase('quiz') : runFinal,
      }, passed ? 'Забрать диплом'
        : !kit.length ? 'Выбери карточки'
        : fin ? 'Попробовать снова' : 'На экзамен'),

      isTag && React.createElement('button', {
        className: 'nk-btn ' + (duel ? 'nk-btn--ok' : 'nk-btn--pri'), style: { width: '100%' },
        disabled: !duel && tagged < L.tag.count,
        onClick: duel ? () => setPhase('quiz') : runDuel,
      }, duel ? 'Дальше'
        : tagged < L.tag.count ? 'Подпиши все ' + L.tag.count
        : 'Сравнить с другим разметчиком'),

      isHack && React.createElement('div', { className: 'dwlabbtns' },
        bestHack > 0 && React.createElement('button', {
          className: 'nk-btn nk-btn--ok', style: { flex: 1 }, onClick: () => setPhase('quiz'),
        }, 'Хватит, я его сломал'),
        React.createElement('button', {
          className: 'nk-btn ' + (bestHack ? 'nk-btn--soft' : 'nk-btn--pri'),
          style: bestHack ? {} : { width: '100%' },
          onClick: () => { setGuess(null); api.current.clear(); },
          disabled: !guess,
        }, bestHack ? 'Ещё попытка' : 'Попробовать снова')),

      isJudge && judge && React.createElement('button', {
        className: 'nk-btn ' + (judge.checked ? 'nk-btn--ok' : 'nk-btn--pri'), style: { width: '100%' },
        onClick: judge.checked ? nextRound : checkJudge,
      }, judge.checked
        ? (rounds.length >= (L.rounds || 3) ? 'Дальше' : 'Следующий круг')
        : judge.marked.length ? 'Проверить разбор' : 'Здесь всё верно'),

      isLab && React.createElement('div', { className: 'dwlabbtns' },
        tryLog.length > 0 && React.createElement('button', {
          className: 'nk-btn nk-btn--soft', onClick: () => setPhase('quiz'),
        }, 'Хватит'),
        React.createElement('button', {
          className: 'nk-btn nk-btn--pri', style: { flex: 1 },
          disabled: !!exam && !examDone,
          onClick: runExam,
        }, exam && !examDone ? 'Нейро отвечает…' : tryLog.length ? 'Ещё попытка' : 'Обучить и на экзамен')),

      isClean && React.createElement('button', {
        className: 'nk-btn ' + (audit && !audit.wrong.length ? 'nk-btn--ok' : 'nk-btn--soft'),
        style: { width: '100%' },
        onClick: () => { setSi(si + 1); setGuess(null); api.current.clear(); },
      }, audit && !audit.wrong.length ? 'Готово, проверяем Нейро' : 'Всё равно дальше'),

      !isHack && guess && step.round
        ? React.createElement('button', {
            className: 'nk-btn nk-btn--pri', style: { width: '100%' }, onClick: teach,
          }, 'Отдать Нейро этот рисунок')
        : !isHack && guess && (hit
        ? React.createElement('button', {
            className: 'nk-btn nk-btn--ok', style: { width: '100%' },
            onClick: () => {
              if (si + 1 < L.steps.length) { setSi(si + 1); setGuess(null); api.current.clear(); }
              else setPhase('quiz');
            },
          }, si + 1 < L.steps.length ? 'Понятно, дальше' : 'Дальше')
        : React.createElement('button', {
            className: 'nk-btn nk-btn--pri', style: { width: '100%' },
            onClick: () => { setFix(true); setGuess(null); api.current.clear(); },
          }, 'Дать ещё пример'))));
}

function App() {
  const q = new URLSearchParams(window.location.search);
  const n = parseInt(q.get('n'), 10) || 2;
  const L = DW_LEVELS[n] || DW_LEVELS[2];
  return React.createElement('div', { className: 'dwroot' },
    React.createElement(LevelDraw, {
      n: n,
      onWin: () => {
        if (window.nooka) window.nooka.missionWin(L.mid, L.xp, { nextLabel: 'В коллекцию →' });
        setTimeout(() => { window.location.href = '../base/index.html#gallery'; }, 400);
      },
      onHome: () => { window.location.href = 'game.html?g=data'; },
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
