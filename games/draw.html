<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Нарисуй — и научи — Nooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ ДОСКА: сквозная механика первой игры ============ */
.dwroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.dw{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#131024 0%,#0D0A18 62%,#090711 100%);}
.dwbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

/* реплика Нейро */
.dwsay{display:flex;gap:10px;align-items:flex-start;margin:2px 14px 0;padding:13px 15px;
  border-radius:20px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);animation:dwIn .3s ease-out both;}
.dwsay i{flex-shrink:0;line-height:0;}
.dwsay span{font-weight:700;font-size:13.5px;line-height:1.45;color:#DDD2F2;}
.dwsay b{color:#9C7BFF;font-weight:900;}
.dwsay--ok{background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.38);}
.dwsay--ok span{color:#C4F4E0;}
.dwsay--bad{background:rgba(255,107,107,.13);box-shadow:inset 0 0 0 1px rgba(255,107,107,.4);}
.dwsay--bad span{color:#FFD6CF;}

/* задача */
.dwtask{margin:11px 14px 0;display:flex;align-items:center;gap:10px;}
.dwtask b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:16px;color:#F4EEFF;}
.dwtask span{margin-left:auto;flex-shrink:0;padding:5px 11px;border-radius:999px;
  font-weight:900;font-size:11.5px;color:#CBB8FF;background:rgba(169,139,255,.16);
  box-shadow:inset 0 0 0 1px rgba(169,139,255,.32);}

/* доска */
.dwpad{position:relative;margin:9px 14px 0;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#1A1330,#0C0918);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),0 16px 34px -20px rgba(0,0,0,.9);
  touch-action:none;}
.dwpad canvas{display:block;width:100%;height:auto;cursor:crosshair;}
.dwpad__grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12px 12px,rgba(255,255,255,.16),transparent);
  background-size:24px 24px;}
.dwpad__hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:13.5px;color:#5E4E80;text-align:center;padding:0 30px;}

/* инструменты */
.dwtools{margin:10px 14px 0;display:flex;gap:9px;}
.dwtools button{flex:1;padding:12px;border:none;border-radius:16px;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:13.5px;color:#D6CBEC;
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwtools button:hover{background:rgba(255,255,255,.09);color:#fff;}
.dwtools button:disabled{opacity:.4;cursor:default;}

/* примеры, которые ребёнок уже дал */
.dwset{margin:12px 14px 0;padding:12px 14px;border-radius:19px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);}
.dwset__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8B7BAE;margin-bottom:9px;}
.dwrow{display:flex;gap:8px;flex-wrap:wrap;}
.dwex{position:relative;width:56px;height:56px;border-radius:13px;overflow:hidden;flex-shrink:0;
  background:#0C0918;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.dwex img{width:100%;height:100%;display:block;}
.dwex--cat{box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.6);}
.dwex--other{box-shadow:inset 0 0 0 1.5px rgba(255,200,60,.55);}
.dwex--fish{box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.6);}
.dwex--near{box-shadow:inset 0 0 0 2px #A98BFF,0 0 18px -4px #A98BFF;}
.dwex--ext{outline:2px dashed rgba(255,200,60,.55);outline-offset:-2px;}
.dwex--miss{box-shadow:inset 0 0 0 2px #FF6B6B,0 0 16px -4px #FF6B6B;}
.dwex--edit{cursor:pointer;transition:transform .12s;}
.dwex--edit:hover{transform:translateY(-3px) scale(1.04);}
.dwex__x{position:absolute;right:2px;top:2px;width:17px;height:17px;border:none;cursor:pointer;
  border-radius:50%;background:rgba(10,6,20,.8);color:#FFB4A8;font-size:10px;line-height:17px;padding:0;}
.dwex__b{position:absolute;left:0;right:0;bottom:0;padding:1px 0;text-align:center;
  font-weight:900;font-size:8.5px;letter-spacing:.03em;background:rgba(10,6,20,.72);color:#C9BAE6;}
.dwslot{width:56px;height:56px;border-radius:13px;flex-shrink:0;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px);}

/* итог предсказания */
.dwguess{margin:12px 14px 0;padding:15px 16px;border-radius:20px;animation:dwIn .32s ease-out both;
  background:linear-gradient(180deg,rgba(169,139,255,.16),rgba(169,139,255,.05));
  box-shadow:inset 0 0 0 1.5px rgba(169,139,255,.4);}
.dwguess__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#CBB8FF;}
.dwguess__v{margin-top:6px;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:20px;color:#F4EEFF;}
.dwbar{margin-top:10px;height:9px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;}
.dwbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(90deg,#A98BFF,#7FE7FF);}
.dwguess__n{margin-top:9px;font-weight:700;font-size:12px;color:#A896C9;line-height:1.45;}

/* табло точности */
.dwacc{margin:12px 14px 0;padding:15px 16px;border-radius:20px;animation:dwIn .32s ease-out both;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwacc__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8B7BAE;}
.dwacc__v{margin-top:7px;display:flex;align-items:baseline;gap:10px;}
.dwacc__v b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:26px;color:#F4EEFF;}
.dwacc__v span{font-weight:700;font-size:12.5px;color:#A896C9;}
.dwacc__n{margin-top:9px;font-weight:700;font-size:12px;line-height:1.45;color:#A896C9;}

/* проверка связи */
.dwq{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.dwq__t{font-weight:900;font-size:13.5px;color:#F2ECFF;line-height:1.35;margin-bottom:10px;}
.dwq button{display:block;width:100%;margin-bottom:7px;padding:12px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13px;color:#DDD2F2;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.dwq button:hover{background:rgba(255,255,255,.09);}
.dwq button:last-child{margin-bottom:0;}
.dwq button.on--ok{background:rgba(78,217,155,.16);box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.5);color:#C4F4E0;}
.dwq button.on--bad{background:rgba(255,107,107,.14);box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.45);color:#FFD6CF;}

.dwfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,7,17,0),#090711 42%);}

/* финал */
.dwdone{display:flex;flex-direction:column;align-items:center;padding-top:4px;}
.dwpet{width:216px;animation:dwPop .5s cubic-bezier(.2,.8,.3,1) both;}
.dwlaw{margin:10px 18px 0;text-align:center;}
.dwlaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.dwlaw span{display:block;margin-top:7px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.45;}

/* финал уровня без артефакта: словарь Нейро */
.dwwords{margin:8px 16px 0;padding:18px 20px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,rgba(127,231,255,.12),rgba(127,231,255,.04));
  box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.3);animation:dwPop .45s cubic-bezier(.2,.8,.3,1) both;}
.dwwords__t{font-weight:900;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#7FE7FF;}
.dwwords__r{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.dwword{padding:8px 16px;border-radius:999px;font-family:var(--nk-brand),var(--nk-body);
  font-weight:700;font-size:15px;color:#0B1620;background:#7FE7FF;}
.dwwords__n{margin-top:13px;font-weight:700;font-size:12.5px;line-height:1.45;color:#A896C9;}
.dwaccbig{margin-top:12px;display:flex;align-items:baseline;justify-content:center;gap:12px;}
.dwaccbig s{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:24px;
  color:#FF9E8E;text-decoration:line-through;opacity:.75;}
.dwaccbig em{font-style:normal;font-size:18px;color:#8B7BAE;}
.dwaccbig b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:34px;color:#7FE7FF;}

@keyframes dwIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes dwPop{0%{opacity:0;transform:scale(.72);}68%{transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion: reduce){.dw *{animation:none !important;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-levels.js"></script>
<script src="nooka-access.js"></script>
<script src="nooka-gallery.js"></script>
<script src="nooka-ui.js"></script>
<script>
/* ============================================================
   ДОСКА — сквозная механика игры «Откуда ИИ знает».
   Ребёнок рисует пальцем, а Нейро действительно учится на его
   рисунках: классификатор считает признаки по растру и сравнивает
   с примерами. Никакой имитации — если примеров мало или они
   похожи друг на друга, Нейро честно промахивается.

   Уровни на этом движке: draw.html?n=2 (научи), 3, 4, 6, 7.
   ============================================================ */

const DW_SIZE = 300;        // внутренний размер холста: признаки считаем в нём
const DW_PEN = 9;      // тоньше: жирная линия сливалась в кляксу
const DW_GRID = 5;          // сетка признаков 5×5

/* ── признаки рисунка: плотность чернил по клеткам bbox + пропорция ──
   Нормируем по рамке рисунка, поэтому размер и положение на доске
   не важны — важна форма. */
function dwFeatures(cv) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const d = ctx.getImageData(0, 0, W, H).data;
  let minX = W, minY = H, maxX = -1, maxY = -1, ink = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        ink++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0 || ink < 220) return null;          // пусто или почти пусто
  const bw = Math.max(1, maxX - minX + 1), bh = Math.max(1, maxY - minY + 1);
  const cells = new Array(DW_GRID * DW_GRID).fill(0);
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        const gx = Math.min(DW_GRID - 1, Math.floor((x - minX) / bw * DW_GRID));
        const gy = Math.min(DW_GRID - 1, Math.floor((y - minY) / bh * DW_GRID));
        cells[gy * DW_GRID + gx]++;
      }
    }
  }
  /* Одной сетки мало: круглая голова и квадратный дом дают похожие
     плотности при дрожащей руке. Добавляем профиль формы — кольца от
     центра (круглое или угловатое) и секторы по кругу (где выступы). */
  const RING = 4, SECT = 8;
  const rings = new Array(RING).fill(0);
  const sects = new Array(SECT).fill(0);
  const cx = minX + bw / 2, cy = minY + bh / 2;
  const rMax = Math.sqrt(bw * bw + bh * bh) / 2;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) {
        const dx = (x - cx) / (bw / 2), dy = (y - cy) / (bh / 2);   // нормируем по рамке
        const r = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
        rings[Math.min(RING - 1, Math.floor(r * RING))]++;
        let a = Math.atan2(dy, dx) / (Math.PI * 2);
        if (a < 0) a += 1;
        sects[Math.min(SECT - 1, Math.floor(a * SECT))]++;
      }
    }
  }
  const f = cells.map(c => c / ink)
    .concat(rings.map(c => c / ink))
    .concat(sects.map(c => c / ink));
  f.push(Math.max(0, Math.min(1, (bw / bh) / 2)));   // пропорция рамки
  f.push(Math.min(1, ink / (bw * bh)));              // насколько плотно закрашено
  return { f: f, ink: ink, box: [minX, minY, bw, bh] };
}

function dwDist(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; }
  return Math.sqrt(s);
}

/* ── предсказание: ближайший пример (честный kNN, k=1) ──
   Уверенность считается из того, насколько ближайший «свой» ближе
   ближайшего «чужого». Если всё далеко — Нейро говорит, что не знает. */
function dwPredict(model, f) {
  if (!model.length) return null;
  const best = {};
  let near = null;
  model.forEach((m, i) => {
    const d = dwDist(m.f, f);
    if (best[m.label] === undefined || d < best[m.label].d) best[m.label] = { d: d, i: i };
    if (!near || d < near.d) near = { d: d, i: i, label: m.label };
  });
  const labels = Object.keys(best).sort((a, b) => best[a].d - best[b].d);
  const own = best[labels[0]].d;
  const other = labels[1] !== undefined ? best[labels[1]].d : own * 2.2;
  const conf = Math.round(Math.max(52, Math.min(97, other / (own + other) * 100)));
  return {
    label: labels[0], conf: conf, near: near,
    unsure: own > 0.30,                 // ничего похожего в примерах нет (порог из замеров)
    dist: own,
  };
}

/* ── самопроверка: каждый пример предсказываем по всем остальным ──
   Это настоящая проверка на отложенном примере (leave-one-out), а не
   выдуманное число: пример с чужой подписью почти всегда не угадывается,
   поэтому грязь в наборе видно сразу и она чинится на глазах. */
function dwSelfCheck(model) {
  if (model.length < 3) return { ok: 0, total: model.length, acc: 0, wrong: [] };
  var ok = 0; var wrong = [];
  model.forEach(function (m, i) {
    var rest = model.filter(function (_, k) { return k !== i; });
    var p = dwPredict(rest, m.f);
    if (p && p.label === m.label) ok++; else wrong.push(i);
  });
  return { ok: ok, total: model.length, acc: Math.round(ok / model.length * 100), wrong: wrong };
}

/* ── доска ── */
function DwBoard({ api, hint, locked }) {
  const cvRef = useRef(null);
  const st = useRef({ drawing: false, dirty: false });

  useEffect(() => {
    const cv = cvRef.current;
    const ctx = cv.getContext('2d');
    ctx.lineWidth = DW_PEN;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#7FE7FF';

    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * DW_SIZE, (e.clientY - r.top) / r.height * DW_SIZE];
    };
    const down = e => {
      if (locked) return;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      st.current.drawing = true; st.current.dirty = true;
      const [x, y] = pos(e);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .01, y);
      ctx.stroke();
      if (api.onChange) api.onChange(true);
    };
    const move = e => {
      if (!st.current.drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y);
    };
    const up = () => { st.current.drawing = false; };

    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);

    api.canvas = cv;
    api.clear = () => {
      ctx.clearRect(0, 0, DW_SIZE, DW_SIZE);
      st.current.dirty = false;
      if (api.onChange) api.onChange(false);
    };
    api.isEmpty = () => !st.current.dirty;
    /* отладочный хук: рисует заготовку, чтобы проверять уровень без пальца */
    api.stroke = pts => {
      st.current.dirty = true;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      if (api.onChange) api.onChange(true);
    };

    return () => {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerup', up);
      cv.removeEventListener('pointercancel', up);
    };
  }, [locked]);

  return React.createElement('div', { className: 'dwpad' },
    React.createElement('canvas', { ref: cvRef, width: DW_SIZE, height: DW_SIZE }),
    React.createElement('div', { className: 'dwpad__grid' }),
    hint && React.createElement('div', { className: 'dwpad__hint' }, hint));
}

/* ── отладка: draw.html?n=2&demo=1 заполняет модель за ребёнка ──
   Нужно, чтобы проверять поздние фазы уровня без рисования пальцем
   и быстро показывать уровень целиком. В обычной игре не включается. */
function dwSketch(kind, jit) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = DW_SIZE;
  const c = cv.getContext('2d');
  c.lineWidth = DW_PEN; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#7FE7FF';
  const line = pts => {
    c.beginPath();
    pts.forEach((p, i) => {
      const x = p[0] + (Math.random() - .5) * jit, y = p[1] + (Math.random() - .5) * jit;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
  };
  if (kind === 'cat') {
    const o = [];
    for (let a = 0; a <= 360; a += 12) {
      const t = a * Math.PI / 180;
      o.push([150 + 62 * Math.cos(t), 165 + 52 * Math.sin(t)]);
    }
    line(o);
    line([[100, 125], [92, 72], [136, 110]]);
    line([[200, 125], [210, 72], [166, 110]]);
    line([[92, 168], [46, 158]]);
    line([[208, 168], [254, 158]]);
  } else if (kind === 'fish') {
    const o = [];
    for (let a = 0; a <= 360; a += 15) {
      const t = a * Math.PI / 180;
      o.push([144 + 66 * Math.cos(t), 158 + 34 * Math.sin(t)]);
    }
    line(o);
    line([[210, 158], [258, 122], [258, 194], [210, 158]]);
    line([[112, 146], [116, 150]]);
  } else {
    line([[74, 270], [74, 150], [226, 150], [226, 270], [74, 270]]);
    line([[60, 152], [150, 66], [240, 152]]);
    line([[132, 270], [132, 208], [172, 208], [172, 270]]);
  }
  return cv;
}

/* уменьшенная копия рисунка — для полоски примеров и для артефакта */
function dwThumb(cv, size) {
  const t = document.createElement('canvas');
  t.width = t.height = size || 64;
  const c = t.getContext('2d');
  c.drawImage(cv, 0, 0, t.width, t.height);
  return t.toDataURL('image/png');
}

/* ── сценарии уровней на этом движке ── */
const DW_LEVELS = {

          React.createElement('span', null, 'угадал ' + audit.ok + ' из ' + audit.total)),
        React.createElement('div', { className: 'dwbar' },
          React.createElement('i', {
            style: { width: audit.acc + '%', background: audit.acc > 90
              ? 'linear-gradient(90deg,#4ED99B,#7FE7FF)' : 'linear-gradient(90deg,#FF7A64,#FFC83C)' },
          })),
        React.createElement('div', { className: 'dwacc__n' },
          audit.acc > 90
            ? 'Набор чистый: каждый пример узнаётся по остальным.'
            : 'Я закрываю один пример и угадываю его по остальным. Там, где не сошлось, — красная рамка.')),

      guess && React.createElement('div', { className: 'dwguess' },
        React.createElement('div', { className: 'dwguess__t' }, 'Нейро говорит'),
        React.createElement('div', { className: 'dwguess__v' }, guessText(guess)),
        React.createElement('div', { className: 'dwbar' },
          React.createElement('i', { style: { width: guess.conf + '%' } })),
        React.createElement('div', { className: 'dwguess__n' },
          step.unknown
            ? 'Я сказал «' + (WORD[guess.label] || guess.label) + '» и был уверен на ' + guess.conf +
              '%. Но слова «' + (step.wordN || step.word) + '» у меня нет — я выбрал самое похожее из того, что знаю. ' +
              'Сказать «такого не видел» я не умею.'
            : guess.unsure
            ? 'Ни один твой пример на это не похож. Я узнаю только то, что видел.'
            : hit
              ? 'Уверен на ' + guess.conf + '%. Больше всего похоже на твой рисунок в рамке — по нему и узнал.'
              : 'Уверен на ' + guess.conf + '%, и всё равно ошибся. Твои ' + (step.many || 'рисунки') +
                  ' слишком разные между собой — дай мне ещё один пример, и я стану точнее.')),

      model.length > 0 && React.createElement('div', { className: 'dwset' },
        React.createElement('div', { className: 'dwset__t' },
          isClean ? 'Набор Нейро · пунктиром — присланные со станции' : 'Чему ты его научил'),
        React.createElement('div', { className: 'dwrow' },
          model.map((m, i) => React.createElement('div', {
            key: i,
            className: 'dwex dwex--' + (m.label === 'cat' ? 'cat' : m.label === 'fish' ? 'fish' : 'other') +
              (m.ext ? ' dwex--ext' : '') + (isClean ? ' dwex--edit' : '') +
              (audit && audit.wrong.indexOf(i) > -1 ? ' dwex--miss' : '') +
              (guess && guess.near && guess.near.i === i ? ' dwex--near' : ''),
            onClick: isClean ? () => relabel(i) : null,
            title: isClean ? 'Нажми, чтобы поменять подпись' : null,
          },
            React.createElement('img', { src: m.thumb, alt: '' }),
            React.createElement('span', { className: 'dwex__b' }, WORD[m.label] || m.label),
            isClean && React.createElement('button', {
              className: 'dwex__x',
              onClick: e => { e.stopPropagation(); drop(i); },
            }, '✕'))),
          !isTest && Array.from({ length: Math.max(0, step.need - doneCount) }, (_, i) =>
            React.createElement('div', { className: 'dwslot', key: 's' + i }))))),

    React.createElement('div', { className: 'dwfoot' },
      isAudit && React.createElement('button', {
        className: 'nk-btn nk-btn--pri', style: { width: '100%' },
        onClick: () => { setSi(si + 1); setGuess(null); },
      }, audit && audit.acc > 90 ? 'Дальше' : 'Почистить набор'),

      isClean && React.createElement('button', {
        className: 'nk-btn ' + (audit && audit.acc > 90 ? 'nk-btn--ok' : 'nk-btn--soft'),
        style: { width: '100%' },
        onClick: () => { setSi(si + 1); setGuess(null); api.current.clear(); },
      }, audit && audit.acc > 90 ? 'Чисто, проверяем' : 'Всё равно проверить'),

      guess && (hit
        ? React.createElement('button', {
            className: 'nk-btn nk-btn--ok', style: { width: '100%' },
            onClick: () => {
              if (si + 1 < L.steps.length) { setSi(si + 1); setGuess(null); api.current.clear(); }
              else setPhase('quiz');
            },
          }, si + 1 < L.steps.length ? 'Понятно, дальше' : 'Дальше')
        : React.createElement('button', {
            className: 'nk-btn nk-btn--pri', style: { width: '100%' },
            onClick: () => { setFix(true); setGuess(null); api.current.clear(); },
          }, 'Дать ещё пример'))));
}

function App() {
  const q = new URLSearchParams(window.location.search);
  const n = parseInt(q.get('n'), 10) || 2;
  const L = DW_LEVELS[n] || DW_LEVELS[2];
  return React.createElement('div', { className: 'dwroot' },
    React.createElement(LevelDraw, {
      n: n,
      onWin: () => {
        if (window.nooka) window.nooka.missionWin(L.mid, L.xp, { nextLabel: 'В коллекцию →' });
        setTimeout(() => { window.location.href = '../base/index.html#gallery'; }, 400);
      },
      onHome: () => { window.location.href = 'game.html?g=data'; },
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
