<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Мастерская предметов — Nooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>

/* ============ МАСТЕРСКАЯ ПРЕДМЕТОВ ============ */
.fgroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.fg{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#160C28 0%,#0E0719 62%,#0A0614 100%);}
.fgbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

/* сцена */
.fgscene{position:relative;margin:0 14px;border-radius:22px;overflow:hidden;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),0 20px 40px -20px rgba(0,0,0,.95);}
.fgbg{width:100%;display:block;}
.fgitem{position:absolute;left:50%;top:1%;transform:translateX(-50%);
  width:47%;height:88%;pointer-events:none;}

/* имя предмета */
.fgname{margin:10px 14px 0;text-align:center;}
.fgname b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17.5px;color:#F4EEFF;letter-spacing:.01em;}
.fgname span{display:block;margin-top:3px;font-weight:700;font-size:12.5px;color:#8B7BAE;}

/* реплика */
.fgsay-wrap{min-height:34px;padding:10px 14px 0;}
.fgsay{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:18px;
  font-weight:800;font-size:13.5px;line-height:1.35;color:#E9DFFF;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  animation:fgIn .3s ease-out both;}
.fgsay--bad{color:#FFE7DA;background:rgba(255,154,60,.14);box-shadow:inset 0 0 0 1px rgba(255,154,60,.42);}
.fgsay__a{flex-shrink:0;line-height:0;}

/* конструктор */
.fgpanel{margin:10px 14px 0;padding:11px 12px 12px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.fgrow + .fgrow{margin-top:9px;}
.fgrow__t{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#8B7BAE;margin-bottom:6px;}
.fgrow__c{display:flex;flex-wrap:wrap;gap:6px;}
.fgchip{padding:8px 13px;border:none;border-radius:999px;cursor:pointer;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;white-space:nowrap;
  color:#D9CEF2;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);transition:box-shadow .15s,transform .1s,color .15s;}
.fgchip:hover{box-shadow:inset 0 0 0 1.5px rgba(181,123,255,.55);}
.fgchip:active{transform:translateY(2px);}
.fgchip--on{color:#fff;background:linear-gradient(180deg,#9B78FF,#7B4FF2 60%,#6E41E4);
  box-shadow:0 0 18px rgba(123,79,242,.5),inset 0 1px 0 rgba(255,255,255,.35);}

.fgfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,6,20,0),#0A0614 42%);}
.fgbtns{}
.fghint{margin-top:9px;font-size:12px;font-weight:700;color:#7C6B99;text-align:center;}

/* анимации предмета и кузницы */
@keyframes fgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes fgFloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-9px) rotate(1deg);}}
@keyframes fgSad{0%,100%{transform:translateY(0) rotate(-7deg);}50%{transform:translateY(-3px) rotate(-5deg);}}
@keyframes fgPulse{0%,100%{opacity:.55;}50%{opacity:1;}}
@keyframes fgRune{0%,100%{opacity:.35;}50%{opacity:1;}}
@keyframes fgFlame{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(-4px) scaleY(1.18);}}
@keyframes fgFlick{0%,100%{opacity:.85;}50%{opacity:1;}}
@keyframes fgZap{0%{opacity:0;}12%{opacity:1;}30%{opacity:.2;}45%{opacity:1;}100%{opacity:0;}}
@keyframes fgDrift{0%,100%{transform:translate(0,0);opacity:.5;}50%{transform:translate(6px,-8px);opacity:1;}}
@keyframes fgSpark{0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3);}}

@media (prefers-reduced-motion: reduce){
  .fgscene *,.fgitem *{animation:none !important;}
}

</style>
