<title>Что решает человек — Nooka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Unbounded:wght@700&display=swap" rel="stylesheet">

<style>
/* ============ ЧТО РЕШАЕТ ЧЕЛОВЕК ============ */
.huroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.hu{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#131024 0%,#0D0A18 62%,#090711 100%);}
.hubody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;}

/* дело на сегодня */
.hujob{margin:2px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  animation:huIn .32s ease-out both;}
.hujob__k{font-weight:900;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8B7BAE;}
.hujob__t{margin-top:5px;font-weight:900;font-size:16px;line-height:1.3;color:#F2ECFF;}
.hujob__ai{display:flex;gap:9px;align-items:flex-start;margin-top:11px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.08);}
.hujob__ai i{flex-shrink:0;line-height:0;}
.hujob__ai span{font-weight:700;font-size:13px;line-height:1.4;color:#C6B7E4;}
.hujob__ai b{color:#9C7BFF;font-weight:900;}

/* пульт */
.hudesk{margin:11px 14px 0;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#181227,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 16px 34px -20px rgba(0,0,0,.9);}
.hudesk svg{width:100%;display:block;}

/* лотки */
.hutrays{margin:12px 14px 0;display:flex;flex-direction:column;gap:9px;}
.hutray{display:flex;align-items:center;gap:12px;padding:13px 15px;border:none;cursor:pointer;
  text-align:left;font-family:inherit;border-radius:19px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  transition:transform .12s,box-shadow .16s,background .16s;}
.hutray:hover{transform:translateY(-2px);background:rgba(255,255,255,.085);}
.hutray:disabled{cursor:default;opacity:.4;transform:none;}
.hutray__l{flex-shrink:0;width:13px;height:13px;border-radius:50%;background:var(--c);
  box-shadow:0 0 12px var(--c),inset 0 -2px 0 rgba(0,0,0,.25);}
.hutray__t{flex:1;min-width:0;}
.hutray__t b{display:block;font-weight:900;font-size:14.5px;color:#F2ECFF;}
.hutray__t span{display:block;margin-top:2px;font-weight:700;font-size:11.5px;color:#8B7BAE;}
.hutray--on{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  box-shadow:inset 0 0 0 1.5px var(--c),0 12px 26px -16px var(--c);}

/* реплика результата */
.husay-wrap{min-height:34px;padding:12px 14px 0;}
.husay{display:flex;gap:10px;padding:13px 15px;border-radius:19px;animation:huIn .3s ease-out both;}
.husay i{flex-shrink:0;line-height:0;}
.husay span{font-weight:700;font-size:13px;line-height:1.45;}
.husay--ok{background:rgba(78,217,155,.14);box-shadow:inset 0 0 0 1px rgba(78,217,155,.4);}
.husay--ok span{color:#C4F4E0;}
.husay--soft{background:rgba(255,200,60,.12);box-shadow:inset 0 0 0 1px rgba(255,200,60,.38);}
.husay--soft span{color:#FFE9BE;}
.husay--bad{background:rgba(255,107,107,.14);box-shadow:inset 0 0 0 1px rgba(255,107,107,.42);}
.husay--bad span{color:#FFD6CF;}
.huwhy{margin:9px 14px 0;padding:11px 15px;border-radius:17px;font-weight:700;font-size:12px;
  line-height:1.45;color:#CFC0EC;background:rgba(255,255,255,.045);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);animation:huIn .34s ease-out .1s both;}
.huwhy b{color:#A98BFF;}

.hufoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,7,17,0),#090711 42%);}
.hubtns{display:flex;gap:9px;}

/* финал */
.hudone{align-items:center;padding-top:4px;}
.hupass{width:210px;animation:huPop .5s cubic-bezier(.2,.8,.3,1) both;}
.hulaw{margin:8px 18px 0;text-align:center;}
.hulaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.hulaw span{display:block;margin-top:7px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.45;}
.huline{margin:15px 16px 0;padding:13px 16px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,107,107,.13),rgba(255,107,107,.05));
  box-shadow:inset 0 0 0 1px rgba(255,107,107,.3);}
.huline__t{font-weight:900;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:#FF9E8E;margin-bottom:7px;}
.huline ul{margin:0;padding-left:16px;}
.huline li{font-weight:700;font-size:12.5px;line-height:1.5;color:#FFD6CF;}
.huscore{margin:12px 16px 0;text-align:center;font-weight:800;font-size:12.5px;color:#8B7BAE;}

@keyframes huIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes huPop{0%{opacity:0;transform:scale(.72);}68%{transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}

/* ── экран пульта: анимации результата ── */
.huscan{transform-box:fill-box;transform-origin:50% 50%;}
.hudesk.go--ok .huring{animation:huRing 1.1s ease-out forwards;}
@keyframes huRing{0%{opacity:.9;transform:scale(.35);}100%{opacity:0;transform:scale(2.2);}}
.huring{transform-box:fill-box;transform-origin:50% 50%;opacity:0;}
.humark{opacity:0;transform-box:fill-box;transform-origin:50% 50%;}
.hudesk.go--ok .humark--ok{animation:huMark .5s cubic-bezier(.2,.8,.3,1) .35s forwards;}
.hudesk.go--soft .humark--soft{animation:huMark .5s cubic-bezier(.2,.8,.3,1) .3s forwards;}
.hudesk.go--bad .humark--bad{animation:huMark .45s cubic-bezier(.2,.8,.3,1) .32s forwards;}
@keyframes huMark{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.hudesk.go--bad .hushake{animation:huShake .42s ease-in-out 2;}
@keyframes huShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
.hudesk.go--bad .hualarm{animation:huAlarm .5s ease-in-out 3;}
@keyframes huAlarm{0%,100%{opacity:0;}50%{opacity:.5;}}
.hudesk.go--soft .huglyph,.hudesk.go--ok .huglyph{animation:huSink .7s ease-in forwards;}
@keyframes huSink{to{opacity:.16;transform:translateY(4px);}}
.huglyph{transform-box:fill-box;}
.hulamp{transition:opacity .25s;}
/* бегущая строка на пульте, пока ждём решения */
.hudesk .hutick{animation:huTick 2.6s linear infinite;}
@keyframes huTick{from{transform:translateX(0);}to{transform:translateX(-56px);}}
@media (prefers-reduced-motion: reduce){.hudesk *{animation:none !important;}}

      style: { font: '900 11px Nunito, sans-serif', letterSpacing: '1.4px' } }, 'ПРОПУСК'),

      style: { font: "700 15px 'Unbounded', Nunito, sans-serif" } }, 'Дежурный'),
    React.createElement('text', { x: 100, y: 82, textAnchor: 'middle', fill: '#F4EEFF',
      style: { font: "700 15px 'Unbounded', Nunito, sans-serif" } }, 'по решениям'),
    React.createElement('line', { x1: 30, y1: 96, x2: 170, y2: 96, stroke: 'rgba(255,255,255,.14)', strokeWidth: 1.4 }),
    /* три правила */
    rows.map((r, i) => React.createElement('g', { key: i, transform: `translate(30,${114 + i * 30})` },
      React.createElement('circle', { cx: 6, cy: 6, r: 5.5, fill: r[0] }),
      React.createElement('text', { x: 20, y: 10, fill: '#DDD2F2',
        style: { font: '700 11px Nunito, sans-serif' } }, r[1]))),
    /* печать */
    React.createElement('g', { transform: 'translate(100,209)' },
      React.createElement('circle', { r: 18, fill: 'none', stroke: 'rgba(255,216,77,.5)', strokeWidth: 1.8 }),
      React.createElement('circle', { r: 14, fill: 'rgba(255,216,77,.1)' }),
      React.createElement('path', { d: 'M0 -9l2.6 5.5 6 .8-4.3 4.2 1 6L0 5.4l-5.3 2.9 1-6-4.3-4.2 6-.8z',
        fill: '#FFD84D' })),
    React.createElement('text', { x: 100, y: 236, textAnchor: 'middle', fill: '#A08FC4',
      style: { font: '700 9.5px Nunito, sans-serif' } },
      'красных линий удержано: ' + hard + ' из 2'));
}

/* ── уровень ── */
function LevelHuman({ onWin, onHome }) {
  const [phase, setPhase] = useState(() => {
    const p = new URLSearchParams(window.location.search).get('p');
    return ['play', 'done'].indexOf(p) > -1 ? p : 'intro';
  });
  const [i, setI] = useState(() => {
    const n = parseInt(new URLSearchParams(window.location.search).get('j'), 10);
    return n > 0 && n <= HU_JOBS.length ? n - 1 : 0;
  });
  const [pick, setPick] = useState(null);
  const [run, setRun] = useState(false);
  const [log, setLog] = useState([]);          // {id, pick, m}
  const [saved, setSaved] = useState(false);
  const tRef = useRef([]);

  const job = HU_JOBS[i];
  const res = pick ? job.out[pick] : null;
  const clear = () => { tRef.current.forEach(clearTimeout); tRef.current = []; };
  useEffect(() => clear, []);

  const choose = k => {
    if (pick) return;
    clear(); setPick(k); setRun(false);
    tRef.current = [setTimeout(() => setRun(true), 60)];
  };

  const redo = () => { clear(); setPick(null); setRun(false); };

  const next = () => {
    clear();
    setLog(log.concat([{ id: job.id, pick: pick, m: res.m }]));
    setPick(null); setRun(false);
    if (i + 1 < HU_JOBS.length) setI(i + 1);
    else setPhase('done');
  };

  /* сколько красных линий удержано: дела с hard, где решение не отдано роботу */
  const hardKept = () => {
    const done = log.concat(pick ? [{ id: job.id, pick: pick, m: res.m }] : []);
    return HU_JOBS.filter(j => j.hard).filter(j => {
      const e = done.find(x => x.id === j.id);
      return e && e.pick !== 'auto';
    }).length;
  };
  const exact = () => log.filter(e => e.m === 'ok').length;

  const savePass = () => {
    const svg = document.querySelector('.hupass');
    if (svg && window.nookaGallery) {
      window.nookaGallery.add({
        kind: 'pass', game: 'Что решает человек', title: 'Пропуск дежурного',
        note: 'Три правила: что роботу, что с подсказкой, а что только себе',
        svg: svg.outerHTML,
      });
    }
    setSaved(true);
  };

  /* ── финал ── */
  if (phase === 'done') {
    const kept = hardKept();
    return React.createElement('div', { className: 'hu' },
      React.createElement(TopBar, { level: 10, title: 'Что решает человек', onHome, step: 6, total: 1 }),
      React.createElement('div', { className: 'hubody hudone' },
        React.createElement(HuPass, { hard: kept, u: 'p' }),
        React.createElement('div', { className: 'hulaw' },
          React.createElement('b', null, 'У робота нет ответственности'),
          React.createElement('span', null,
            'Он может ошибиться и не заметить. Отвечать всё равно будет человек — поэтому часть решений остаётся за тобой.')),
        React.createElement('div', { className: 'huline' },
          React.createElement('div', { className: 'huline__t' }, 'Твоя красная линия'),
          React.createElement('ul', null,
            React.createElement('li', null, 'Здоровье — решают ты, родители и врач'),
            React.createElement('li', null, 'Ссоры и дружба — разбираются люди, а не подсчёт слов'))),
        React.createElement('div', { className: 'huscore' },
          'Точно в лоток: ' + exact() + ' из ' + HU_JOBS.length +
          ' · красных линий удержано: ' + kept + ' из 2')),
      React.createElement('div', { className: 'hufoot' },
        !saved
          ? React.createElement('button', {
              className: 'nk-btn nk-btn--cta', style: { width: '100%' }, onClick: savePass,
            }, 'Забрать пропуск')
          : React.createElement('button', {
              className: 'nk-btn nk-btn--ok', style: { width: '100%' },
              onClick: () => { clear(); onWin(); },
            }, 'Готово')));
  }

  /* ── игра ── */
  const mustRedo = res && job.hard && pick === 'auto';

  return React.createElement('div', { className: 'hu' },
    React.createElement(TopBar, { level: 10, title: 'Что решает человек', onHome, step: i, total: 1 }),

    phase === 'intro' && React.createElement(IntroModal, {
      emoji: NKM('hello', 88),
      title: 'Что решает человек',
      law: 'Робот может ошибиться и не заметить.\nОтвечать за ошибку всё равно будет человек.',
      tip: 'Ты дежурный. Разложи дела: что роботу, что с подсказкой, а что только себе.',
      onStart: () => setPhase('play'),
    }),

    React.createElement('div', { className: 'hubody' },
      React.createElement('div', { className: 'hujob', key: job.id },
        React.createElement('div', { className: 'hujob__k' }, job.when + ' · дело ' + (i + 1) + ' из ' + HU_JOBS.length),
        React.createElement('div', { className: 'hujob__t' }, job.t),
        React.createElement('div', { className: 'hujob__ai' },
          React.createElement('i', null, NKM('hello', 30)),
          React.createElement('span', null, React.createElement('b', null, 'Нейро: '), '«', job.ai, '»'))),

      React.createElement(HuDesk, { job, pick, res, run }),

      React.createElement('div', { className: 'hutrays' },
        HU_TRAYS.map(T => React.createElement('button', {
          key: T.k, className: 'hutray' + (pick === T.k ? ' hutray--on' : ''),
          style: { '--c': T.c }, disabled: !!pick && pick !== T.k,
          onClick: () => choose(T.k),
        },
          React.createElement('span', { className: 'hutray__l' }),
          React.createElement('span', { className: 'hutray__t' },
            React.createElement('b', null, T.t),
            React.createElement('span', null, T.s))))),

      React.createElement('div', { className: 'husay-wrap' },
        run && res && React.createElement('div', { className: 'husay husay--' + res.m, key: pick },
          React.createElement('i', null, NKM(res.m === 'ok' ? 'win' : 'think', 30)),
          React.createElement('span', null, res.say))),

      run && res && res.m !== 'ok' && React.createElement('div', { className: 'huwhy' },
        React.createElement('b', null, 'Как правильно: '), job.why)),

    React.createElement('div', { className: 'hufoot' },
      run && res && React.createElement('div', { className: 'hubtns' },
        (res.m !== 'ok') && React.createElement('button', {
          className: 'nk-btn nk-btn--soft', style: { flex: mustRedo ? 1 : 'none' }, onClick: redo,
        }, 'Переложить'),
        !mustRedo && React.createElement('button', {
          className: 'nk-btn nk-btn--pri', style: { flex: 1 }, onClick: next,
        }, i + 1 < HU_JOBS.length ? 'Следующее дело' : 'Сдать дежурство'))));
}

function App() {
  return React.createElement('div', { className: 'huroot' },
    React.createElement(LevelHuman, {
      onWin: () => {
        if (window.nooka) window.nooka.missionWin('ctrl10', 110, { nextLabel: 'В коллекцию →' });
        setTimeout(() => { window.location.href = '../base/index.html#gallery'; }, 400);
      },
      onHome: () => { window.location.href = 'game.html?g=control'; },
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
