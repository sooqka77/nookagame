<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что освоил ребёнок — Nooka</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=unbounded:700,800,900|nunito:500,600,700,800,900" rel="stylesheet">
<style>
/* ============================================================
   Отчёт родителю. Экран не для ребёнка: без XP, званий и огоньков —
   только что освоено, какими словами это сказать и о чём спросить.
   Данные не придумываются: всё берётся из реестра nooka-levels.js
   (поля learn, ask, idea) по фактически пройденным уровням.
   ============================================================ */
:root{
  --bg:#FFF4E4; --surface:#FFFDF8; --ink:#2D1B45; --ink-2:#6B5680; --ink-3:#A797B8;
  --pri:#7B4FF2; --pri-1:#E4D9FF; --pri-0:#F3EEFF; --ok:#1FA76E; --ok-1:#C9F4DE;
  --sun-1:#FFF1B4; --sun-3:#E8AE1F;
  --brand:'Unbounded','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#FFF6E9 0%,var(--bg) 30%);
  font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 60px}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.logo img{width:34px;height:34px;border-radius:11px;background:linear-gradient(180deg,#9B78FF,#7B4FF2);padding:5px}
.logo b{font-family:var(--brand);font-weight:900;font-size:19px}
.logo b em{font-style:normal;color:var(--pri)}
.back{font-size:14px;font-weight:800;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--pri)}

h1{font-family:var(--body);font-weight:900;font-size:clamp(26px,4.4vw,36px);line-height:1.15;
  letter-spacing:-.01em;margin:0 0 10px}
.lead{font-size:16px;line-height:1.55;color:var(--ink-2);margin:0 0 24px;max-width:560px}

.card{background:var(--surface);border-radius:26px;padding:24px 26px;margin-bottom:16px;
  box-shadow:0 10px 22px -8px rgba(45,27,69,.16),inset 0 2px 0 rgba(255,255,255,.9)}
.card h2{font-family:var(--body);font-weight:900;font-size:19px;margin:0 0 4px}
.card .sub{font-size:13.5px;color:var(--ink-3);font-weight:700;margin-bottom:18px}

/* шкала пройденного */
.done-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.done-n{font-family:var(--brand);font-weight:900;font-size:34px;line-height:1}
.done-n span{font-size:17px;color:var(--ink-3);font-weight:700;font-family:var(--body)}
.bar{height:12px;border-radius:8px;background:var(--pri-0);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#9B78FF,#7B4FF2)}
.by-game{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.by-game span{font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:999px;
  background:var(--pri-0);color:var(--ink-2)}

/* большие идеи */
.idea{padding:16px 0;border-top:1px solid rgba(45,27,69,.08)}
.idea:first-of-type{border-top:none;padding-top:4px}
.idea-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
.idea-h b{font-weight:900;font-size:15.5px}
.idea-h em{font-style:normal;font-size:13px;font-weight:800;color:var(--ink-3);white-space:nowrap}
.idea-h em.full{color:var(--ok)}
.idea p{margin:0 0 9px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.idea .bar{height:7px}

/* что понял */
.learn{margin:0;padding:0;list-style:none}
.learn li{position:relative;padding:12px 0 12px 30px;border-top:1px solid rgba(45,27,69,.07);
  font-size:14.5px;line-height:1.5}
.learn li:first-child{border-top:none}
.learn li::before{content:'';position:absolute;left:6px;top:19px;width:9px;height:9px;
  border-radius:50%;background:var(--ok-1);box-shadow:0 0 0 2px var(--ok)}
.learn b{display:block;font-weight:900;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}

/* вопросы к ужину */
.asks{margin:0;padding:0;list-style:none}
.asks li{padding:15px 18px;border-radius:18px;background:var(--sun-1);margin-bottom:9px;
  font-weight:800;font-size:15px;line-height:1.45}
.asks li:last-child{margin-bottom:0}
.asks li span{display:block;margin-top:6px;font-weight:700;font-size:12.5px;color:#7A5E12}

.empty{text-align:center;padding:30px 10px}
.empty p{font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:420px;margin:0 auto 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 28px;
  border-radius:999px;font-family:var(--body);font-weight:900;font-size:16px;text-decoration:none;
  color:#fff;background:linear-gradient(180deg,#9B78FF,#7B4FF2 60%,#6E41E4);
  box-shadow:0 5px 0 #5836BD,0 12px 24px -8px rgba(123,79,242,.45)}
.foot-note{margin-top:22px;text-align:center;font-size:13px;line-height:1.55;color:var(--ink-3)}
.foot-note b{color:var(--ink-2)}
@media(max-width:560px){ .card{padding:20px 18px;border-radius:22px} .wrap{padding:18px 14px 44px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="../"><img src="../logo.svg" alt=""><b>Noo<em>ka</em></b></a>
    <a class="back" href="./">← в базу ребёнка</a>
  </div>

  <h1>Что освоил ребёнок</h1>
  <p class="lead">Здесь не очки и не звания, а то, что он теперь понимает про искусственный интеллект — и чем это можно проверить в обычном разговоре.</p>

  <div id="report"></div>
</div>

<script src="../games/nooka-core.js"></script>
<script src="../games/nooka-levels.js"></script>
<script>
(function () {
  var box = document.getElementById('report');
  var r = nookaLevels.report();
  var pct = r.total ? Math.round(r.done.length / r.total * 100) : 0;

  if (!r.done.length) {
    box.innerHTML =
      '<div class="card empty">' +
        '<p>Ребёнок ещё не прошёл ни одного уровня. Как только пройдёт — здесь появится, ' +
        'что именно он понял и о чём его можно спросить.</p>' +
        '<a class="btn" href="../games/game.html?g=data">Открыть первую игру →</a>' +
      '</div>';
    return;
  }

  /* сколько пройдено, с разбивкой по играм */
  var поИграм = {};
  r.done.forEach(function (d) { поИграм[d.game] = (поИграм[d.game] || 0) + 1; });
  var чипы = Object.keys(поИграм).map(function (g) {
    return '<span>' + g + ' — ' + поИграм[g] + '</span>';
  }).join('');

  var html =
    '<div class="card">' +
      '<div class="done-h">' +
        '<div class="done-n">' + r.done.length + ' <span>из ' + r.total + ' уровней</span></div>' +
      '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="by-game">' + чипы + '</div>' +
    '</div>';

  /* большие идеи курса */
  var сИдеями = r.ideas.filter(function (x) { return x.total > 0; });
  html +=
    '<div class="card">' +
      '<h2>Из чего состоит ИИ-грамотность</h2>' +
      '<div class="sub">Пять больших идей рамки AI4K12 — по ней ИИ преподают в школах США</div>' +
      сИдеями.map(function (x) {
        var p = Math.round(x.done / x.total * 100);
        return '<div class="idea">' +
          '<div class="idea-h"><b>' + x.idea.t + '</b>' +
            '<em' + (p === 100 ? ' class="full"' : '') + '>' + x.done + ' из ' + x.total + '</em></div>' +
          '<p>' + x.idea.p + '</p>' +
          '<div class="bar"><i style="width:' + p + '%"></i></div>' +
        '</div>';
      }).join('') +
    '</div>';

  /* что он теперь знает — выводы пройденных уровней */
  html +=
    '<div class="card">' +
      '<h2>Что он теперь знает</h2>' +
      '<div class="sub">По одному выводу с каждого пройденного уровня</div>' +
      '<ul class="learn">' +
        r.done.map(function (d) {
          return '<li><b>' + d.game + ' · уровень ' + d.n + '</b>' + d.learn + '</li>';
        }).join('') +
      '</ul>' +
    '</div>';

  /* о чём спросить */
  if (r.asks.length) {
    html +=
      '<div class="card">' +
        '<h2>О чём спросить за ужином</h2>' +
        '<div class="sub">Вопросы по последнему пройденному. Он сможет ответить своими словами</div>' +
        '<ul class="asks">' +
          r.asks.map(function (a) {
            return '<li>' + a.ask + '<span>уровень «' + a.t + '»</span></li>';
          }).join('') +
        '</ul>' +
      '</div>';
  }

  html += '<p class="foot-note">Отчёт собирается на вашем устройстве из пройденных уровней. ' +
    '<b>Никуда не отправляется</b> и никем, кроме вас, не виден.</p>';

  box.innerHTML = html;
})();
</script>
</body>
</html>
