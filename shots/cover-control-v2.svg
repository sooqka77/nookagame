<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Обложка второй игры: что попросил — то и получил, слово в слово.
       Прежняя версия показывала предмет в луче света, но не было видно
       главного: что именно сказал ребёнок и как это превратилось в вещь. -->
  <defs>
    <linearGradient id="bgC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221540"/>
      <stop offset="58%" stop-color="#150D2B"/>
      <stop offset="100%" stop-color="#0A0618"/>
    </linearGradient>
    <radialGradient id="haloC2" cx=".5" cy=".72" r=".6">
      <stop offset="0%" stop-color="#A98BFF" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#A98BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2050"/>
      <stop offset="100%" stop-color="#1D1436"/>
    </linearGradient>
    <linearGradient id="staffC2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9B6FF"/>
      <stop offset="100%" stop-color="#7B4FF2"/>
    </linearGradient>
    <linearGradient id="iceC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFF6FF"/>
      <stop offset="100%" stop-color="#6EC7F5"/>
    </linearGradient>
    <filter id="softC2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bgC2)"/>
  <rect width="500" height="400" fill="url(#haloC2)"/>

  <!-- что сказал ребёнок: слова-карточки, из которых собран запрос -->
  <g>
    <rect x="52" y="40" width="396" height="72" rx="20" fill="url(#cardC2)"
          stroke="#3F2F72" stroke-width="2"/>
    <text x="72" y="68" font-family="Nunito,system-ui,sans-serif" font-size="12.5"
          font-weight="900" fill="#9B84D8" letter-spacing="1.4">ТВОЙ ЗАПРОС</text>
    <g font-family="Nunito,system-ui,sans-serif" font-size="17" font-weight="800">
      <rect x="70" y="76" width="88" height="26" rx="13" fill="#3A2A6B"/>
      <text x="84" y="94" fill="#E6DBFF">ледяной</text>
      <rect x="166" y="76" width="76" height="26" rx="13" fill="#3A2A6B"/>
      <text x="180" y="94" fill="#E6DBFF">посох</text>
      <rect x="250" y="76" width="60" height="26" rx="13" fill="#3A2A6B"/>
      <text x="264" y="94" fill="#E6DBFF">с</text>
      <rect x="318" y="76" width="106" height="26" rx="13" fill="#3A2A6B"/>
      <text x="332" y="94" fill="#E6DBFF">рунами</text>
    </g>
  </g>

  <!-- стрелка: запрос уходит в работу -->
  <g stroke="#8B71D6" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M250 124v26"/>
    <path d="M240 142l10 10 10-10"/>
  </g>

  <!-- что получилось: ровно то, что названо -->
  <g transform="translate(250 240)">
    <ellipse cy="84" rx="104" ry="15" fill="#A98BFF" opacity=".16" filter="url(#softC2)"/>
    <!-- древко -->
    <rect x="-9" y="-58" width="18" height="140" rx="9" fill="url(#staffC2)"/>
    <!-- обмотка -->
    <g fill="#5B3FA8">
      <rect x="-13" y="-6" width="26" height="11" rx="5"/>
      <rect x="-13" y="14" width="26" height="11" rx="5"/>
      <rect x="-13" y="34" width="26" height="11" rx="5"/>
    </g>
    <!-- ледяной кристалл -->
    <path d="M0-124l34 38-34 42-34-42z" fill="url(#iceC2)"/>
    <path d="M0-124l34 38-34 10-34-10z" fill="#FFFFFF" opacity=".55"/>
    <circle cy="-86" r="44" fill="#8FD8FF" opacity=".2" filter="url(#softC2)"/>
    <!-- руны на древке: их просили отдельным словом -->
    <g stroke="#FFD84D" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M-3-40h6M0-44v8"/>
      <path d="M-3-22l6 6M3-22l-6 6"/>
      <path d="M-3 58h6M0 54v8M-3 66h6"/>
    </g>
    <!-- снежинки: «ледяной» тоже исполнено буквально -->
    <g fill="#CFEEFF" opacity=".8">
      <path d="M-62-64l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
      <path d="M64-38l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
      <path d="M-78 16l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    </g>
  </g>

  <!-- подпись результата -->
  <g transform="translate(250 372)">
    <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#1B1236"
          stroke="#6E56C4" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="Nunito,system-ui,sans-serif"
          font-size="17" font-weight="800" fill="#DCCFFF">Слово в слово — без лишнего</text>
  </g>
</svg>
