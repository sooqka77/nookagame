<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1330"/>
      <stop offset="60%" stop-color="#100B22"/>
      <stop offset="100%" stop-color="#0A0716"/>
    </linearGradient>
    <radialGradient id="glowD" cx=".5" cy=".45">
      <stop offset="0%" stop-color="#4ED99B" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4ED99B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsD" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#fff" opacity=".14"/>
    </pattern>
    <filter id="softD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bgD)"/>
  <ellipse cx="250" cy="190" rx="230" ry="170" fill="url(#glowD)"/>

  <!-- доска, на которой ребёнок рисует -->
  <rect x="88" y="34" width="324" height="316" rx="30" fill="#0E0A1C" stroke="rgba(255,255,255,.10)" stroke-width="2"/>
  <rect x="88" y="34" width="324" height="316" rx="30" fill="url(#dotsD)"/>

  <!-- кот: та самая детская линия из игры -->
  <g fill="none" stroke="#7FE7FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".5" filter="url(#softD)">
      <path d="M250 250 q-62 -8 -62 -58 q0 -50 62 -58 q62 8 62 58 q0 50 -62 58 Z"/>
    </g>
    <path d="M252 252 q-64 -6 -63 -60 q1 -52 63 -57 q62 5 63 57 q1 54 -63 60 Z"/>
    <path d="M196 148 l-9 -50 l43 32"/>
    <path d="M308 148 l10 -50 l-44 32"/>
    <path d="M188 196 l-46 -9"/>
    <path d="M316 196 l46 -9"/>
    <circle cx="225" cy="180" r="4.5" fill="#7FE7FF"/>
    <circle cx="279" cy="180" r="4.5" fill="#7FE7FF"/>
  </g>

  <!-- ответ Нейро: он узнал кота -->
  <g transform="translate(120,300)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="rgba(78,217,155,.16)" stroke="rgba(78,217,155,.5)" stroke-width="1.6"/>
    <circle cx="24" cy="17" r="9" fill="#4ED99B"/>
    <path d="M19 17 l4 4 l7 -8" fill="none" stroke="#0A0716" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="23" fill="#C4F4E0" style="font:700 15px Nunito,system-ui,sans-serif">Это кот · уверен на 86%</text>
  </g>
</svg>
