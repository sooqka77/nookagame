<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход — Nooka</title>
<meta name="description" content="Вход в Nooka по почте: прогресс ребёнка, награды и доступ к играм.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link href="/account/account.css" rel="stylesheet">
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="../"><img src="../logo.svg" alt="Nooka"></a>
    <a class="back" href="../">← На главную</a>
  </div>

  <section id="stepEmail">
    <h1>Вход в Nooka</h1>
    <p class="lede">Введите почту — пришлём код для входа. Пароль придумывать не нужно.</p>
    <form class="card" id="formEmail" novalidate>
      <label class="field">
        <span>Почта</span>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off"
               spellcheck="false" placeholder="mama@mail.ru" required maxlength="254">
      </label>
      <button class="btn btn--pri btn--wide" id="sendBtn" type="submit">Получить код</button>
      <div class="msg" id="emailMsg" role="alert"></div>
    </form>
    <p class="hint">Вход для взрослых. Здесь хранится прогресс ребёнка, его награды и доступ к играм — на любом устройстве.</p>
  </section>

  <section id="stepCode" hidden>
    <h1>Проверьте почту</h1>
    <p class="lede">Отправили код на <b id="sentTo"></b>. Письмо может идти пару минут — загляните и в «Спам».</p>
    <form class="card" id="formCode" novalidate>
      <label class="field">
        <span>Код из письма</span>
        <input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="······" required>
      </label>
      <button class="btn btn--pri btn--wide" id="verifyBtn" type="submit">Войти</button>
      <div class="msg" id="codeMsg" role="alert"></div>
      <div class="links">
        <button class="lnk" id="resend" type="button" disabled>Отправить код ещё раз</button>
        <button class="lnk" id="changeEmail" type="button">Другая почта</button>
      </div>
    </form>
  </section>

</div>
<script src="../games/nooka-account.js"></script>
<script src="../games/nooka-login.js"></script>
</body>
</html>
